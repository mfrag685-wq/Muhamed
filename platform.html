var REC=/شهري|سنوي|الإهلاك|الإطفاء/;
function impactBox(t){ var list=buildJE(t); if(!list.length) return '';
  var o=G.o||{}, steps=[], bal={}, accs=[];
  var apply=function(e){ e.lines.forEach(function(l){ if(accs.indexOf(l.a)<0) accs.push(l.a); bal[l.a]=(bal[l.a]||0)+l.dr-l.cr; }); };
  var snap=function(label){ var s={label:label,b:{}}; accs.forEach(function(a){ s.b[a]=bal[a]||0; }); var A=0,L=0,E=0,P=0;
    for(var a in bal){ var ty=accType(a), v=bal[a]; if(ty==='asset') A+=v; else if(ty==='liab') L-=v; else if(ty==='equity') E-=v; else P-=v; }
    s.A=r2(A); s.L=r2(L); s.E=r2(E); s.P=r2(P); steps.push(s); };
  list.forEach(function(e,i){ var R=(i>0&&REC.test(e.t))?Math.max(1,Math.min(24,Math.round(+o.m||+o.life||+o.n||1))):1;
    for(var k=1;k<=R;k++){ apply(e); snap(R>1?(o.m&&!o.life?'الشهر ':'السنة ')+k:e.t); } });
  var show=steps.length>8?steps.slice(0,3).concat([null]).concat(steps.slice(-3)):steps;
  var cols=accs.slice(0,6), val=function(a,v){ var n=accNature(a)==='dr'?v:-v; return Math.abs(n)<0.005?'—':fmt(n); };
  var h='<div class="panel learn"><h3>📊 الأثر على القوائم المالية خطوة بخطوة</h3><div class="mini" style="margin-bottom:8px">التغيّر التراكمي في كل حساب منذ بداية المعاملة (الموجب زيادة بطبيعة الحساب والسالب نقص)، مع التحقق من معادلة الميزانية ⚖️ في كل خطوة.</div>'
    +'<div class="tbl-wrap"><table class="imp"><thead><tr><th>الخطوة</th>'+cols.map(function(a){ var g=accGroup(a); return '<th class="r">'+esc(accName(a))+'<div class="mini">'+(g[2]==='pl'?'قائمة الدخل':'المركز المالي')+'</div></th>'; }).join('')+'<th class="r">⚖️</th></tr></thead><tbody>'
    +show.map(function(s){ if(!s) return '<tr><td colspan="'+(cols.length+2)+'" class="mini" style="text-align:center">⋯</td></tr>';
      var eqOk=Math.abs(s.A-(s.L+s.E+s.P))<0.01; return '<tr><td>'+esc(s.label)+'</td>'+cols.map(function(a){ return '<td class="r num">'+val(a,s.b[a])+'</td>'; }).join('')+'<td class="r">'+(eqOk?'✅':'⚠')+'</td></tr>'; }).join('')+'</tbody></table></div>';
  var last=steps[steps.length-1], bs=[], pl=[];
  cols.forEach(function(a){ var v=accNature(a)==='dr'?last.b[a]:-last.b[a]; if(Math.abs(v)<0.005) return; var g=accGroup(a), ty=accType(a);
    if(g[2]==='pl') pl.push((ty==='exp'?'مصروف':'إيراد')+' «'+accName(a)+'» '+fmt(Math.abs(v))+(ty==='exp'?' يخفض الربح':' يزيد الربح'));
    else bs.push((v>0?'زيادة':'نقص')+' «'+accName(a)+'» '+fmt(Math.abs(v))); });
  h+='<div class="sum"><div>🏛️ <b>الأثر على المركز المالي:</b> '+(bs.length?esc(bs.join('، ')):'لا أثر صافٍ')+'</div><div>📈 <b>الأثر على قائمة الربح أو الخسارة:</b> '+(pl.length?esc(pl.join('، ')):'لا أثر على الربح')+'</div>'
    +'<div>⚖️ <b>معادلة الميزانية (التغيّر):</b> الأصول '+fmt(last.A)+' = الالتزامات '+fmt(last.L)+' + حقوق الملكية '+fmt(r2(last.E+last.P))+(Math.abs(last.P)>0.005?' (عبر '+(last.P<0?'نقص':'زيادة')+' الربح بـ '+fmt(Math.abs(last.P))+')':'')+' ✅</div></div></div>';
  return h; }

var AR_MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function pD(s){ var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||'')); return m?Date.UTC(+m[1],+m[2]-1,+m[3]):null; }
function fD(t){ var d=new Date(t); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0'); }
function fDar(s){ var p=String(s).split('-'); return +p[2]+' '+AR_MONTHS[+p[1]-1]+' '+p[0]; }
var DAY=864e5;
function addMonths(s,n){ var t=pD(s), d=new Date(t); return fD(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+n,d.getUTCDate())); }
function monthEndOf(t){ var d=new Date(t); return Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0); }
/* جدول التوزيع: months = شهرياً بالتساوي مع تناسب الشهر الجزئي بأيامه ، days = حسب الأيام الفعلية */
function allocSchedule(amount,from,to,meth){
  var s=pD(from), e=pD(to), rows=[]; if(s==null||e==null||e<s||!(amount>0)) return rows;
  var cur=s; while(cur<=e&&rows.length<120){ var me=Math.min(monthEndOf(cur),e), days=Math.round((me-cur)/DAY)+1, d=new Date(cur), dim=new Date(monthEndOf(cur)).getUTCDate();
    rows.push({y:d.getUTCFullYear(),m:d.getUTCMonth(),label:AR_MONTHS[d.getUTCMonth()]+' '+d.getUTCFullYear(),from:fD(cur),to:fD(me),days:days,dim:dim,w:meth==='days'?days:days/dim});
    cur=me+DAY; }
  var W=0; rows.forEach(function(r){ W+=r.w; }); var acc=0;
  rows.forEach(function(r,i){ r.amt=i<rows.length-1?r2(amount*r.w/W):r2(amount-acc); acc=r2(acc+r.amt); r.cum=acc; r.left=r2(amount-acc); });
  return rows; }
function defFrom(){ var d=new Date(); return fD(Date.UTC(d.getFullYear(),d.getMonth(),1)); }

function jeBoxHTML(t){ var list=buildJE(t), raw=t.je(G.o||{}), sch=t.alloc?allocSchedule(G.o.amt,G.o.from,G.o.to,G.o.meth):[];

    +'<div style="overflow-x:auto"><table class="sch"><thead><tr><th>الشهر</th><th class="r">نصيب الشهر</th><th class="r">المتبقي '+(t.alloc==='التزام'?'(مؤجل)':'(مقدماً)')+'</th></tr></thead><tbody>'
    +sch.map(function(s){ return '<tr><td><b>'+s.label+'</b><div class="mini">'+(+s.from.slice(8))+'–'+(+s.to.slice(8))+' · '+s.days+(s.days<s.dim?'/'+s.dim:'')+' يوم</div></td><td class="r num"><b>'+fmt(s.amt)+'</b></td><td class="r num">'+fmt(s.left)+'</td></tr>'; }).join('')

  var yrs={}; sch.forEach(function(s){ yrs[s.y]=r2((yrs[s.y]||0)+s.amt); }); var ys=Object.keys(yrs).sort();

  return h; }
