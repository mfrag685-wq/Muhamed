<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>منصة الأعمال المتكاملة — إعداد محمد فرج</title>
<link rel="manifest" href="manifest.platform.json">
<meta name="theme-color" content="#152420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="منصة الأعمال">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<!--
  ===========================================================
   منصة الأعمال المتكاملة — المحاسبة والمراجعة والمقاولات والعمليات
   (دليل المعايير الذكي + مركز العمليات الموحّد + الصلاحيات + التقارير والأرشفة)
   إعداد وتصميم: محمد فرج — جميع الحقوق محفوظة © 2026
  ===========================================================
-->
<style>
:root{
  --ink:#152420;--ink-2:#3f524a;--ink-3:#6b7d74;
  --canvas:#e9eee9;--surface:#fff;--surface-2:#f5f8f4;
  --line:#d2dad1;--line-soft:#e6ebe5;
  --leaf:#2c7a52;--leaf-dark:#1c5638;--leaf-soft:#e5f1e9;
  --tomato:#c0402a;--tomato-soft:#fbeae6;
  --citrus:#c1841a;--citrus-soft:#fdf3de;
  --sky:#37648b;--sky-soft:#e8f0f6;
  --plum:#6b4c9a;--plum-soft:#f0ebf7;
  --shadow:0 1px 2px rgba(21,36,32,.06),0 10px 28px rgba(21,36,32,.06);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --nav-h:62px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;background:var(--canvas);color:var(--ink);
  font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%;min-height:100vh;
  padding-bottom:calc(var(--nav-h) + var(--safe-b) + 12px)}
.hidden{display:none!important}
a{color:var(--leaf-dark)}
.num,.ltr{direction:ltr;unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}

/* ===== أزرار (مقاس لمس ≥ 44px على الجوال) ===== */
button{font-family:inherit;font-size:14px;cursor:pointer;border-radius:10px;border:1px solid transparent;transition:.15s;min-height:40px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--citrus);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.btn{padding:8px 14px;background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn:hover:not(:disabled){background:var(--surface-2)}
.btn-main{padding:10px 20px;background:var(--leaf);color:#fff;font-weight:700}
.btn-main:hover:not(:disabled){background:var(--leaf-dark)}
.btn-alt{padding:9px 16px;background:var(--sky);color:#fff;font-weight:700}
.btn-alt:hover:not(:disabled){background:#2a4f6d}
.btn-warn{padding:9px 16px;background:var(--citrus);color:#fff;font-weight:700}
.btn-del{padding:8px 14px;background:var(--surface);color:var(--tomato);border-color:#ecccc4}
.btn-del:hover:not(:disabled){background:var(--tomato-soft)}
.btn-sm{padding:4px 10px;font-size:12.5px;min-height:34px;background:var(--surface);border-color:var(--line);color:var(--ink-2)}
.btn-ghost{padding:7px 12px;background:transparent;border-color:#3f5449;color:#dbe7e0;font-size:13px}
.btn-ghost:hover{background:#213229}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* ===== حقول ===== */
label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
input,select,textarea{width:100%;font-family:inherit;font-size:16px;/* 16px يمنع تكبير iOS التلقائي */
  padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
textarea{min-height:90px;resize:vertical;line-height:1.7}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--leaf)}
.field{margin-bottom:12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.mini{font-size:12px;color:var(--ink-3);font-weight:400}

/* ===== شاشة الدخول (نفس هوية النظام السحابي) ===== */
#loginScreen{position:fixed;inset:0;background:linear-gradient(160deg,#152420,#24413a 60%,#2c7a52);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:300;overflow:auto}
.login-card{background:#fff;border-radius:18px;padding:32px 26px;width:100%;max-width:410px;
  box-shadow:0 24px 60px rgba(0,0,0,.35);text-align:center;margin:auto}
.login-card .mark{width:58px;height:58px;border-radius:16px;background:var(--leaf-soft);color:var(--leaf-dark);
  display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 14px}
.login-card h2{font-size:21px;margin-bottom:4px}
.login-card .lead{font-size:13px;color:var(--ink-3);margin-bottom:20px}
.login-card .field{text-align:right}
.login-err{background:var(--tomato-soft);color:var(--tomato);border-radius:8px;padding:9px;font-size:13px;margin-bottom:12px;display:none;text-align:right}
.login-note{background:var(--leaf-soft);color:var(--leaf-dark);border-radius:8px;padding:9px;font-size:12.5px;margin-bottom:12px;text-align:right;line-height:1.7}
.author-tag{margin-top:20px;padding-top:16px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--ink-3)}
.author-tag b{color:var(--leaf-dark)}

/* ===== الترويسة ===== */
.topbar{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;
  padding:calc(10px + var(--safe-t)) 14px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.topbar .mark{width:38px;height:38px;border-radius:10px;background:#22332c;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.topbar h1{font-size:16px;font-weight:800;line-height:1.2}
.topbar .sub{font-size:11.5px;color:#9db3a7}
.topbar .grow{flex:1;min-width:0}
.topbar .grow h1,.topbar .grow .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.userbox{display:flex;align-items:center;gap:8px;background:#22332c;padding:4px 6px 4px 12px;border-radius:22px;cursor:pointer;border:0;color:#fff;min-height:40px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--leaf);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.userbox .un{font-size:12.5px;font-weight:700;line-height:1.2;text-align:right}
.userbox .ur{font-size:10.5px;color:#9db3a7;text-align:right}
.cloud-status{font-size:11px;padding:3px 9px;border-radius:12px;background:#22332c;color:#9db3a7;white-space:nowrap}
.cloud-status.ok{background:#1f4a35;color:#bfe5cf}.cloud-status.err{background:#5a2a20;color:#ffd5cb}.cloud-status.sync{background:#4a3a14;color:#ffe2a6}

/* ===== التنقل: شريط سفلي للجوال + جانبي للكمبيوتر ===== */
.layout{display:flex;max-width:1500px;margin:0 auto}
.sidenav{display:none}
.main{flex:1;min-width:0;padding:14px}
.bottomnav{position:fixed;bottom:0;right:0;left:0;z-index:60;background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:4px 4px calc(4px + var(--safe-b));box-shadow:0 -4px 16px rgba(21,36,32,.07)}
.bottomnav button{flex:1;background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;
  color:var(--ink-3);font-size:11px;font-weight:700;padding:5px 2px;min-height:52px;border-radius:12px}
.bottomnav button .ic{font-size:20px;line-height:1}
.bottomnav button.active{color:var(--leaf-dark);background:var(--leaf-soft)}
@media(min-width:1000px){
  body{padding-bottom:0}
  .bottomnav{display:none}
  .sidenav{display:block;width:250px;flex-shrink:0;padding:14px 14px 14px 0;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}
  .main{padding:18px}
}
.sidenav .grp{font-size:11.5px;color:var(--ink-3);font-weight:800;margin:14px 10px 6px}
.sidenav button{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;padding:9px 12px;
  border-radius:10px;color:var(--ink-2);font-weight:700;text-align:right}
.sidenav button:hover{background:#fff}
.sidenav button.active{background:var(--ink);color:#fff}
.sidenav button .ic{width:22px;text-align:center}

/* درج «المزيد» للجوال */
.sheet-back{position:fixed;inset:0;background:rgba(10,20,16,.45);z-index:90;opacity:0;pointer-events:none;transition:.2s}
.sheet-back.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;right:0;left:0;bottom:0;z-index:95;background:#fff;border-radius:20px 20px 0 0;
  padding:8px 14px calc(16px + var(--safe-b));max-height:86vh;overflow:auto;transform:translateY(105%);transition:transform .25s ease}
.sheet.open{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sheet-grid button{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:14px;padding:12px 4px;
  display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:12.5px;color:var(--ink-2);min-height:76px}
.sheet-grid button .ic{font-size:24px}
@media(min-width:700px){.sheet{max-width:560px;margin:0 auto}}

/* ===== لوحات وبطاقات ===== */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 0 14px}
.page-head h2{font-size:21px;font-weight:800;line-height:1.3}
.page-head p{font-size:13px;color:var(--ink-3)}
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.panel h3{font-size:16px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:#fff;border:1px solid var(--line-soft);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .k{font-size:12px;color:var(--ink-3);font-weight:700}
.kpi .v{font-size:20px;font-weight:800;margin-top:2px}
.kpi.leaf .v{color:var(--leaf-dark)}.kpi.sky .v{color:var(--sky)}.kpi.citrus .v{color:var(--citrus)}.kpi.tomato .v{color:var(--tomato)}

/* بطاقات الأدوات (مركز الأدوات) */
.tools{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){.tools{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1200px){.tools{grid-template-columns:repeat(3,1fr)}}
.tool{background:linear-gradient(150deg,#fff,#f5f8f4);border:1px solid var(--line-soft);border-radius:18px;padding:16px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:right;transition:.15s}
.tool:hover{border-color:var(--leaf);transform:translateY(-1px)}
.tool .ti{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--leaf-soft)}
.tool h4{font-size:17px;font-weight:800}
.tool p{font-size:13.5px;color:var(--ink-2);line-height:1.8}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line-soft);color:var(--ink-2)}
.tool .open{color:var(--citrus);font-weight:800;font-size:13.5px;margin-top:auto}

/* شارات */
.pill{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:12px;white-space:nowrap}
.pill-ok{background:var(--leaf-soft);color:var(--leaf-dark)}.pill-info{background:var(--sky-soft);color:var(--sky)}
.pill-warn{background:var(--citrus-soft);color:#8a5a0c}.pill-bad{background:var(--tomato-soft);color:var(--tomato)}
.pill-plum{background:var(--plum-soft);color:var(--plum)}.pill-mute{background:#eef1ee;color:var(--ink-3)}

/* ===== جداول: جدول عادي على الكمبيوتر وبطاقات على الجوال ===== */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{background:var(--surface-2);color:var(--ink-2);font-weight:800;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafcfa}
td.r,th.r{text-align:left}
tfoot td{font-weight:800;background:var(--surface-2)}
@media(max-width:700px){
  .tbl-cards{border:0;background:transparent}
  .tbl-cards table,.tbl-cards tbody,.tbl-cards tr,.tbl-cards td{display:block;width:100%}
  .tbl-cards thead{display:none}
  .tbl-cards tr{background:#fff;border:1px solid var(--line-soft);border-radius:14px;margin-bottom:10px;padding:8px 12px;box-shadow:var(--shadow)}
  .tbl-cards td{border:0;padding:5px 0;display:flex;justify-content:space-between;gap:12px;text-align:left}
  .tbl-cards td::before{content:attr(data-l);font-weight:700;color:var(--ink-3);font-size:12.5px;text-align:right}
  .tbl-cards td.act{justify-content:flex-start;flex-wrap:wrap;gap:6px;padding-top:8px;border-top:1px dashed var(--line-soft);margin-top:4px}
  .tbl-cards td.act::before{display:none}
  .tbl-cards tfoot tr{background:var(--surface-2)}
}
.empty{text-align:center;color:var(--ink-3);padding:28px 10px;font-size:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{flex:1;min-width:140px}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:22px;padding:6px 14px;font-weight:700;color:var(--ink-2);min-height:38px}
.seg button.active{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ===== نافذة منبثقة (ملء الشاشة على الجوال) ===== */
.modal-back{position:fixed;inset:0;background:rgba(10,20,16,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:820px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:0 0 calc(14px + var(--safe-b));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.modal-head{position:sticky;top:0;background:#fff;padding:14px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;z-index:2}
.modal-head h3{flex:1;font-size:17px;font-weight:800}
.modal-body{padding:14px 16px}
.modal-foot{position:sticky;bottom:0;background:#fff;padding:10px 16px;border-top:1px solid var(--line-soft);display:flex;gap:8px;flex-wrap:wrap}
.modal-foot .btn-main{flex:1}
@media(min-width:760px){.modal-back{align-items:center;padding:20px}.modal{border-radius:18px;padding-bottom:0}}
.x{background:var(--surface-2);border:0;width:40px;height:40px;border-radius:50%;font-size:18px}

/* سطور المستند (أمر شراء/فاتورة…) */
.lines .line{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end;padding:10px;border:1px solid var(--line-soft);border-radius:12px;margin-bottom:8px;background:var(--surface-2)}
.lines .line label{font-size:11.5px}
@media(max-width:600px){.lines .line{grid-template-columns:1fr 1fr}.lines .line .full{grid-column:1/-1}}
.totals{display:grid;gap:4px;background:var(--leaf-soft);border-radius:12px;padding:10px 14px;margin-top:8px;font-size:14px}
.totals div{display:flex;justify-content:space-between}
.totals .grand{font-size:17px;font-weight:800;color:var(--leaf-dark);border-top:1px solid #c7e0d0;padding-top:4px}

/* ===== دليل المعايير ===== */
.guide-hero{background:linear-gradient(150deg,#152420,#24413a 65%,#2c7a52);color:#fff;border-radius:20px;padding:20px 18px;margin-bottom:14px}
.guide-hero h2{font-size:22px;font-weight:800;line-height:1.35}
.guide-hero p{color:#cfe0d6;font-size:13.5px;margin-top:6px}
.search-box{display:flex;gap:8px;margin-top:14px;background:#fff;border-radius:14px;padding:6px}
.search-box input{border:0;min-height:46px;font-size:16px}
.search-box button{flex-shrink:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chip{background:rgba(255,255,255,.12);color:#eaf3ee;border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:5px 12px;font-size:12.5px;font-weight:700;min-height:34px}
.chip:hover{background:rgba(255,255,255,.22)}
.std-badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.std-badge{font-size:12px;font-weight:800;padding:3px 10px;border-radius:12px;background:var(--sky-soft);color:var(--sky);cursor:pointer;border:0;min-height:28px}
.std-badge.isa{background:var(--plum-soft);color:var(--plum)}
.std-badge.socpa{background:var(--citrus-soft);color:#8a5a0c}
.sec{display:flex;gap:12px;padding:12px;border:1px solid var(--line-soft);border-radius:14px;margin-bottom:10px;background:#fff}
.sec .si{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.sec h5{font-size:15px;font-weight:800;margin-bottom:3px}
.sec .sc{font-size:14px;color:var(--ink-2);line-height:1.85}
.sec ul{padding-right:18px}.sec li{margin-bottom:3px}
.si.c1{background:var(--sky-soft)}.si.c2{background:var(--plum-soft)}.si.c3{background:#eef1ee}.si.c4{background:var(--citrus-soft)}
.si.c5{background:var(--leaf-soft)}.si.c6{background:#e7f3ef}.si.c7{background:var(--leaf-soft)}.si.c8{background:var(--tomato-soft)}
.je{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;margin:8px 0}
.je table{font-size:13.5px}
.je td.dr{color:var(--leaf-dark);font-weight:700}.je td.cr{color:var(--sky);font-weight:700}
.je .ind{padding-right:26px}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;background:var(--surface-2);padding:12px;border-radius:12px;margin-bottom:8px}
.disclaimer{font-size:12px;color:var(--ink-3);background:var(--surface-2);border-radius:10px;padding:10px;line-height:1.8}
.result-card{border-right:4px solid var(--leaf)}
.match-list button{display:block;width:100%;text-align:right;background:#fff;border:1px solid var(--line-soft);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.match-list button:hover{border-color:var(--leaf)}
.match-list b{display:block}
.match-list span{font-size:12px;color:var(--ink-3)}

/* شاشة التطبيقات والاختصارات */
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.quick button{flex-shrink:0;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:8px 14px;font-weight:800;color:var(--ink);min-height:44px;box-shadow:var(--shadow)}
.quick button span{font-size:18px}
.apps-h{font-size:12.5px;font-weight:800;color:var(--ink-3);margin:16px 4px 8px}
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 8px}
@media(min-width:700px){.apps{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media(min-width:1200px){.apps{grid-template-columns:repeat(8,minmax(0,1fr))}}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;border:0;padding:4px 2px;text-decoration:none;color:var(--ink);min-height:0}
.app .ai{width:58px;height:58px;border-radius:17px;background:#fff;border:1px solid var(--line-soft);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-size:27px;transition:.15s}
.app:hover .ai{transform:translateY(-2px);border-color:var(--leaf)}
.app .an{font-size:12px;font-weight:700;text-align:center;line-height:1.35;color:var(--ink-2)}
.app-x .ai{background:linear-gradient(150deg,#fdf3de,#fff);border-color:#efd9a8}
/* بطاقات الحالات */
.cases{display:grid;gap:10px}
@media(min-width:900px){.cases{grid-template-columns:repeat(2,minmax(0,1fr))}}
.case{background:#fff;border:1px solid var(--line-soft);border-radius:14px;padding:12px;cursor:pointer;transition:.15s}
.case:hover{border-color:var(--leaf);box-shadow:var(--shadow)}
.case-h{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.case-h b{font-size:14.5px;line-height:1.5}
.case-n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.case-go{color:var(--citrus);font-weight:800;font-size:20px;line-height:1}
.mje{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:12.5px}
.mje div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.mje .d span{color:var(--leaf-dark);font-weight:700}
.mje .c span{color:var(--sky);font-weight:700;padding-right:14px}
.mje .more{color:var(--ink-3);font-size:11.5px;display:block;border-top:1px dashed var(--line);margin-top:4px;padding-top:4px}
details.cat{border-bottom:1px solid var(--line-soft);padding:8px 0}
details.cat summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;min-height:36px}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary::before{content:'◂';color:var(--ink-3);transition:.15s}
details.cat[open] summary::before{transform:rotate(-90deg)}
/* موقع الحساب */
a.acc{color:inherit;text-decoration:underline dotted;text-underline-offset:4px;cursor:pointer}
a.acc:hover{color:var(--leaf-dark)}
.doc-print a.acc{text-decoration:none}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:4px;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.crumb i{color:var(--ink-3);font-style:normal}
.crumb .last{background:var(--ink);color:#fff;border-radius:8px;padding:2px 8px}
.effect{margin-top:10px;border-radius:12px;padding:10px 12px;font-size:14px}
.effect.up{background:var(--leaf-soft);color:var(--leaf-dark)}.effect.down{background:var(--sky-soft);color:var(--sky)}
.ainf{background:#fff;border:1px solid var(--line-soft);border-radius:10px;padding:8px 10px;font-size:13.5px;font-weight:700}
.coa-l2{font-weight:800;color:var(--ink);margin:12px 4px 4px;font-size:14px}
.coa-l3{font-size:12.5px;color:var(--ink-3);font-weight:800;margin:8px 10px 4px}
.coa-acc{display:flex;align-items:center;gap:8px;width:100%;background:#fff;border:1px solid var(--line-soft);border-radius:10px;padding:8px 10px;margin-bottom:5px;text-align:right}
.coa-acc:hover{border-color:var(--leaf)}
.coa-c{color:var(--ink-3);font-size:12.5px;min-width:38px}.coa-n{flex:1;font-weight:700;font-size:13.5px}
.coa-b{min-width:80px;text-align:left;font-weight:800;font-size:13px}.coa-b.neg{color:var(--tomato)}
.jwarn{margin-top:8px;background:var(--citrus-soft);color:#7a4f0a;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.8}
/* المراجعة الآلية للقيد */
.jaudit{border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.85;margin:8px 0}
.jaudit.ok{background:var(--leaf-soft);color:var(--leaf-dark)}
.jaudit.bad{background:var(--tomato-soft);color:var(--tomato)}
.jaudit b{display:block;margin-bottom:2px;font-size:13.5px}
/* جدول التوزيع */
table.sch th,table.sch td{padding:7px 6px;font-size:12.5px}
table.sch td:first-child{white-space:nowrap}
/* الدليل التعليمي */
.learn{border-right:4px solid var(--sky)}
.rule{background:var(--sky-soft);color:var(--sky);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.wh{font-weight:800;font-size:13px;color:var(--ink-3);margin:10px 0 4px}
.why{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line-soft);font-size:14px}
.why:last-child{border-bottom:0}
.side{flex-shrink:0;font-size:11.5px;font-weight:800;border-radius:8px;padding:3px 9px;margin-top:2px}
.side.dr{background:var(--leaf-soft);color:var(--leaf-dark)}.side.cr{background:var(--sky-soft);color:var(--sky)}
.mist{background:var(--tomato-soft);color:#8a2f1f;border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:13.5px;line-height:1.8}
table.imp th,table.imp td{font-size:12.5px;white-space:normal}
.sum{background:var(--surface-2);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13.5px;line-height:2}
.qz-btn{width:100%;margin:6px 0 4px;min-height:46px}
.qz-h{font-weight:800;margin:12px 0 6px}
.qz{border:1px solid var(--line-soft);border-radius:12px;padding:10px;margin-bottom:8px;background:#fff}
.qz-a{font-weight:800;margin-bottom:8px}
.qz-b{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.qz-b button{background:var(--surface-2);border:1px solid var(--line);font-weight:700;min-height:42px}
.qz-b button.on.dr{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.qz-b button.on.cr{background:var(--sky);color:#fff;border-color:var(--sky)}
.qz-b button.on.no{background:var(--ink-3);color:#fff;border-color:var(--ink-3)}
.qz-r{margin-top:8px;border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.8}
.qz-r.ok{background:var(--leaf-soft);color:var(--leaf-dark)}.qz-r.bad{background:var(--tomato-soft);color:var(--tomato)}
.qz-score{background:var(--citrus-soft);color:#7a4f0a;border-radius:12px;padding:12px;font-weight:800;font-size:16px;text-align:center;margin-bottom:10px}
.qz-score.ok{background:var(--leaf-soft);color:var(--leaf-dark)}
/* إشعار */
#toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:22px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:400;max-width:92vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
@media(min-width:1000px){#toast{bottom:24px}}

/* صلاحيات */
.perm-grid{overflow-x:auto}
.perm-grid table td,.perm-grid table th{text-align:center;padding:6px}
.perm-grid table td:first-child,.perm-grid table th:first-child{text-align:right;white-space:nowrap}

/* ===== الطباعة: نموذج احترافي ===== */
#printArea{display:none}
.doc-print{font-family:"Tajawal",Tahoma,sans-serif;color:#111;background:#fff;padding:0}
.doc-print .ph{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #152420;padding-bottom:10px;margin-bottom:14px}
.doc-print .ph .co{font-size:20px;font-weight:800}
.doc-print .ph .co small{display:block;font-size:12px;font-weight:400;color:#555}
.doc-print .ph .dt{text-align:left;font-size:12px}
.doc-print .ph .dt b{display:block;font-size:18px;color:#152420}
.doc-print .meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:13px;margin-bottom:12px}
.doc-print table{font-size:12.5px;border:1px solid #999}
.doc-print th{background:#152420!important;color:#fff!important;border:1px solid #152420}
.doc-print td{border:1px solid #bbb}
.doc-print .sign{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px;font-size:12.5px;text-align:center}
.doc-print .sign div{border-top:1px solid #333;padding-top:6px}
.doc-print .pf{margin-top:24px;border-top:1px solid #ccc;padding-top:6px;font-size:10.5px;color:#666;display:flex;justify-content:space-between}
.doc-print h4{margin:14px 0 6px;font-size:14px}
.doc-print .np{display:none!important}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;padding:0}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr{page-break-inside:avoid}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>

   ────────────────────────────────────────────────────────────────────────

   كما اعتمدتها الهيئة السعودية للمراجعين والمحاسبين (SOCPA) والمعايير الدولية

   ========================================================================== */

/* ===== دليل الحسابات الموحّد (يُستخدم في القيود الآلية للدليل والعمليات) ===== */
var COA={
  '1101':'الصندوق','1102':'البنك','1110':'العهد والسلف المؤقتة',
  '1201':'العملاء (ذمم مدينة تجارية)','1202':'محتجزات لدى العملاء','1203':'أصول العقود (أعمال منفذة غير مفوترة)',
  '1205':'مخصص الخسائر الائتمانية المتوقعة','1210':'دفعات مقدمة للموردين','1220':'مصروفات مدفوعة مقدماً',
  '1230':'ضريبة القيمة المضافة — مدخلات','1240':'مستحق من أطراف ذات علاقة',
  '1301':'المخزون','1350':'أصول محتفظ بها للبيع','1401':'استثمارات بالقيمة العادلة',
  '1501':'ممتلكات وآلات ومعدات','1502':'مجمع الإهلاك','1503':'أراضٍ',
  '1510':'أصول حق الاستخدام','1511':'مجمع استهلاك حق الاستخدام','1520':'عقارات استثمارية',
  '1530':'أصول غير ملموسة','1531':'مجمع الإطفاء','1540':'أعمال رأسمالية تحت التنفيذ','1600':'أصول ضريبية مؤجلة',
  '2101':'الموردون (ذمم دائنة)','2102':'محتجزات مقاولي الباطن','2110':'مصروفات مستحقة',

  '2140':'الزكاة المستحقة','2141':'ضريبة الدخل المستحقة','2150':'توزيعات أرباح مستحقة','2160':'مخصصات',

  '3101':'رأس المال','3201':'الأرباح المبقاة','3301':'احتياطي القيمة العادلة (دخل شامل آخر)','3302':'احتياطي إعادة قياس منافع الموظفين',
  '4101':'إيرادات المبيعات','4102':'إيرادات عقود المقاولات','4201':'إيرادات أخرى','4202':'أرباح استبعاد أصول',
  '4203':'إيراد المنح الحكومية','4204':'أرباح فروق عملة','4205':'أرباح تغيّر القيمة العادلة للاستثمارات','4206':'إيرادات إيجار',
  '5101':'تكلفة المبيعات','5102':'تكاليف المشاريع — مواد','5103':'تكاليف مقاولي الباطن','5104':'تكاليف المشاريع — أخرى',
  '5201':'رواتب وأجور','5202':'التأمينات الاجتماعية','5203':'مصروف مكافأة نهاية الخدمة','5210':'إيجارات قصيرة الأجل',
  '5211':'كهرباء ومياه واتصالات','5212':'تأمين','5213':'مصروفات إدارية عامة','5220':'مصروف الإهلاك',
  '5221':'استهلاك أصول حق الاستخدام','5222':'مصروف الإطفاء','5230':'مصروف الخسائر الائتمانية المتوقعة',
  '5231':'خسائر الهبوط في القيمة','5232':'تخفيض المخزون إلى صافي القيمة القابلة للتحقق','5240':'تكاليف التمويل',
  '5241':'خسائر فروق عملة','5242':'خسائر استبعاد أصول','5250':'مصروف المخصصات','5251':'مصروفات بحوث',
  '5260':'مصروف الزكاة','5261':'مصروف ضريبة الدخل','5262':'غرامات وجزاءات','5263':'مصروف ضمان المنتجات'
};
function accName(c){ return COA[c]||('حساب '+c); }
function accType(c){ c=String(c); var f=c.charAt(0); return f==='1'?'asset':f==='2'?'liab':f==='3'?'equity':f==='4'?'rev':'exp'; }

/* ===== كتالوج المعايير — بنفس علامات الشرح السبع =====
   t: ifrs | ias | isa | isqm | socpa ;  o=الهدف  p=المقصود بالمعيار  r=أهم المتطلبات  e=مثال من الواقع
   a=المعالجة وخطوات التطبيق  g=توجيه للممارس  out=النتائج المرجوة */
var STDS=[
 {id:'IFRS 15',t:'ifrs',n:'الإيراد من العقود مع العملاء',
  o:'تحديد متى وبأي مبلغ يُعترف بالإيراد بما يعكس انتقال السيطرة على السلع أو الخدمات للعميل مقابل العوض المتوقع.',
  p:'يحلّ مشكلة توقيت الاعتراف بالإيراد في العقود المركّبة (توريد + تركيب + صيانة) وعقود المقاولات طويلة الأجل.',
  r:['نموذج الخطوات الخمس: تحديد العقد ← التزامات الأداء ← سعر المعاملة ← التخصيص ← الاعتراف عند/على مدى الوفاء.',
     'الاعتراف على مدى زمني إذا: استفاد العميل أثناء التنفيذ، أو أنشأت المنشأة أصلاً يسيطر عليه العميل، أو لا استخدام بديل مع حق نافذ في التحصيل.',
     'العوض المتغيّر (غرامات تأخير، حوافز) يُقدَّر ويُقيَّد بحيث لا يُحتمل عكس جوهري.',
     'أصول العقود (عمل منفذ لم يُفوتر) والتزامات العقود (مقبوض قبل التنفيذ) تُعرض منفصلة.'],
  e:'مقاول ينفّذ مبنى لعميل حكومي بعقد 10,000,000 ريال، نُفّذ 35% حتى نهاية السنة بطريقة المدخلات (التكلفة المتكبدة إلى إجمالي التكلفة المقدّرة) ← يُعترف بإيراد 3,500,000 ريال.',
  a:['حدّد التزامات الأداء المتميزة في العقد.','قِس نسبة الإنجاز (مدخلات/مخرجات) بشكل متسق.','قارن الإيراد المعترف به بالمفوتر: الزيادة أصل عقد، والنقص التزام عقد.','عالج المحتجزات كذمم مدينة مشروطة بمرور الوقت أو الإنجاز.'],
  g:'وثّق تقدير التكلفة الكلية وراجعه شهرياً؛ العقد الخاسر يُكوَّن له مخصص وفق IAS 37 فوراً.',
  out:'إيراد يعكس الأداء الفعلي، وهوامش مشاريع قابلة للمقارنة، وإفصاحات واضحة عن الأرصدة التعاقدية.',
  k:'ايراد ايرادات مبيعات بيع عقد عميل مستخلص مقاولات انجاز revenue'},
 {id:'IFRS 16',t:'ifrs',n:'عقود الإيجار',
  o:'الاعتراف لدى المستأجر بكل عقود الإيجار تقريباً في قائمة المركز المالي (أصل حق استخدام والتزام إيجار).',
  p:'إنهاء "التمويل خارج الميزانية" الناتج عن تصنيف الإيجار التشغيلي سابقاً.',

   au: {as:الإقرارات, rk:المخاطر, pr:الإجراءات, isa:معايير} ؛ ds: الإفصاح */
function r2(x){ return Math.round((+x||0)*100)/100; }
function payAcc(o){ return o.pay==='cash'?'1101':o.pay==='ap'?'2101':'1102'; }
function rcvAcc(o){ return o.pay==='cash'?'1101':o.pay==='ap'?'1201':'1102'; }
function vatIn(o,net){ return o.vat? r2(net*0.15):0; }
function pv(pay,n,r){ r=r/100; if(!r) return pay*n; return pay*(1-Math.pow(1+r,-n))/r; }

/* نفس دالة النظام السحابي — كي يعمل نفس الحساب في المنصة */
function hash(s){ var h=5381; s=String(s)+'::mfarag'; for(var i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return 'h'+h.toString(36); }
function sha256(s){
  if(window.crypto&&crypto.subtle&&window.TextEncoder)
    return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(function(b){ return Array.prototype.map.call(new Uint8Array(b),function(x){ return ('0'+x.toString(16)).slice(-2); }).join(''); });
  return Promise.resolve(hash(s)+hash(s+'#2'));
}

function loadDB(){ var d=lsGet(LS_DB,null); if(!d||!d.v) d=blankDB(); COLS.forEach(function(c){ if(!Array.isArray(d[c])) d[c]=[]; }); if(!d.seq) d.seq={}; if(!d.log) d.log=[]; if(!d.users) d.users=[]; return d; }
var _saveT=null;
function save(){ DB.u=Date.now(); lsSet(LS_DB,DB); clearTimeout(_saveT); _saveT=setTimeout(cloudPush,900); }
function live(c){ return (DB[c]||[]).filter(function(x){ return !x.del; }); }
function byId(c,id){ var a=DB[c]||[]; for(var i=0;i<a.length;i++) if(a[i].id===id&&!a[i].del) return a[i]; return null; }
function nextNo(c,prefix){ DB.seq[c]=(DB.seq[c]||0)+1; return prefix+'-'+new Date().getFullYear()+'-'+String(DB.seq[c]).padStart(4,'0'); }
function log(act,mod,msg){ DB.log.unshift({id:uid(),t:nowStr(),ts:Date.now(),by:ME?ME.name:'',user:ME?ME.username:'',act:act,mod:mod,msg:msg}); if(DB.log.length>3000) DB.log.length=3000; }
/* دمج آمن متعدد المستخدمين: لكل سجل الأحدث تعديلاً يفوز، والحذف علامة لا إزالة */
function mergeArr(a,b){ var m={},out=[]; (a||[]).concat(b||[]).forEach(function(x){ if(!x||!x.id) return; var o=m[x.id]; if(!o||(x.u||0)>(o.u||0)) m[x.id]=x; });
  for(var k in m) out.push(m[k]); return out; }
function mergeDB(loc,rem){ if(!rem||!rem.v) return loc; var d=blankDB();
  COLS.forEach(function(c){ d[c]=mergeArr(loc[c],rem[c]).sort(function(x,y){ return (x.c||0)-(y.c||0); }); });
  d.users=mergeArr(loc.users,rem.users);
  d.company=((rem.company&&rem.company.u)||0)>((loc.company&&loc.company.u)||0)?rem.company:loc.company;
  d.seq={}; [loc.seq||{},rem.seq||{}].forEach(function(s){ for(var k in s) d.seq[k]=Math.max(d.seq[k]||0,s[k]); });
  d.log=mergeArr(loc.log,rem.log).sort(function(x,y){ return (y.ts||0)-(x.ts||0); }).slice(0,3000);
  d.u=Math.max(loc.u||0,rem.u||0); return d; }

function synthEmail(username){ username=String(username||'').trim(); if(username.indexOf('@')>0) return username; return 'u'+hash(username.toLowerCase())+'@'+cloudWid()+'.vegerp.app'; }
function setCloud(s,msg){ cloud.state=s; var el=$('cloudStatus'); if(!el) return;
  var m={off:['محلي','',],ok:['متصل ☁','ok'],sync:['يُزامن…','sync'],err:['تعذّر الاتصال','err'],rules:['محلي — السحابة تتطلب تحديث القواعد','err'],offline:['دون اتصال — محلي','sync']}[s]||['محلي',''];
  el.textContent=m[0]; el.className='cloud-status '+m[1]; el.title=msg||''; }

function cloudAttach(){
  if(!cloudEnabled()||!firebase.auth().currentUser) return Promise.resolve(false);
  cloud.ref=firebase.database().ref('workspaces/'+cloudWid()+'/platform');
  setCloud('sync');
  return cloud.ref.child('db').once('value').then(function(s){
    var v=s.val(); if(v&&v.data){ try{ DB=mergeDB(DB,JSON.parse(v.data)); lsSet(LS_DB,DB); }catch(e){} }
    cloud.ready=true; setCloud('ok');
    if(!cloud.listening){ cloud.listening=true;
      cloud.ref.child('db').on('value',function(s2){ var v2=s2.val(); if(!v2||!v2.data||v2.data===cloud.lastPushed) return;
        try{ DB=mergeDB(DB,JSON.parse(v2.data)); lsSet(LS_DB,DB); if(ME){ var me=DB.users.filter(function(u){ return u.id===ME.id; })[0]; if(me) ME=me; render(); } }catch(e){} },
        function(err){ setCloud(err&&/permission/i.test(err.code||err.message)?'rules':'err',String(err&&err.message||err)); }); }
    cloudPush(); return true;
  }).catch(function(err){ cloud.ready=false; setCloud(/permission/i.test(String(err&&(err.code||err.message)))?'rules':'err',String(err&&err.message||err)); return false; });
}
function cloudPush(){
  if(!cloud.ready||!cloud.ref) return; var s=JSON.stringify(DB); if(s===cloud.lastPushed) return;
  setCloud('sync'); cloud.lastPushed=s;
  cloud.ref.child('db').set({data:s,build:APP_BUILD,by:ME?ME.username:'',at:firebase.database.ServerValue.TIMESTAMP})
    .then(function(){ setCloud('ok'); }).catch(function(err){ cloud.lastPushed=''; setCloud(/permission/i.test(String(err&&(err.code||err.message)))?'rules':'err'); });
}

/* ===== الدخول ===== */
function loginErr(m){ var e=$('loginErr'); e.textContent=m; e.style.display=m?'block':'none'; }
function loginNote(m){ var e=$('loginNote'); e.innerHTML=m||''; e.classList.toggle('hidden',!m); }
function findUser(un){ un=String(un||'').trim().toLowerCase(); return DB.users.filter(function(u){ return !u.del&&String(u.username).toLowerCase()===un; })[0]||null; }
function doLogin(ev){
  ev&&ev.preventDefault(); loginErr('');
  var un=$('lg_user').value.trim(), pw=$('lg_pass').value;
  if(!un||!pw){ loginErr('أدخل اسم المستخدم وكلمة المرور'); return; }
  var btn=$('lgBtn'); btn.disabled=true; btn.textContent='جارٍ التحقق…';
  var done=function(){ btn.disabled=false; btn.textContent='دخول'; };
  if(cloudEnabled()&&navigator.onLine!==false){
    firebase.auth().signInWithEmailAndPassword(synthEmail(un),pw).then(function(cred){
      return firebase.database().ref('workspaces/'+cloudWid()+'/members/'+cred.user.uid).once('value').then(function(ms){
        var mem=ms.val();
        if(!mem){ firebase.auth().signOut(); throw {code:'not-member'}; }
        return cloudAttach().then(function(){ return cloudLoginUser(un,pw,mem); });
      });
    }).then(done).catch(function(err){ done();
      var c=String(err&&err.code||'');
      if(c==='not-member'){ loginErr('حسابك غير معتمد في مساحة العمل — تواصل مع المدير.'); return; }
      if(c==='not-platform'){ loginErr('لم يُضف حسابك إلى المنصة بعد — اطلب من المدير إضافتك من «المستخدمون والصلاحيات».'); return; }
      if(c==='inactive'){ loginErr('هذا الحساب موقوف.'); return; }
      /* انقطاع الشبكة أو حساب محلي فقط: نجرب الدخول المحلي */
      localLogin(un,pw,/network/i.test(c));
    });
  } else { localLogin(un,pw,true); done(); }
}
function cloudLoginUser(un,pw,mem){
  var u=findUser(un);
  return passHash(un,pw).then(function(ph){
    if(!u){
      if(mem.role!=='admin') throw {code:'not-platform'};
      u={id:uid(),c:Date.now(),u:Date.now(),username:un,name:mem.name||un,role:'manager',active:true,ph:ph};
      DB.users.push(u); ME=u; log('add','المستخدمون','تفعيل مدير المنصة تلقائياً من حساب المدير السحابي');
    }
    if(u.active===false) throw {code:'inactive'};
    if(u.ph!==ph){ u.ph=ph; u.u=Date.now(); } /* نحفظ بصمة كلمة المرور للدخول دون اتصال */
    startSession(u,true);
  });
}
function localLogin(un,pw,offline){
  passHash(un,pw).then(function(ph){
    var u=findUser(un);
    if(!u&&!cloudEnabled()&&!DB.users.filter(function(x){ return !x.del; }).length&&un.toLowerCase()==='admin'&&pw==='admin123'){
      u={id:uid(),c:Date.now(),u:Date.now(),username:'admin',name:'مدير المنصة',role:'manager',active:true,ph:ph,mustChange:true}; DB.users.push(u);
    }
    if(!u||u.ph!==ph){ loginErr(offline?'تعذّر الاتصال بالسحابة، والبيانات المحفوظة على هذا الجهاز لا تطابق — تحقق من الإنترنت.':'اسم المستخدم أو كلمة المرور غير صحيحة'); return; }
    if(u.active===false){ loginErr('هذا الحساب موقوف.'); return; }
    if(cloudEnabled()) setCloud('offline');
    startSession(u,false);
  });
}
function startSession(u,viaCloud){
  ME=u; if($('lg_remember').checked) lsSet(LS_SES,{id:u.id,t:Date.now(),cloud:viaCloud}); else { try{ localStorage.removeItem(LS_SES); }catch(e){} }
  log('login','الدخول','تسجيل دخول'+(viaCloud?' (سحابي)':' (محلي)')); save();
  $('lg_pass').value=''; $('loginScreen').classList.add('hidden'); $('app').classList.remove('hidden');
  paintUser(); buildNav(); go(location.hash.slice(1)||'home');
  if(u.mustChange) setTimeout(function(){ toast('أمان: غيّر كلمة مرور المدير الافتراضية الآن'); openPwd(); },600);
}
function logout(){
  if(ME){ log('logout','الدخول','تسجيل خروج'); save(); }
  try{ localStorage.removeItem(LS_SES); }catch(e){}
  try{ if(cloudEnabled()&&firebase.auth().currentUser) firebase.auth().signOut(); }catch(e){}
  location.hash=''; location.reload();
}
function paintUser(){ $('uName').textContent=ME.name; $('uRole').textContent=(ME.custom?'مخصص — ':'')+ROLES[ME.role]; $('uAv').textContent=(ME.name||'?').trim().charAt(0);
  $('coName').textContent=DB.company.name||'منصة الأعمال المتكاملة'; }
function boot(){
  DB=loadDB();
  if(cloudEnabled()) loginNote('ادخل بنفس اسم المستخدم وكلمة المرور الخاصة بك في النظام السحابي.');
  else loginNote('أول دخول: <b>admin</b> / <b>admin123</b> ثم غيّر كلمة المرور فوراً.');
  var s=lsGet(LS_SES,null); if(!s) return;
  var u=DB.users.filter(function(x){ return x.id===s.id&&!x.del&&x.active!==false; })[0]; if(!u) return;
  if(s.cloud&&cloudEnabled()){
    var off=firebase.auth().onAuthStateChanged(function(fu){ off();
      if(fu){ cloudAttach().then(function(){ var u2=DB.users.filter(function(x){ return x.id===s.id&&!x.del&&x.active!==false; })[0]; if(u2) startSession(u2,true); }); }
      else if(navigator.onLine===false) startSession(u,false);
    });
  } else startSession(u,false);
}

function toolCard(v,ic,t,d,tags,bg){

    +tags.map(function(x){ return '<span class="tag">'+x+'</span>'; }).join('')+'</div><div class="open">فتح الأداة ‹</div></div>';
}

/* ===== محرك البحث الذكي ===== */
function stripAl(w){ return w.length>4?w.replace(/^(وال|بال|كال|فال|لل|ال)/,''):w; }
function toks(s){ return norm(s).split(' ').filter(function(w){ return w.length>1&&!/^(في|من|على|الى|عن|مع|او|و|ثم|بمبلغ|مبلغ|ريال|رس|sar|the|of|a|an|to|for|كيف|ما|هي|هو|اثبات|قيد|معالجه|محاسبيا)$/.test(w); }).map(stripAl); }
TREATS.forEach(function(t){ t._k=toks(t.q+' '+t.n); });
STDS.forEach(function(s){ s._k=toks((s.k||'')+' '+s.n+' '+s.id); });
function scoreK(qt,kw){ var sc=0; qt.forEach(function(w){ var best=0; kw.forEach(function(k){ if(k===w) best=Math.max(best,3); else if(w.length>=3&&(k.indexOf(w)===0||w.indexOf(k)===0)&&Math.min(k.length,w.length)>=3) best=Math.max(best,2); else if(w.length>=4&&k.indexOf(w)>=0) best=Math.max(best,1); }); sc+=best; }); return sc; }
function analyze(q){
  var qt=toks(q); if(!qt.length) return {t:[],s:[]};
  var t=TREATS.map(function(x){ return {x:x,s:scoreK(qt,x._k)}; }).filter(function(r){ return r.s>=2; }).sort(function(a,b){ return b.s-a.s; });
  var s=STDS.map(function(x){ return {x:x,s:scoreK(qt,x._k)+(norm(x.id)===norm(q)?10:0)}; }).filter(function(r){ return r.s>=2; }).sort(function(a,b){ return b.s-a.s; });
  return {t:t.slice(0,6),s:s.slice(0,6)};
}
function extractAmt(q){ var m=String(q).replace(/[٠-٩]/g,function(d){ return '٠١٢٣٤٥٦٧٨٩'.indexOf(d); }).replace(/٬/g,',').match(/\d[\d,]*(\.\d+)?/g); if(!m) return 0;
  var n=Math.max.apply(null,m.map(function(x){ return +x.replace(/,/g,''); })); return n>=10?n:0; }

var G={q:'',sel:null,o:{}};
VIEWS.guide=function(arg){
  if(arg&&TREAT_BY_ID[arg]&&(!G.sel||G.sel.id!==arg)) pickTreat(arg,true);
  var h='<div class="guide-hero"><h2>📚 دليل المعايير الذكي</h2><p>اكتب أي بند — مصروف، إيراد، أصل، التزام، أو معاملة — وسيحدد لك المعيار المنطبق والمعالجة والقيد الآلي وإرشادات المراجعة.</p>'
   +'<form class="search-box" onsubmit="event.preventDefault();runGuide()"><input id="gq" type="search" enterkeyhint="search" placeholder="مثال: شراء رافعة بمبلغ 460000 / مستخلص مقاولات / إيجار مستودع" value="'+esc(G.q)+'"><button class="btn-main" type="submit">تحليل</button></form>'
   +'<div class="chips">'+['مصاريف سفر للعمل','شراء سيارة 120000','إيجار مستودع 3 سنوات','رسوم تجديد إقامة','رواتب الموظفين','مكافأة نهاية الخدمة','ديون مشكوك فيها','الزكاة','استيراد بالدولار','خصم مكتسب من المورد','عجز في الجرد','اشتراك برنامج سحابي'].map(function(c){ return '<button class="chip" type="button" onclick="$(\'gq\').value=this.textContent;runGuide()">'+c+'</button>'; }).join('')+'</div></div>';
  h+='<div id="gRes">'+guideResults()+'</div>';
  return h;
};
function runGuide(){ G.q=$('gq').value.trim(); G.sel=null; var r=analyze(G.q); if(r.t.length&&(r.t.length===1||r.t[0].s>r.t[1].s)) pickTreat(r.t[0].x.id,true); $('gRes').innerHTML=guideResults(); log('view','دليل المعايير','بحث: '+G.q); }
function guideResults(){
  if(!G.q&&!G.sel) return browseTreats();
  var r=analyze(G.q), h='';
  if(G.sel) h+=treatView(G.sel);
  var others=r.t.filter(function(x){ return !G.sel||x.x.id!==G.sel.id; });
  if(others.length) h+='<div class="panel"><h3>'+(G.sel?'بنود قريبة قد تقصدها':'اختر البند الأقرب لمعاملتك')+'</h3><div class="match-list">'+others.map(function(x){ return '<button onclick="pickTreat(\''+x.x.id+'\')"><b>'+esc(x.x.n)+'</b><span>'+x.x.std.join(' • ')+' — '+esc(x.x.cat)+'</span></button>'; }).join('')+'</div></div>';
  if(r.s.length) h+='<div class="panel"><h3>📖 معايير ذات صلة</h3><div class="std-badges">'+r.s.map(function(x){ return stdBadge(x.x.id,true); }).join('')+'</div></div>';
  if(!G.sel&&!r.t.length) h+='<div class="panel"><h3>لم نجد بنداً مطابقاً تماماً</h3><p style="font-size:14px;color:var(--ink-2);line-height:1.9">جرّب كلمات أبسط (مثل: «شراء معدات»، «إيجار»، «رواتب»، «مستخلص»). قاعدة عامة: حدّد أولاً هل البند <b>أصل</b> (منافع مستقبلية تسيطر عليها المنشأة) أو <b>مصروف</b> (استُنفدت منافعه) أو <b>التزام</b> (تعهد حالي من حدث ماضٍ) أو <b>إيراد</b> (انتقال سيطرة للعميل)، ثم ارجع لمكتبة المعايير.</p></div>'+browseTreats();
  return h;
}
function browseTreats(){
  var cats={}; TREATS.forEach(function(t){ (cats[t.cat]=cats[t.cat]||[]).push(t); });
  var h='<div class="panel"><h3>🗂️ تصفّح البنود حسب الفئة</h3>';
  for(var c in cats) h+='<div style="font-weight:800;color:var(--ink-3);font-size:13px;margin:10px 0 6px">'+c+'</div><div class="match-list">'+cats[c].map(function(t){ return '<button onclick="pickTreat(\''+t.id+'\')"><b>'+esc(t.n)+'</b><span>'+t.std.join(' • ')+'</span></button>'; }).join('')+'</div>';
  return h+'</div>';
}
function pickTreat(id,silent){
  var t=TREAT_BY_ID[id]; if(!t) return; G.sel=t; G.o={amt:extractAmt(G.q)||10000,pj:''};
  (t.inp||[]).forEach(function(i){ G.o[i.k]=i.d; });
  /* استخراج المدة من النص («3 سنوات») */
  var yrs=norm(G.q).match(/(\d+)\s*(سنه|سنوات|سنين|year)/); if(yrs){ if('n' in G.o) G.o.n=+yrs[1]; if('life' in G.o) G.o.life=+yrs[1]; }
  if(!silent){ $('gRes').innerHTML=guideResults(); var e=$('gRes'); if(e) e.scrollIntoView({behavior:'smooth',block:'start'}); }
}
function stdBadge(id,open){ var s=STD_BY_ID[id]; var cls=s&&(s.t==='isa'||s.t==='isqm')?' isa':s&&s.t==='socpa'?' socpa':'';
  return '<button class="std-badge'+cls+'" onclick="openStd(\''+id+'\')" title="'+esc(s?s.n:id)+'">'+esc(s&&s.t==='socpa'?s.n.split('—')[0].split('(')[0].trim():id)+'</button>'; }

  (t.inp||[]).forEach(function(i){
    if(i.type==='chk') h+='<div><label>&nbsp;</label><label style="display:flex;gap:8px;align-items:center;font-weight:700;min-height:44px"><input type="checkbox" '+(G.o[i.k]?'checked':'')+' onchange="G.o.'+i.k+'=this.checked;refreshJE()">'+esc(i.l)+'</label></div>';
    else if(i.type==='proj'){ if(G.o.center==='proj'||!t.inp.some(function(x){ return x.k==='center'; })) h+='<div><label>'+esc(i.l)+'</label><select onchange="G.o.pj=this.value"><option value="">— اختر المشروع —</option>'+projOpts().map(function(o){ return '<option value="'+o[0]+'"'+(G.o.pj===o[0]?' selected':'')+'>'+esc(o[1])+'</option>'; }).join('')+'</select></div>'; }
    else if(i.type==='date') h+='<div><label>'+esc(i.l)+'</label><input type="date" value="'+(G.o[i.k]||'')+'" onchange="G.o.'+i.k+'=this.value;refreshJE()"></div>';
    else if(i.type==='sel') h+='<div><label>'+esc(i.l)+'</label><select onchange="G.o.'+i.k+'=this.value;'+(i.k==='nature'||i.k==='center'?'$(\'gRes\').innerHTML=guideResults()':'refreshJE()')+'">'+i.opts.map(function(o){ return '<option value="'+o[0]+'"'+(G.o[i.k]===o[0]?' selected':'')+'>'+esc(o[1])+'</option>'; }).join('')+'</select></div>';
    else h+='<div><label>'+esc(i.l)+'</label><input type="number" inputmode="decimal" step="any" value="'+G.o[i.k]+'" oninput="G.o.'+i.k+'=+this.value||0;refreshJE()"></div>';
  });
  return h+'</div>';
}
function buildJE(t){ var r=t.je?t.je(G.o):[]; if(r.length&&!r[0].lines) r=[{t:'القيد',lines:r}];
  return r.map(function(e){ return {t:e.t,lines:e.lines.filter(function(l){ return l&&r2(l.v)>0; }).map(function(l){ return {a:l.d||l.c,dr:l.d?r2(l.v):0,cr:l.c?r2(l.v):0}; })}; }).filter(function(e){ return e.lines.length; }); }
function jeTable(lines,title){
  var td=0,tc=0; lines.forEach(function(l){ td+=l.dr; tc+=l.cr; });
  return '<div class="je">'+(title?'<div style="padding:8px 12px;font-weight:800;font-size:13px;background:var(--surface-2);border-bottom:1px solid var(--line-soft)">'+esc(title)+'</div>':'')
    +'<table><thead><tr><th>الحساب</th><th class="r">مدين</th><th class="r">دائن</th></tr></thead><tbody>'
    +lines.map(function(l){ return '<tr><td class="'+(l.cr?'ind':'')+'">'+(l.cr?'إلى ح/ ':'من ح/ ')+accLink(l.a,l.cr?'cr':'dr')+' <span class="mini num">'+l.a+'</span></td><td class="r dr">'+(l.dr?money(l.dr):'')+'</td><td class="r cr">'+(l.cr?money(l.cr):'')+'</td></tr>'; }).join('')
    +'</tbody><tfoot><tr><td>الإجمالي '+(Math.abs(td-tc)<0.01?'<span class="pill pill-ok">متوازن ✓</span>':'<span class="pill pill-bad">غير متوازن</span>')+'</td><td class="r">'+money(td)+'</td><td class="r">'+money(tc)+'</td></tr></tfoot></table></div>';
}

      lines:e.lines.map(function(l){ return {a:l.a,dr:l.dr,cr:l.cr}; }),status:'draft',by:ME.name};

  var t=G.sel, au=t.au||{};

function openStd(id){
  var s=STD_BY_ID[id]; if(!s){ toast('المعيار '+id); return; }
  var b='<div class="std-badges"><span class="pill '+(s.t==='isa'||s.t==='isqm'?'pill-plum':s.t==='socpa'?'pill-warn':'pill-info')+'">'+({ifrs:'معيار دولي للتقرير المالي',ias:'معيار محاسبة دولي',isa:'معيار مراجعة دولي',isqm:'معيار إدارة الجودة',socpa:'متطلب سعودي'})[s.t]+'</span></div>'
    +(s.o?sec('c1','🎯','الهدف',esc(s.o)):'')+(s.p?sec('c2','❓','المقصود بالمعيار',esc(s.p)):'')
    +(s.r?sec('c3','☰','أهم المتطلبات',ul(s.r)):'')+(s.e?sec('c4','🏠','مثال من الواقع',esc(s.e)):'')
    +(s.a?sec('c5','🧾','المعالجة وخطوات التطبيق',ul(s.a)):'')+(s.g?sec('c6','💡','توجيه للممارس',esc(s.g)):'')+(s.out?sec('c7','✓','النتائج المرجوة',esc(s.out)):'');
  var rel=TREATS.filter(function(t){ return t.std.indexOf(id)>=0||(t.au&&t.au.isa&&t.au.isa.indexOf(id)>=0); });
  if(rel.length) b+='<div style="font-weight:800;margin:12px 0 6px">بنود تطبيقية مرتبطة</div><div class="match-list">'+rel.map(function(t){ return '<button onclick="closeModal();G.q=\''+esc(t.n).replace(/'/g,'')+'\';G.sel=null;pickTreat(\''+t.id+'\',true);go(\'guide\')"><b>'+esc(t.n)+'</b><span>افتح المعالجة والقيد الآلي</span></button>'; }).join('')+'</div>';
  b+='<div class="disclaimer" style="margin-top:10px">شرح مبسّط — النص المعتمد هو الإصدار الرسمي للهيئة السعودية للمراجعين والمحاسبين.</div>';
  modal(esc((s.id==='ZAKAT'||s.id==='VAT-KSA'?'':s.id+' — ')+s.n),b);
}

function isLive(d){ return d.status==='approved'||d.status==='archived'||d.status==='closed'||d.status==='posted'; }
function docTotals(d){ var net=0; (d.lines||[]).forEach(function(l){ net+=(+l.qty||0)*(+l.price||0); }); net=r2(net); var v=d.vat&&!DT_noVat(d)?r2(net*.15):0; return {net:net,vat:v,total:r2(net+v)}; }
function DT_noVat(d){ var t=DT[d._t]; return t&&t.noVat; }
function stockOf(itemId,exceptDoc){
  var qi=0,vi=0,qo=0;
  live('grn').forEach(function(g){ if(!isLive(g)) return; (g.lines||[]).forEach(function(l){ if(l.item===itemId){ qi+=+l.qty||0; vi+=(+l.qty||0)*(+l.price||0); } }); });
  live('issue').forEach(function(g){ if(!isLive(g)||g.id===exceptDoc) return; (g.lines||[]).forEach(function(l){ if(l.item===itemId) qo+=+l.qty||0; }); });
  (DB.cinv||[]).forEach(function(g){ if(g.del||!isLive(g)||g.id===exceptDoc) return; (g.lines||[]).forEach(function(l){ if(l.item===itemId) qo+=+l.qty||0; }); });  /* المبيعات تخرج من المخزون */
  var avg=qi?vi/qi:((byId('item',itemId)||{}).price||0); return {qty:r2(qi-qo),avg:r2(avg),val:r2((qi-qo)*avg),qin:qi,qout:qo};
}
function issueCost(d){ var c=0; (d.lines||[]).forEach(function(l){ c+=(+l.qty||0)*(l.cost!=null?+l.cost:stockOf(l.item).avg); }); return r2(c); }
function poReceived(po){ var ord=0,rec=0; (po.lines||[]).forEach(function(l){ ord+=+l.qty||0; });
  live('grn').forEach(function(g){ if(g.po===po.id&&isLive(g)) (g.lines||[]).forEach(function(l){ rec+=+l.qty||0; }); }); return ord?Math.min(100,rec/ord*100):0; }
function invRemaining(s){ var t=docTotals(s).total-(s.kind==='sub'?r2(docTotals(s).net*(+s.ret||0)/100):0), paid=0;
  live('payment').forEach(function(p){ if(p.sinv===s.id&&isLive(p)) paid+=+p.amount||0; }); return r2(t-paid); }
function projBilled(id){ var s=0; live('progress').forEach(function(p){ if(p.project===id&&isLive(p)) s+=+p.amount||0; }); return s; }
function postedJE(){ return live('journal').filter(function(j){ return j.status==='posted'||j.status==='approved'||j.status==='archived'; }); }
function accBal(prefix){ var b=0; postedJE().forEach(function(j){ j.lines.forEach(function(l){ if(String(l.a).indexOf(prefix)===0) b+=(+l.dr||0)-(+l.cr||0); }); }); return r2(b); }
function partyBal(pid){ var b=0; postedJE().forEach(function(j){ j.lines.forEach(function(l){ if(l.p===pid) b+=(+l.dr||0)-(+l.cr||0); }); }); return r2(b); }
function kpis(){
  var st=0,low=0; live('item').forEach(function(i){ var s=stockOf(i.id); st+=s.val; if(i.min&&s.qty<i.min) low++; });
  var pend=0; ['progress','po','grn','issue','sinv','payment','receipt','cinv'].forEach(function(c){ if(DT[c]&&can(DT[c].mod)) pend+=live(c).filter(function(d){ return d.status==='draft'; }).length; });
  return {projects:live('project').filter(function(p){ return p.status==='approved'; }).length,stock:st,low:low,ap:-(accBal('2101')+accBal('2102')),ar:accBal('1201')+accBal('1202'),
    openPO:live('po').filter(function(p){ return p.status==='approved'&&poReceived(p)<99.99; }).length,draftJE:live('journal').filter(function(j){ return j.status==='draft'; }).length,pending:pend};
}

      if(lines.length) DB.journal.push({id:uid(),c:Date.now(),u:Date.now(),no:nextNo('journal','JV'),date:x.date||today(),memo:j.memo,pj:j.pj||null,src:d.n,srcT:t,srcId:x.id,lines:lines,status:'posted',by:ME.name}); }

      +(can('journal','p')?'<button class="btn-sm" onclick="printJE(\''+j.id+'\')">🖨️</button>':'')

 {id:'tb',n:'ميزان المراجعة',ic:'⚖️',need:'journal',run:function(){ var m=tbData(), ks=Object.keys(m).sort(), td=0,tc=0, rows=[];

   return {head:['الحساب','الاسم','حركة مدينة','حركة دائنة','رصيد مدين','رصيد دائن'],rows:rows,foot:['','الإجمالي','','',fmt(td),fmt(tc)],num:[2,3,4,5]}; }},
 {id:'is',n:'قائمة الدخل المختصرة',ic:'📊',need:'journal',run:function(){ var m=tbData(), rev=[],exp=[],tr=0,te=0;
   Object.keys(m).sort().forEach(function(k){ var t=accType(k), b=m[k].dr-m[k].cr; if(t==='rev'){ rev.push([k,accName(k),fmt(-b)]); tr-=b; } if(t==='exp'){ exp.push([k,accName(k),fmt(b)]); te+=b; } });
   var rows=[['','الإيرادات','']].concat(rev,[['','إجمالي الإيرادات',fmt(tr)],['','المصروفات والتكاليف','']],exp,[['','إجمالي المصروفات',fmt(te)]]);
   return {head:['الحساب','البند','المبلغ'],rows:rows,foot:['',(tr-te>=0?'صافي الربح':'صافي الخسارة'),fmt(Math.abs(tr-te))],num:[2]}; }},
 {id:'bs',n:'قائمة المركز المالي المختصرة',ic:'🏛️',need:'journal',run:function(){ var m=tbData(true), g={asset:0,liab:0,equity:0,pl:0}, rows=[];
   ['asset','liab','equity'].forEach(function(t){ rows.push(['',{asset:'الأصول',liab:'الالتزامات',equity:'حقوق الملكية'}[t],'']);
     Object.keys(m).sort().forEach(function(k){ if(accType(k)!==t) return; var b=m[k].dr-m[k].cr, v=t==='asset'?b:-b; if(Math.abs(v)<0.005) return; g[t]+=v; rows.push([k,accName(k),fmt(v)]); });
     if(t==='equity'){ Object.keys(m).forEach(function(k){ var tt=accType(k); if(tt==='rev'||tt==='exp') g.pl-=(m[k].dr-m[k].cr); }); rows.push(['','صافي ربح (خسارة) الفترة الجارية',fmt(g.pl)]); g.equity+=g.pl; }
     rows.push(['','إجمالي '+{asset:'الأصول',liab:'الالتزامات',equity:'حقوق الملكية'}[t],fmt(g[t])]); });
   return {head:['الحساب','البند','المبلغ'],rows:rows,foot:['','الالتزامات + حقوق الملكية',fmt(g.liab+g.equity)+(Math.abs(g.asset-g.liab-g.equity)<0.01?' ✓':' ⚠')],num:[2],note:'حتى تاريخ: '+(RP.to||today())}; }},
 {id:'ledger',n:'دفتر الأستاذ لحساب',ic:'📗',need:'journal',p:'acc',run:function(){ var bal=0, rows=[];
   postedJE().filter(function(j){ return inRange(j.date); }).sort(function(a,b){ return a.date.localeCompare(b.date)||(a.c||0)-(b.c||0); }).forEach(function(j){ j.lines.forEach(function(l){ if(l.a!==RP.acc) return; bal+=(+l.dr||0)-(+l.cr||0); rows.push([j.date,j.no,j.memo,l.dr?fmt(l.dr):'',l.cr?fmt(l.cr):'',fmt(bal)]); }); });
   return {head:['التاريخ','القيد','البيان','مدين','دائن','الرصيد'],rows:rows,num:[3,4,5],note:RP.acc+' — '+accName(RP.acc)}; }},
 {id:'stmt',n:'كشف حساب عميل / مورد',ic:'👤',need:'journal',p:'party',run:function(){ var bal=0, rows=[];
   postedJE().filter(function(j){ return inRange(j.date); }).sort(function(a,b){ return a.date.localeCompare(b.date)||(a.c||0)-(b.c||0); }).forEach(function(j){ j.lines.forEach(function(l){ if(l.p!==RP.party) return; bal+=(+l.dr||0)-(+l.cr||0); rows.push([j.date,j.no,j.memo,l.dr?fmt(l.dr):'',l.cr?fmt(l.cr):'',fmt(Math.abs(bal))+(bal>0.005?' مدين':bal<-0.005?' دائن':'')]); }); });
   return {head:['التاريخ','المرجع','البيان','مدين','دائن','الرصيد'],rows:rows,num:[3,4,5],note:partyName(RP.party)}; }},
 {id:'aging',n:'فواتير الموردين المستحقة وأعمارها',ic:'⏳',need:'sinv',run:function(){ var rows=[],tot=0,now=new Date(today());
   live('sinv').filter(function(s){ return isLive(s)&&invRemaining(s)>0.005; }).forEach(function(s){ var r=invRemaining(s), dd=s.due||s.date, days=Math.floor((now-new Date(dd))/864e5); tot+=r;
     rows.push([s.no,partyName(s.supplier),s.ref||'',s.date,dd,fmt(r),days>90?'+90':days>60?'61–90':days>30?'31–60':days>0?'1–30':'غير مستحقة']); });
   return {head:['الفاتورة','المورد','رقم المورد','التاريخ','الاستحقاق','المتبقي','فئة التأخير (يوم)'],rows:rows,foot:['','','','','الإجمالي',fmt(tot),''],num:[5]}; }},
 {id:'stock',n:'أرصدة المخزون وتقييمه',ic:'📦',need:'items',run:function(){ var rows=[],tv=0;
   live('item').forEach(function(i){ var s=stockOf(i.id); tv+=s.val; rows.push([i.code||'',i.name,i.unit||'',fmt(s.qin),fmt(s.qout),fmt(s.qty),fmt(s.avg),fmt(s.val),i.min&&s.qty<i.min?'تحت حد الطلب':'']); });
   return {head:['الكود','الصنف','الوحدة','وارد','منصرف','الرصيد','متوسط التكلفة','القيمة','تنبيه'],rows:rows,foot:['','','','','','','الإجمالي',fmt(tv),''],num:[3,4,5,6,7],note:'التقييم بطريقة المتوسط المرجح (IAS 2)'}; }},
 {id:'move',n:'حركة صنف',ic:'🔄',need:'items',p:'item',run:function(){ var ev=[];
   live('grn').forEach(function(g){ if(isLive(g)) g.lines.forEach(function(l){ if(l.item===RP.item) ev.push([g.date,g.no,'استلام — '+partyName(g.supplier),+l.qty,0]); }); });
   live('issue').forEach(function(g){ if(isLive(g)) g.lines.forEach(function(l){ if(l.item===RP.item) ev.push([g.date,g.no,'صرف — '+projName(g.project),0,+l.qty]); }); });
   ev.sort(function(a,b){ return a[0].localeCompare(b[0]); }); var b=0;
   return {head:['التاريخ','المستند','البيان','وارد','منصرف','الرصيد'],rows:ev.filter(function(e){ return inRange(e[0]); }).map(function(e){ b+=e[3]-e[4]; return [e[0],e[1],e[2],e[3]?fmt(e[3]):'',e[4]?fmt(e[4]):'',fmt(b)]; }),num:[3,4,5],note:itemName(RP.item)}; }},
 {id:'proj',n:'ربحية المشاريع',ic:'🏗️',need:'projects',run:function(){ var rows=[],tr=0,tc=0;
   live('project').forEach(function(p){ var x=projectPL(p.id); tr+=x.rev; tc+=x.cost; rows.push([p.no,p.name,partyName(p.client),fmt(p.value),fmt(x.rev),p.value?fmt(x.rev/p.value*100,1)+'%':'',fmt(x.cost),fmt(x.rev-x.cost),x.rev?fmt((x.rev-x.cost)/x.rev*100,1)+'%':'']); });
   return {head:['الرقم','المشروع','العميل','قيمة العقد','الإيراد','الإنجاز','التكلفة','الهامش','نسبة الهامش'],rows:rows,foot:['','الإجمالي','','',fmt(tr),'',fmt(tc),fmt(tr-tc),''],num:[3,4,6,7]}; }},
 {id:'vat',n:'ملخص ضريبة القيمة المضافة',ic:'🧾',need:'journal',run:function(){ var o=0,i=0;
   postedJE().forEach(function(j){ if(!inRange(j.date)) return; j.lines.forEach(function(l){ if(l.a==='2130') o+=(+l.cr||0)-(+l.dr||0); if(l.a==='1230') i+=(+l.dr||0)-(+l.cr||0); }); });
   return {head:['البند','المبلغ'],rows:[['ضريبة المخرجات (المبيعات والمستخلصات)',fmt(o)],['ضريبة المدخلات (المشتريات والخدمات)',fmt(i)]],foot:[o-i>=0?'صافي الضريبة المستحقة السداد':'صافي الضريبة القابلة للاسترداد',fmt(Math.abs(o-i))],num:[1],note:'للمطابقة مع الإقرار الضريبي — بوابة هيئة الزكاة والضريبة والجمارك'}; }},
 {id:'pos',n:'متابعة أوامر الشراء',ic:'🛒',need:'po',run:function(){ return {head:['الرقم','التاريخ','المورد','المشروع','الإجمالي','الاستلام','الحالة'],

];

    +(r.p==='item'?'<div><label>الصنف</label><select onchange="RP.item=this.value;render()"><option value="">— اختر —</option>'+live('item').map(function(p){ return '<option value="'+p.id+'"'+(RP.item===p.id?' selected':'')+'>'+esc(p.name)+'</option>'; }).join('')+'</select></div>':'')

function reportTable(o){
  if(!o.rows.length) return '<div class="empty">لا بيانات في هذه الفترة</div>';
  var isNum=function(i){ return o.num&&o.num.indexOf(i)>=0; };
  return '<div class="tbl-wrap tbl-cards"><table><thead><tr>'+o.head.map(function(c,i){ return '<th'+(isNum(i)?' class="r"':'')+'>'+esc(c)+'</th>'; }).join('')+'</tr></thead><tbody>'
    +o.rows.map(function(r){ var sub=r[0]===''&&!r[r.length-1]; return '<tr'+(sub?' style="background:var(--surface-2);font-weight:800"':'')+'>'+r.map(function(c,i){ return '<td data-l="'+esc(o.head[i])+'"'+(isNum(i)?' class="r num"':'')+'>'+esc(c)+'</td>'; }).join('')+'</tr>'; }).join('')
    +'</tbody>'+(o.foot?'<tfoot><tr>'+o.foot.map(function(c,i){ return '<td data-l="'+esc(o.head[i])+'"'+(isNum(i)?' class="r num"':'')+'>'+esc(c)+'</td>'; }).join('')+'</tr></tfoot>':'')+'</table></div>';
}
function printReport(){ var r=REPORTS.filter(function(x){ return x.id===RP.id; })[0], o=r.run();
  printHTML(r.n,null,today(),[['الفترة',(RP.from||'البداية')+' ← '+(RP.to||'اليوم')]].concat(o.note?[['البيان',o.note]]:[]),reportTable(o).replace(/tbl-cards/,'')+signBlock()); }
function csvReport(){ var r=REPORTS.filter(function(x){ return x.id===RP.id; })[0], o=r.run(); csvDownload(r.n,[o.head].concat(o.rows,o.foot?[o.foot]:[])); }

var AF={t:'all',q:'',from:'',to:''};
VIEWS.archive=function(){
  var types=Object.keys(DT).filter(function(t){ return !DT[t].noFlow&&can(DT[t].mod); });
  var rows=[]; types.forEach(function(t){ if(AF.t!=='all'&&AF.t!==t) return; live(t).forEach(function(x){ if(x.status!=='archived') return; x._t=t; rows.push(x); }); });
  if(AF.q){ var q=norm(AF.q); rows=rows.filter(function(x){ return norm(x.no+' '+partyName(x.supplier||x.party||x.client)+' '+projName(x.project)+' '+(x.ref||'')+' '+(x.name||'')).indexOf(q)>=0; }); }
  rows=rows.filter(function(x){ var d=x.date||x.start||''; return (!AF.from||d>=AF.from)&&(!AF.to||d<=AF.to); }).sort(function(a,b){ return (b.date||'').localeCompare(a.date||''); });
  var pend=0; types.forEach(function(t){ pend+=live(t).filter(function(x){ return x.status==='approved'; }).length; });
  var h='<div class="page-head"><div><h2>🗄️ الأرشيف الإلكتروني</h2><p>'+rows.length+' مستند مؤرشف — '+pend+' مستند معتمد لم يُؤرشف بعد</p></div><div class="btn-row">'
    +(can('archive','a')&&pend?'<button class="btn-main" onclick="bulkArchive()">🗄️ أرشفة المعتمد حتى تاريخ…</button>':'')
    +(can('archive','p')&&rows.length?'<button class="btn" onclick="csvDownload(\'الأرشيف\',[[\'النوع\',\'الرقم\',\'التاريخ\',\'الطرف/المشروع\',\'أرشفه\',\'تاريخ الأرشفة\']].concat(ARows()))">⬇️ Excel</button>':'')+'</div></div>'
    +'<div class="panel" style="padding:12px"><div class="grid g4" style="align-items:end"><div><label>النوع</label><select onchange="AF.t=this.value;render()"><option value="all">كل المستندات</option>'+types.map(function(t){ return '<option value="'+t+'"'+(AF.t===t?' selected':'')+'>'+DT[t].np+'</option>'; }).join('')+'</select></div>'
    +'<div><label>بحث</label><input type="search" value="'+esc(AF.q)+'" placeholder="رقم، طرف، مشروع…" onchange="AF.q=this.value;render()"></div><div><label>من</label><input type="date" value="'+AF.from+'" onchange="AF.from=this.value;render()"></div><div><label>إلى</label><input type="date" value="'+AF.to+'" onchange="AF.to=this.value;render()"></div></div></div>';
  if(!rows.length) return h+'<div class="panel empty">لا مستندات مؤرشفة مطابقة</div>';
  window._arch=rows;
  return h+'<div class="tbl-wrap tbl-cards"><table><thead><tr><th>النوع</th><th>الرقم</th><th>التاريخ</th><th>الطرف / المشروع</th><th>أُرشف</th><th></th></tr></thead><tbody>'
    +rows.map(function(x){ return '<tr><td data-l="النوع">'+DT[x._t].ic+' '+DT[x._t].n+'</td><td data-l="الرقم" class="num"><b>'+esc(x.no)+'</b></td><td data-l="التاريخ" class="num">'+esc(x.date||x.start||'')+'</td><td data-l="الطرف / المشروع">'+esc(partyName(x.supplier||x.party||x.client)||projName(x.project)||x.name||'')+'</td><td data-l="أُرشف" class="mini">'+esc((x.arBy||'')+' '+(x.arAt||''))+'</td>'
      +'<td class="act"><button class="btn-sm" onclick="openDoc(\''+x._t+'\',\''+x.id+'\')">عرض</button>'+(can(DT[x._t].mod,'p')?'<button class="btn-sm" onclick="printDoc(\''+x._t+'\',\''+x.id+'\')">🖨️ إعادة طباعة</button>':'')+'</td></tr>'; }).join('')+'</tbody></table></div>';
};
function ARows(){ return (window._arch||[]).map(function(x){ return [DT[x._t].n,x.no,x.date||x.start||'',partyName(x.supplier||x.party||x.client)||projName(x.project)||'',x.arBy||'',x.arAt||'']; }); }
function bulkArchive(){
  modal('أرشفة جماعية','<div class="field"><label>أرشفة كل المستندات المعتمدة حتى تاريخ</label><input type="date" id="ba_to" value="'+today()+'"></div><p class="mini">المستندات المؤرشفة تبقى ضمن الأرصدة والتقارير، وتُقفل للعرض وإعادة الطباعة فقط.</p>',
    '<button class="btn-main" onclick="doBulkArchive()">أرشفة</button>');
}
function doBulkArchive(){ var to=$('ba_to').value||today(), n=0;
  Object.keys(DT).forEach(function(t){ if(DT[t].noFlow||!can(DT[t].mod)) return; live(t).forEach(function(x){ if(x.status==='approved'&&(x.date||x.start||'')<=to){ x.status='archived'; x.arBy=ME.name; x.arAt=nowStr(); x.u=Date.now(); n++; } }); });
  log('archive','الأرشيف','أرشفة جماعية حتى '+to+': '+n+' مستند'); save(); closeModal(); render(); toast('تمت أرشفة '+n+' مستند'); }

function saveNote(t,id){ var tx=$('nt_text').value.trim(); if(!tx){ toast('اكتب الملاحظة'); return; } var x=byId(t,id);
  DB.note.push({id:uid(),c:Date.now(),u:Date.now(),ref:id,refT:t,refNo:x?x.no:'',text:tx,sev:$('nt_sev').value,isa:$('nt_isa').value,open:true,by:ME.name,t:nowStr()});

VIEWS.audit=function(){

      +'<div class="panel"><h3>👤 قيود يدوية أنشأها واعتمدها الشخص نفسه (فصل المهام)</h3>'+lst(self)+'</div>'; }

var UF=null;
function openUser(id){
  var u=id?DB.users.filter(function(x){ return x.id===id; })[0]:null;
  UF={perms:JSON.parse(JSON.stringify(u&&u.custom&&u.perms?u.perms:ROLE_PERMS[u?u.role:'accountant'])),custom:!!(u&&u.custom)};
  modal(u?'تعديل المستخدم':'مستخدم جديد','<div class="grid g2"><div class="field"><label>الاسم الكامل</label><input id="us_name" value="'+esc(u?u.name:'')+'"></div>'
    +'<div class="field"><label>اسم المستخدم (نفسه في النظام السحابي)</label><input id="us_user" autocapitalize="off" value="'+esc(u?u.username:'')+'"'+(u?' readonly':'')+'></div>'
    +'<div class="field"><label>الدور</label><select id="us_role" onchange="if(!UF.custom){UF.perms=JSON.parse(JSON.stringify(ROLE_PERMS[this.value]));drawPerm();}">'+Object.keys(ROLES).map(function(r){ return '<option value="'+r+'"'+((u?u.role:'accountant')===r?' selected':'')+'>'+ROLE_ICON[r]+' '+ROLES[r]+'</option>'; }).join('')+'</select></div>'
    +'<div class="field"><label>كلمة المرور المحلية '+(u?'<span class="mini">(اتركها فارغة دون تغيير)</span>':'')+'</label><input type="password" id="us_pass" autocomplete="new-password"></div>'
    +'<label style="display:flex;gap:8px;align-items:center;font-weight:700"><input type="checkbox" id="us_active" '+(!u||u.active!==false?'checked':'')+'> الحساب نشط</label>'
    +'<label style="display:flex;gap:8px;align-items:center;font-weight:700"><input type="checkbox" id="us_custom" '+(UF.custom?'checked':'')+' onchange="UF.custom=this.checked;if(!UF.custom){UF.perms=JSON.parse(JSON.stringify(ROLE_PERMS[$(\'us_role\').value]));}drawPerm()"> تخصيص الصلاحيات يدوياً</label></div>'
    +'<div style="font-weight:800;margin:12px 0 6px">مصفوفة الصلاحيات</div><div class="perm-grid" id="permGrid"></div>',
    '<button class="btn-main" onclick="saveUser(\''+(id||'')+'\')">💾 حفظ</button>');
  drawPerm();
}
function drawPerm(){
  $('permGrid').innerHTML='<table><thead><tr><th>الشاشة</th>'+ACTS.map(function(a){ return '<th>'+a[1]+'</th>'; }).join('')+'</tr></thead><tbody>'
    +MODS.map(function(m){ var p=UF.perms[m[0]]||{}; return '<tr><td>'+m[1]+'</td>'+ACTS.map(function(a){ return '<td><input type="checkbox" aria-label="'+m[1]+' — '+a[1]+'" '+(p[a[0]]?'checked':'')+(UF.custom?'':' disabled')+' onchange="var p=UF.perms[\''+m[0]+'\']||(UF.perms[\''+m[0]+'\']={});if(this.checked){p[\''+a[0]+'\']=1;p.v=1;}else{delete p[\''+a[0]+'\'];}drawPerm()"></td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table>';
}
function saveUser(id){
  var name=$('us_name').value.trim(), un=$('us_user').value.trim(), pw=$('us_pass').value, role=$('us_role').value;
  if(!name||!un){ toast('الاسم واسم المستخدم مطلوبان'); return; }
  var u=id?DB.users.filter(function(x){ return x.id===id; })[0]:null;
  if(!u&&findUser(un)){ toast('اسم المستخدم مستخدم مسبقاً'); return; }
  if(!u&&!cloudEnabled()&&pw.length<6){ toast('كلمة المرور ٦ خانات على الأقل'); return; }
  if(pw&&pw.length<6){ toast('كلمة المرور ٦ خانات على الأقل'); return; }
  if(u&&u.id===ME.id&&role!=='manager'&&!DB.users.some(function(x){ return !x.del&&x.id!==ME.id&&x.role==='manager'&&x.active!==false; })){ toast('يجب بقاء مدير واحد على الأقل'); return; }
  (pw?passHash(un,pw):Promise.resolve(null)).then(function(ph){
    if(!u){ u={id:uid(),c:Date.now(),username:un}; DB.users.push(u); }
    u.name=name; u.role=role; u.active=$('us_active').checked; u.custom=UF.custom; u.perms=UF.custom?UF.perms:null; if(ph) u.ph=ph; u.u=Date.now();
    log(id?'edit':'add','المستخدمون',(id?'تعديل':'إضافة')+' مستخدم '+un+' — '+ROLES[role]+(u.custom?' (صلاحيات مخصصة)':'')); save(); closeModal();
    if(u.id===ME.id){ ME=u; buildNav(); } render(); toast('تم الحفظ');
  });
}

function saveCo(){ ['name','cr','vat','phone','addr'].forEach(function(k){ DB.company[k]=$('co_'+k).value.trim(); }); DB.company.u=Date.now(); log('edit','الإعدادات','تعديل بيانات المنشأة'); save(); render(); toast('تم الحفظ'); }
function backup(){ var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:'application/json'})); a.download='نسخة_منصة_الأعمال_'+today()+'.json'; document.body.appendChild(a); a.click(); a.remove(); log('export','الإعدادات','تنزيل نسخة احتياطية'); save(); }
function restore(inp){ var f=inp.files[0]; if(!f) return; var r=new FileReader(); r.onload=function(){ try{ var d=JSON.parse(r.result); if(!d.v) throw 0; DB=mergeDB(DB,d); log('edit','الإعدادات','استعادة/دمج نسخة احتياطية'); save(); render(); toast('تم دمج النسخة'); }catch(e){ toast('ملف غير صالح'); } }; r.readAsText(f); }

/* ===== محرك البحث المحسّن: تجذيع خفيف + مرادفات + أوزان للكلمات العامة ===== */
var SYN={'مصاريف':'مصروف','مصروفات':'مصروف','نفقات':'مصروف','نفقه':'مصروف','مصارف':'مصروف','تكاليف':'تكلفه','ايرادات':'ايراد','مبيعات':'بيع','مشتريات':'شراء',

  'مواد':'ماده','خدمات':'خدمه','اتصالات':'اتصال','ارباح':'ربح','اصول':'اصل','مخصصات':'مخصص','شحنات':'شحنه','عقود':'عقد','مشاريع':'مشروع','ضرائب':'ضريبه'};
var GENERIC_W={'مصروف':1,'شراء':1,'دفع':1,'سداد':1,'عمل':1,'شركه':1,'مؤسسه':1,'تكلفه':1,'رسم':1,'قيمه':1,'حساب':1,'فاتوره':1,'خدمه':1,'بيع':1,'ايراد':1,'مستحق':1,'مقدم':1,'مدفوع':1,'اصل':1,'التزام':1,'عميل':1,'مورد':1,'موظف':1,'سنوي':1,'شهري':1,'مشروع':1,'عقد':1,'ماده':1};
function stem(w){
  if(SYN[w]) return SYN[w];
  if(w.length>4&&/^(وال|بال|كال|فال)/.test(w)) w=w.slice(3); else if(w.length>3&&/^(لل|ال)/.test(w)) w=w.slice(2);
  if(SYN[w]) return SYN[w];
  if(w.length>=6&&/(ات|ين|ون)$/.test(w)){ var s=w.slice(0,-2); if(SYN[s]) return SYN[s]; return s; }
  return w; }
var STOP=/^(في|من|على|الى|عن|مع|او|و|ثم|بمبلغ|مبلغ|ريال|رس|sar|the|of|a|an|to|for|كيف|ما|ماذا|هي|هو|اثبات|قيد|معالجه|محاسبيا|محاسبي|عند|بعد|قبل|لدى|هذا|هذه|تم|يتم|الخاص|الخاصه|لل|ب|ل)$/;
toks=function(s){ return norm(s).split(' ').filter(function(w){ return w.length>1&&!/^\d+$/.test(w)&&!STOP.test(w); }).map(stem).filter(function(w){ return w.length>1&&!STOP.test(w); }); };
scoreK=function(qt,kw){ var sc=0,strong=0; qt.forEach(function(w){ var gw=GENERIC_W[w]?1:3, best=0;
    kw.forEach(function(k){ if(k===w) best=Math.max(best,gw); else if(!GENERIC_W[w]&&w.length>=5&&k.length>=5&&(k.indexOf(w)===0||w.indexOf(k)===0)) best=Math.max(best,2); });
    if(best>=2) strong++; sc+=best; });
  scoreK._strong=strong; return sc; };
/* الكلمة الرأس: أول كلمة غير عامة في العبارة (في العربية تحمل المعنى: «صيانة سيارة» = صيانة) */
function headTok(qt){ for(var i=0;i<qt.length;i++) if(!GENERIC_W[qt[i]]) return qt[i]; return qt[0]; }
analyze=function(q){
  var qt=toks(q); if(!qt.length) return {t:[],s:[]};
  var hd=headTok(qt), allGen=qt.every(function(w){ return GENERIC_W[w]; });
  var t=TREATS.map(function(x){ var s=scoreK(qt,x._k), st=scoreK._strong, hm=scoreK([hd],x._k)>=2||(GENERIC_W[hd]&&scoreK([hd],x._k)>=1); return {x:x,s:s+(hm?0.5:0),st:st,hm:hm}; }).filter(function(r){ return (r.st>0&&r.s>=2)||(allGen&&r.s>=qt.length+0.5); }).sort(function(a,b){ return b.s-a.s; });
  var s=STDS.map(function(x){ var sc=scoreK(qt,x._k)+(norm(x.id)===norm(q)?10:0); return {x:x,s:sc,st:scoreK._strong}; }).filter(function(r){ return (r.st>0&&r.s>=3)||r.s>=10; }).sort(function(a,b){ return b.s-a.s; });
  return {t:t.slice(0,40),s:s.slice(0,6)};
};
TREATS.forEach(function(t){ t._k=toks(t.q+' '+t.n); });
STDS.forEach(function(s){ s._k=toks((s.k||'')+' '+s.n+' '+s.id); });

runGuide=function(){
  G.q=$('gq').value.trim(); G.sel=null; if(!G.q){ $('gRes').innerHTML=guideResults(); return; }
  var r=analyze(G.q);
  var top=r.t[0], uniq=top&&(r.t.length===1||top.s>r.t[1].s);

  else if(top&&uniq&&top.s>=6) pickTreat(top.x.id,true);
  else if(!top||!top.hm){ GENERIC.n='معالجة عامة ذكية: «'+G.q+'»'; pickTreat('generic',true); G.o.nature=guessNature(G.q); }
  $('gRes').innerHTML=guideResults(); log('view','دليل المعايير','بحث: '+G.q);
};

/* أرقام القوائم من الأستاذ العام (للفترة المحددة) */
function fsFigures(){
  /* بنود الدخل: حركة السنة فقط ؛ بنود المركز المالي: الرصيد التراكمي حتى نهاية السنة */
  var y=engYear(), m={}, c={}; postedJE().forEach(function(j){ var d=String(j.date), inY=d.slice(0,4)===y, upTo=d.slice(0,4)<=y;
    j.lines.forEach(function(l){ var a=String(l.a), v=(+l.dr||0)-(+l.cr||0); if(inY) m[a]=(m[a]||0)+v; if(upTo) c[a]=(c[a]||0)+v; }); });
  var sum=function(o,f){ var s=0; for(var a in o) if(f(a)) s+=o[a]; return s; };
  var rev=-sum(m,function(a){ return a.charAt(0)==='4'; });
  var cogs=sum(m,function(a){ return /^510/.test(a); }), exp=sum(m,function(a){ return a.charAt(0)==='5'; });
  var purch=sum(m,function(a){ return /^51/.test(a); })+sum(m,function(a){ return a==='1301'; });
  var curA=sum(c,function(a){ return /^1[123]/.test(a); }), inv=sum(c,function(a){ return /^130/.test(a); }), cashA=sum(c,function(a){ return /^110/.test(a); });
  var ar=sum(c,function(a){ return a==='1201'||a==='1202'||a==='1205'; }), ap=-sum(c,function(a){ return a==='2101'||a==='2102'; });
  var curL=-sum(c,function(a){ return /^21/.test(a); }), totL=-sum(c,function(a){ return a.charAt(0)==='2'; });
  var totA=sum(c,function(a){ return a.charAt(0)==='1'; }), eq=-sum(c,function(a){ var f=a.charAt(0); return f==='3'||f==='4'||f==='5'; });
  var fin=m['5240']||0, zak=(m['5260']||0)+(m['5261']||0);
  return {rev:rev,cogs:cogs,gp:rev-cogs,exp:exp,np:rev-exp,pbz:rev-exp+zak,curA:curA,inv:inv,cash:cashA,ar:ar,ap:ap,curL:curL,totL:totL,totA:totA,eq:eq,fin:fin,purch:purch}; }

/* ===== تحليل العقد وفق IFRS 15 (طريقة المدخلات: التكلفة المتكبدة ÷ إجمالي التكلفة المقدرة) ===== */
/* تكلفة المشروع دون مصروف مخصص العقد الخاسر (5250) كي لا يشوّه نسبة الإنجاز */
function projCostExProv(id){ var c=0; postedJE().forEach(function(j){ if(j.pj!==id) return; j.lines.forEach(function(l){ var a=String(l.a); if(a.charAt(0)==='5'&&a!=='5250') c+=(+l.dr||0)-(+l.cr||0); }); }); return r2(c); }
function voTotal(p){ var s=0; (p.vo||[]).forEach(function(v){ if(v.ok) s+=+v.a||0; }); return r2(s); }
function projAnalysis(p){
  var rv=r2((+p.value||0)+voTotal(p)), pl=projectPL(p.id), cost=projCostExProv(p.id), etc=p.etc!=null&&p.etc!==''?+p.etc:(p.budget?Math.max(0,+p.budget-cost):0);
  var tec=r2(cost+etc), poc=tec>0?Math.min(1,cost/tec):0, revRec=r2(rv*poc), billed=projBilled(p.id), recog=pl.rev, diff=r2(revRec-recog), loss=r2(Math.max(0,tec-rv));
  return {rv:rv,vo:voTotal(p),cost:cost,etc:etc,tec:tec,poc:poc,revRec:revRec,billed:billed,recog:recog,diff:diff,loss:loss,lossLeft:r2(loss*(1-poc)),margin:r2(rv-tec),hasEst:tec>0}; }
var _docSummary=docSummary;
docSummary=function(t,x){
  if(t!=='project') return _docSummary(t,x);
  var a=projAnalysis(x), row=function(l,v,c){ return '<div><span>'+l+'</span><span'+(c?' style="color:'+c+';font-weight:800"':'')+'>'+v+'</span></div>'; };
  var h='<div class="totals">'+row('قيمة العقد الأصلية',money(x.value))+(a.vo?row('(+) الأوامر التغييرية المعتمدة',money(a.vo)):'')+'<div class="grand"><span>قيمة العقد المعدّلة</span>'+money(a.rv)+'</div>'
    +row('التكاليف المتكبدة حتى تاريخه',money(a.cost))+row('التكلفة المقدرة للإتمام',money(a.etc))+row('إجمالي التكلفة المقدرة',money(a.tec))
    +row('نسبة الإنجاز (طريقة المدخلات)','<span class="num">'+fmt(a.poc*100,1)+'%</span>')+row('الإيراد الواجب الاعتراف به تراكمياً',money(a.revRec))
    +row('الإيراد المعترف به فعلاً (المستخلصات)',money(a.recog))
    +row(a.diff>=0?'أصل عقد (أعمال منفذة لم تُفوتر)':'التزام عقد (مفوتر بالزيادة)',money(Math.abs(a.diff)),a.diff>=0?'var(--leaf-dark)':'var(--sky)')
    +row('الهامش المتوقع للعقد',money(a.margin),a.margin<0?'var(--tomato)':'var(--leaf-dark)')+'</div>';
  if(!a.hasEst) h+='<div class="login-err" style="display:block;margin-top:8px">⚠️ أدخل «التكلفة المقدرة للإتمام» أو موازنة المشروع ليُحسب الإنجاز وفق IFRS 15.</div>';
  if(a.loss>0) h+='<div class="login-err" style="display:block;margin-top:8px">🚨 <b>عقد خاسر:</b> إجمالي التكلفة المقدرة يتجاوز قيمة العقد بـ '+fmt(a.loss)+'. يجب الاعتراف بكامل الخسارة المتوقعة فوراً (مخصص عقد مرهق — IAS 37 / IFRS 15). المتبقي غير المعترف به: '+fmt(a.lossLeft)+'.</div>';
  if(x.boq&&x.boq.length){ var tb=0; x.boq.forEach(function(b){ tb+=(+b.q||0)*(+b.r||0); });
