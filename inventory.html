<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>نظام إدارة المخزون والمبيعات وحركة الأصناف</title>
<link rel="manifest" href="manifest.inventory.json">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-inv-180.png">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;
  --brand:#0d9488;--brand-d:#0f766e;--blue:#2563eb;--green:#16a34a;--amber:#d97706;--red:#dc2626;--sky:#0284c7;
  --shadow:0 1px 3px rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button{font-family:inherit;cursor:pointer}input,select{font-family:inherit}

#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0d9488,#0f766e);z-index:100;padding:16px}
#login .box{background:#fff;border-radius:18px;padding:30px;width:100%;max-width:360px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#login h1{font-size:20px;margin-bottom:4px}#login p{color:var(--muted);margin-bottom:18px;font-size:13px}

#app{display:none;min-height:100vh}
.topbar{display:none;position:sticky;top:0;z-index:40;background:#0f172a;color:#fff;align-items:center;gap:12px;padding:12px 16px}
.topbar h2{font-size:16px;flex:1}
.menu-btn{background:#1e293b;border:0;color:#fff;width:42px;height:42px;border-radius:9px;font-size:20px}
.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:44}
.sidebar{position:fixed;inset-inline-start:0;top:0;bottom:0;width:235px;background:#0f172a;color:#cbd5e1;
  padding:16px;display:flex;flex-direction:column;gap:4px;z-index:45;overflow-y:auto}
.sidebar h2{color:#fff;font-size:17px;margin-bottom:14px;padding:0 6px}
.navbtn{background:transparent;border:0;color:#cbd5e1;text-align:right;padding:13px 12px;border-radius:9px;
  font-size:15px;display:flex;align-items:center;gap:9px}
.navbtn:hover{background:#1e293b;color:#fff}.navbtn.active{background:var(--brand);color:#fff;font-weight:600}
.sidebar .foot{margin-top:auto;border-top:1px solid #1e293b;padding-top:12px;font-size:12px;color:#94a3b8;display:flex;flex-direction:column;gap:6px}
.sidebar .foot b{color:#fff;display:block;margin-bottom:4px}
.main{margin-inline-start:235px;padding:20px}
@media(max-width:860px){
  .topbar{display:flex}
  .sidebar{transform:translateX(115%);transition:transform .25s;width:255px}
  .sidebar.open{transform:translateX(0)}
  .backdrop.open{display:block}
  .main{margin-inline-start:0;padding:14px}
}

.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.pagehead h1{font-size:19px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.card-title{font-weight:700;margin-bottom:13px;font-size:15px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:860px){.grid-2,.grid-3{grid-template-columns:1fr}.grid-4{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.field{flex:1;min-width:135px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:15px;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--brand);border-color:var(--brand)}
input[readonly]{background:#f8fafc;color:var(--muted)}
.btn{background:var(--brand);color:#fff;border:0;padding:12px 18px;border-radius:9px;font-weight:600;font-size:15px}
.btn:hover{background:var(--brand-d)}.btn.blue{background:var(--blue)}.btn.green{background:var(--green)}
.btn.red{background:var(--red)}.btn.gray{background:#64748b}.btn.ghost{background:#f1f5f9;color:var(--ink)}
.btn.amber{background:var(--amber)}
.btn.sm{padding:8px 12px;font-size:13px}.btn.block{width:100%}.btn.lg{padding:15px;font-size:17px}
.table-wrap{overflow:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:480px}
th{text-align:right;color:var(--muted);font-weight:600;padding:10px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:hover td{background:#f8fafc}
.tag{padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;color:#fff;display:inline-block}
.tag.inbound{background:var(--green)}.tag.outbound{background:var(--amber)}.tag.adjustment{background:#64748b}
.badge-role{padding:2px 9px;border-radius:6px;font-size:11px;background:#e0e7ff;color:#3730a3;font-weight:700}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow)}
.stat .lbl{color:var(--muted);font-size:13px;margin-bottom:6px}.stat .val{font-size:24px;font-weight:800}.stat .val.sm{font-size:18px}
.msg{padding:11px 14px;border-radius:9px;margin-bottom:12px;font-size:14px;font-weight:600}
.msg.ok{background:#dcfce7;color:#166534}.msg.err{background:#fee2e2;color:#991b1b}
.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;inset-inline:0;background:#fff;border:1px solid var(--line);border-radius:9px;
  margin-top:4px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:240px;overflow:auto;z-index:20;display:none}
.ac-item{padding:12px;cursor:pointer;font-size:14px;border-bottom:1px solid #f1f5f9}
.ac-item:hover{background:#f0fdfa}.ac-item b{color:var(--brand-d)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:14px}
.modal .box{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
.modal h3{margin-bottom:16px}
.pill{display:inline-flex;gap:6px;align-items:center;background:#f1f5f9;padding:5px 10px;border-radius:20px;font-size:12px}
.empty{color:var(--muted);text-align:center;padding:22px;font-size:14px}

/* ===== شريط إدخال مضغوط "كل شيء في سطر" ===== */
.formgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;align-items:end}
.formgrid .cell{min-width:0}
.formgrid .cell.c2{grid-column:span 2}.formgrid .cell.c3{grid-column:span 3}
.formgrid .cell.c4{grid-column:span 4}.formgrid .cell.c5{grid-column:span 5}
.formgrid .cell.c6{grid-column:span 6}.formgrid .cell.c12{grid-column:span 12}
.formgrid input,.formgrid select{padding:11px}
@media(max-width:860px){.formgrid .cell{grid-column:span 6 !important}.formgrid .cell.c12{grid-column:span 12 !important}}

/* أزرار كبيرة لنوع الحركة — وارد / منصرف */
.typebtns{display:flex;gap:8px}
.typebtns button{flex:1;border:2px solid var(--line);background:#fff;color:var(--muted);border-radius:10px;padding:12px;font-weight:700;font-size:15px}
.typebtns button.on.in{background:var(--green);border-color:var(--green);color:#fff}
.typebtns button.on.out{background:var(--amber);border-color:var(--amber);color:#fff}
.typebtns button.on.adj{background:#64748b;border-color:#64748b;color:#fff}
.balbox{background:#ecfeff;border:1px solid #a5f3fc;border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.balbox .b{font-size:26px;font-weight:800;color:var(--sky)}
.details-toggle{background:none;border:0;color:var(--blue);font-weight:600;font-size:13px;padding:4px 0;cursor:pointer}
@media print{.sidebar,.topbar,.backdrop,.pagehead .btn,.navbtn,.no-print{display:none!important}.main{margin:0!important}}
.cloud-status{font-size:12px;padding:4px 10px;border-radius:20px;font-weight:700;display:inline-block;text-align:center}
.cloud-status.off{background:#e2e8f0;color:#475569}.cloud-status.connecting{background:#fef9c3;color:#854d0e}
.cloud-status.ok{background:#dcfce7;color:#166534}.cloud-status.sync{background:#dbeafe;color:#1e40af}.cloud-status.err{background:#fee2e2;color:#991b1b}
.loginerr{background:#fee2e2;color:#991b1b;padding:10px;border-radius:9px;margin-bottom:12px;font-size:13px;font-weight:600;display:none}
.loginok{background:#dcfce7;color:#166534;padding:10px;border-radius:9px;margin-bottom:12px;font-size:13px;font-weight:600;display:none}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:#0f172a;color:#fff;
  padding:12px 22px;border-radius:30px;font-size:14px;font-weight:600;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.3);
  transition:transform .3s;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.permgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:6px 0 12px}
.permgrid label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);font-weight:500;cursor:pointer;margin:0}
.permgrid input{width:auto}
.brandlogo{max-height:44px;max-width:120px;border-radius:8px;object-fit:contain}
.hidden{display:none!important}
#printModal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:120;display:flex;align-items:center;justify-content:center;padding:14px}
#printModal .sheet{background:#fff;border-radius:14px;max-width:600px;width:100%;max-height:92vh;overflow:auto;padding:22px}
#printArea h2{margin:6px 0}#printArea .co{display:flex;align-items:center;gap:10px;margin-bottom:8px}#printArea .co img{max-height:50px;border-radius:8px}
#printArea table{width:100%;border-collapse:collapse;margin-top:12px}
#printArea td,#printArea th{border:1px solid #cbd5e1;padding:9px;text-align:right;font-size:14px}#printArea th{background:#f1f5f9}
@media print{body *{visibility:hidden}#printModal,#printModal *{visibility:visible}#printModal{position:absolute;inset:0;background:#fff;display:block;padding:0}
  #printModal .sheet{box-shadow:none;max-width:100%;max-height:none}#printModal .actions{display:none!important}}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login">
  <div class="box">
    <h1 id="brandLogin">📦 نظام الوارد والمنصرف</h1>
    <p id="loginLead">سجّل الدخول للمتابعة</p>
    <div class="loginerr" id="loginErr"></div>
    <div class="loginok" id="loginOk"></div>
    <div id="loginFields">
      <label>اسم المستخدم</label>
      <input id="lg_user" autocomplete="username" placeholder="اسم المستخدم" onkeydown="if(event.key==='Enter')doLogin()">
      <label style="margin-top:12px">كلمة المرور</label>
      <input id="lg_pass" type="password" autocomplete="current-password" placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn block" style="margin-top:16px" onclick="doLogin()">دخول</button>
    </div>
    <div id="joinFields" style="display:none">
      <label>الاسم الكامل</label><input id="jn_name" placeholder="اسمك">
      <label style="margin-top:12px">اسم المستخدم</label><input id="jn_user" placeholder="اسم للدخول" style="font-family:monospace">
      <label style="margin-top:12px">كلمة المرور</label><input id="jn_pass" type="password" placeholder="٦ خانات على الأقل">
      <button class="btn green block" style="margin-top:16px" onclick="submitJoinRequest()">إرسال طلب انضمام</button>
    </div>
    <button class="btn ghost block installBtn" style="margin-top:12px" onclick="installApp()">📲 ثبّت التطبيق على الجوال</button>
    <button class="details-toggle" id="joinToggle" style="margin-top:10px;width:100%" onclick="toggleJoin()">ليس لديك حساب؟ اطلب حساباً جديداً</button>
    <div style="margin-top:10px;text-align:center"><span class="cloud-status off" id="cloudStatus">غير مفعّل</span></div>
    <div style="margin-top:14px;text-align:center;font-size:12px;color:var(--muted)">
      إعداد وتصميم <a onclick="showDev()" style="color:var(--brand-d);font-weight:700;cursor:pointer">✦ محمد فرج</a></div>
  </div>
</div>
<div id="toast"></div>

<!-- ===== APP ===== -->
<div id="app">
  <div class="topbar">
    <button class="menu-btn" onclick="toggleNav()">☰</button>
    <h2>الوارد والمنصرف</h2>
  </div>
  <div class="backdrop" id="backdrop" onclick="toggleNav()"></div>
  <aside class="sidebar" id="sidebar">
    <h2 id="brandSide">📦 المخزون</h2>
    <div id="coSwitch" style="margin-bottom:10px"></div>
    <button class="navbtn" data-page="move">➕ تسجيل حركة</button>
    <button class="navbtn" data-page="dashboard">📊 الأرصدة</button>
    <button class="navbtn" data-page="report">📅 تقرير فترة</button>
    <button class="navbtn" data-page="ledger">📜 سجل حركة الصنف</button>
    <button class="navbtn" data-page="items">🏷️ الأصناف</button>
    <button class="navbtn" data-page="import">🚚 الموردون</button>
    <button class="navbtn" data-page="employees">👥 الموظفون</button>
    <button class="navbtn" data-page="settings">⚙️ الإعدادات</button>
    <div class="foot">
      <b id="who"></b>
      <div style="margin-bottom:6px"><span class="cloud-status off" id="cloudStatus2">غير مفعّل</span></div>
      <button class="btn green sm block installBtn" onclick="installApp()">📲 ثبّت التطبيق</button>
      <button class="btn blue sm block" onclick="changeMyPassword()">🔑 تغيير كلمة المرور</button>
      <button class="btn gray sm block" onclick="backup()">⬇ نسخة احتياطية</button>
      <button class="btn ghost sm block" onclick="restore()">⬆ استرجاع</button>
      <button class="btn red sm block" onclick="logout()">خروج</button>
      <div style="text-align:center;margin-top:8px;font-size:11px;color:#94a3b8">
        إعداد وتصميم <a onclick="showDev()" style="color:#5eead4;font-weight:700;cursor:pointer">✦ ${''}محمد فرج</a></div>
    </div>
  </aside>
  <main class="main"><div id="view"></div></main>
</div>
<input type="file" id="restoreFile" accept="application/json" style="display:none">

<script>
/* ============================================================
   نظام الوارد والمنصرف ومتابعة الأرصدة وحركة الأصناف
   ملف واحد — يحفظ البيانات في متصفح الجهاز (localStorage)
   ============================================================ */
const KEY="inv_system_v2";
let DB,ME;
const $=s=>document.querySelector(s);
const money=n=>Number(n||0).toLocaleString("ar-EG",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const monthStart=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10);};
const fmt=d=>new Date(d).toLocaleString("ar-EG",{dateStyle:"short",timeStyle:"short"});
const roleAr=r=>({admin:"مدير",manager:"مشرف",employee:"موظف"}[r]||r);
const typeAr=t=>({inbound:"وارد",outbound:"منصرف",adjustment:"تسوية"}[t]||t);
const isManager=()=>["admin","manager"].includes(ME.role);
const isIn=t=>t==="inbound"||t==="adjustment";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function hash(str){let h=5381;str=String(str);for(let i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))>>>0;return "h"+h.toString(36);}

/* ---------- تنبيهات ---------- */
function toast(m){let t=$("#toast");if(!t)return;t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2600);}

/* ---------- الصلاحيات (مقتبَسة من نظام التوريد) ---------- */
const PERM_KEYS=[["move","تسجيل حركة"],["dashboard","الأرصدة"],["report","تقرير فترة"],["ledger","سجل حركة الصنف"],
  ["items","الأصناف"],["import","الموردون والشحنات"],["employees","الموظفون"],["settings","الإعدادات"],
  ["canAdd","إضافة"],["canEdit","تعديل"],["canDelete","حذف"],["canExport","تصدير"]];
function preset(role){
  const p={};PERM_KEYS.forEach(k=>p[k[0]]=false);
  if(role==="admin"){PERM_KEYS.forEach(k=>p[k[0]]=true);}
  else if(role==="manager"){PERM_KEYS.forEach(k=>p[k[0]]=true);p.employees=false;p.settings=false;}
  else if(role==="employee"){["move","dashboard","report","ledger","canAdd"].forEach(k=>p[k]=true);}
  return p;
}
function can(k){return !!(ME&&ME.perms&&ME.perms[k]);}
function guard(k,msg){if(can(k))return true;toast(msg||"لا تملك صلاحية لهذا الإجراء");return false;}
function applyNav(){
  document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("hidden",!can(b.dataset.page)));
}

/* ---------- بيانات المطوّر (توثيق) ---------- */
const DEV={name:"محمد فرج",nameEn:"Mohamed Farag",title:"معدّ ومصمّم النظام · System Developer",phone:"00966559486547",phoneShow:"00966 55 948 6547"};
/* ---------- الشركة الحالية (عرض لكل جهاز) ---------- */
let CO=1;
function citems(){return DB.items.filter(i=>i.companyId===CO);}
function cmoves(){return DB.movements.filter(m=>m.companyId===CO);}
function csups(){return DB.suppliers.filter(s=>s.companyId===CO);}
function curCompany(){return (DB.companies||[]).find(c=>c.id===CO)||DB.companies[0]||{name:"شركتي",logo:"",icon:"🏢"};}

/* ---------- Storage ---------- */
function seed(){return{
  companies:[{id:1,name:"غرف النوم والأثاث",logo:"",icon:"🛏️"}],
  settings:{company:"غرف النوم والأثاث",logo:""},
  users:[
    {id:1,name:"المدير العام",username:"admin",pass:hash("admin123"),role:"admin",active:1,perms:preset("admin"),pwTemp:1,fbUid:"",lastLogin:""},
    {id:2,name:"موظف المخزن",username:"store",pass:hash("store123"),role:"employee",active:1,perms:preset("employee"),pwTemp:1,fbUid:"",lastLogin:""}
  ],
  suppliers:[{id:1,companyId:1,name:"مورد الرياض للأثاث",phone:"0500000000",contact:"أبو أحمد"}],
  shipments:[],
  items:[
    {id:1,companyId:1,code:"غرفة كلاسيك",name:"غرفة نوم كلاسيك",model:"غرفة كلاسيك",category:"غرف نوم",unit:"طقم",cost:3200,price:4500,qty:0,reorder:2,active:true},
    {id:2,companyId:1,code:"غرفة مودرن",name:"غرفة نوم مودرن",model:"غرفة مودرن",category:"غرف نوم",unit:"طقم",cost:4100,price:5900,qty:0,reorder:2,active:true},
    {id:3,companyId:1,code:"مرتبة مفردة",name:"مرتبة طبية مفردة",model:"مرتبة مفردة",category:"مراتب",unit:"قطعة",cost:600,price:950,qty:0,reorder:5,active:true},
    {id:4,companyId:1,code:"مرتبة مزدوجة",name:"مرتبة طبية مزدوجة",model:"مرتبة مزدوجة",category:"مراتب",unit:"قطعة",cost:1100,price:1650,qty:0,reorder:5,active:true},
  ],
  movements:[],activity:[],
  seq:{user:2,supplier:1,shipment:0,item:4,movement:0,activity:0,company:1},
};}
function ensureShape(){
  DB.users=DB.users||[];DB.items=DB.items||[];DB.movements=DB.movements||[];
  DB.suppliers=DB.suppliers||[];DB.shipments=DB.shipments||[];DB.activity=DB.activity||[];
  DB.seq=DB.seq||{user:0,supplier:0,shipment:0,item:0,movement:0,activity:0,company:0};
  DB.settings=DB.settings||{company:"شركتي",logo:""};
  // تهيئة الشركات وترحيل البيانات القديمة لأول شركة
  if(!DB.companies||!DB.companies.length){
    DB.companies=[{id:1,name:DB.settings.company||"شركتي",logo:DB.settings.logo||"",icon:DB.settings.icon||"🏢"}];
    if(!DB.seq.company||DB.seq.company<1)DB.seq.company=1;
  }
  DB.companies.forEach(c=>{if(!c.icon)c.icon="🏢";});
  const firstCo=DB.companies[0].id;
  DB.items.forEach(i=>{if(i.companyId===undefined)i.companyId=firstCo;});
  DB.movements.forEach(m=>{if(m.companyId===undefined)m.companyId=firstCo;});
  DB.suppliers.forEach(s=>{if(s.companyId===undefined)s.companyId=firstCo;});

var CLOUD_AUTH_MODE="accounts";
var cloudReady=false,cloudRef=null,cloudPushTimer=null,cloudLastPushed="",cloudSecondary=null,cloudInteractive=false,cloudAuthBusy=false;
function setCloudStatus(state){
  const map={off:["غير مفعّل","off"],auth:["بانتظار الدخول","connecting"],connecting:["يتصل…","connecting"],
    ok:["متصل ☁","ok"],sync:["يُزامن…","sync"],err:["تعذّر الاتصال","err"]};
  const m=map[state]||map.off;
  ["cloudStatus","cloudStatus2"].forEach(id=>{const el=document.getElementById(id);if(el){el.textContent=m[0];el.className="cloud-status "+m[1];}});

function cloudEnabled(){return !!(CLOUD_CONFIG&&CLOUD_CONFIG.apiKey&&typeof firebase!=="undefined");}
function cloudAccounts(){return cloudEnabled()&&CLOUD_AUTH_MODE==="accounts";}
function cloudWid(){return CLOUD_CONFIG.workspaceId||"main";}
function synthEmail(username){return "u"+hash(String(username||"").toLowerCase())+"@"+cloudWid()+".inverp.app";}
function emailForUser(u){return (u&&u.email)?u.email:synthEmail(u?u.username:"");}
function cloudPush(){
  if(!cloudReady||!cloudRef)return;
  const s=JSON.stringify(DB);
  clearTimeout(cloudPushTimer);
  cloudPushTimer=setTimeout(function(){
    let data;try{data=JSON.parse(s);}catch(e){return;}
    cloudLastPushed=s;setCloudStatus("sync");
    cloudRef.set({data:data,updatedAt:firebase.database.ServerValue.TIMESTAMP,updatedBy:(ME?ME.name:"")})
      .then(()=>setCloudStatus("ok")).catch(()=>setCloudStatus("err"));
  },500);
}
function cloudApplyRemote(remote){
  if(!remote||typeof remote!=="object"||!Array.isArray(remote.users))return;
  DB=remote;ensureShape();
  const s=JSON.stringify(DB);localStorage.setItem(KEY,s);cloudLastPushed=s;
  if(ME){const me=DB.users.find(x=>x.id===ME.id);if(me)ME=me;go(CURRENT_PAGE);}
}
function cloudAttach(cb){
  if(cloudReady){if(cb)cb();return;}
  cloudRef=firebase.database().ref("workspaces/"+cloudWid()+"/root");
  cloudRef.once("value").then(function(snap){
    const v=snap.val();
    if(v&&v.data&&Array.isArray(v.data.users)){cloudApplyRemote(v.data);cloudReady=true;}
    else{cloudReady=true;cloudPush();}
    setCloudStatus("ok");
    cloudRef.on("value",function(s2){
      const val=s2.val();if(!val||!val.data||!Array.isArray(val.data.users))return;
      const rs=JSON.stringify(val.data);
      if(rs===cloudLastPushed||rs===JSON.stringify(DB))return;
      cloudApplyRemote(val.data);
    });
    if(cb)cb();
  }).catch(function(err){setCloudStatus("err");if(cb)cb(err||true);});
}
function cloudWriteMember(uid,u){
  return firebase.database().ref("workspaces/"+cloudWid()+"/members/"+uid)
    .set({username:u.username,role:u.role,active:Number(u.active)?1:0});
}
function cloudSecondaryApp(){if(!cloudSecondary)cloudSecondary=firebase.initializeApp(CLOUD_CONFIG,"provision");return cloudSecondary;}
function cloudProvisionUser(u,plainPass,done){
  if(!cloudAccounts()){if(done)done("cloud-off");return;}
  const sec=cloudSecondaryApp(),email=emailForUser(u);
  function finish(uid){u.fbUid=uid;return cloudWriteMember(uid,u).then(()=>sec.auth().signOut()).then(()=>{save();if(done)done(null,uid);});}
  sec.auth().createUserWithEmailAndPassword(email,plainPass)
    .then(cred=>finish(cred.user.uid))
    .catch(function(e){
      if(e&&e.code==="auth/email-already-in-use"){
        sec.auth().signInWithEmailAndPassword(email,plainPass).then(cred=>finish(cred.user.uid))
          .catch(()=>{if(done)done("exists-diff-pass");});
      }else{try{sec.auth().signOut();}catch(x){}if(done)done((e&&e.message)||"error");}
    });
}
function cloudChangeOwnPassword(newPass,done){
  const u=firebase.auth&&firebase.auth().currentUser;
  if(!u){if(done)done("no-user");return;}
  u.updatePassword(newPass).then(()=>done&&done(null)).catch(function(e){
    if(e&&e.code==="auth/requires-recent-login"){
      const cp=prompt("لأمانك، أدخل كلمة المرور الحالية لتأكيد التغيير:");
      if(!cp){if(done)done("cancel");return;}
      const cred=firebase.auth.EmailAuthProvider.credential(u.email,cp);
      u.reauthenticateWithCredential(cred).then(()=>u.updatePassword(newPass)).then(()=>done&&done(null))
        .catch(()=>done&&done("reauth-failed"));
    }else if(done)done((e&&e.code)||"error");
  });
}
function cloudBootstrapAdmin(u,password,fail){
  const email=emailForUser(u);
  firebase.auth().createUserWithEmailAndPassword(email,password).then(function(cred){
    u.fbUid=cred.user.uid;
    return cloudWriteMember(cred.user.uid,u).then(()=>afterCloudAuth(cred.user,u.username));
  }).catch(function(e){
    if(e&&e.code==="auth/email-already-in-use"){
      firebase.auth().signInWithEmailAndPassword(email,password).then(cred=>afterCloudAuth(cred.user,u.username))
        .catch(()=>fail("تعذّر تجهيز حساب المدير — قد تختلف كلمة المرور عن الحساب الموجود في Firebase."));
    }else fail("تعذّر تجهيز حساب المدير السحابي: "+((e&&e.message)||""));
  });
}
function afterCloudAuth(user,username){
  if(cloudAuthBusy)return;cloudAuthBusy=true;
  cloudAttach(function(err){
    cloudAuthBusy=false;
    if(err){loginErr("حسابك قيد المراجعة — لم تتم موافقة المدير على انضمامك بعد.");
      cloudReady=false;try{firebase.auth().signOut();}catch(e){}setCloudStatus("auth");return;}
    let u=DB.users.find(x=>x.fbUid===user.uid)||DB.users.find(x=>(x.username||"").toLowerCase()===String(username).toLowerCase());
    if(!u){loginErr("لا يوجد سجل مستخدم مطابق في بيانات المنشأة.");return;}
    if(!Number(u.active)){loginErr("هذا الحساب موقوف. راجع مدير النظام.");return;}
    if(u.fbUid!==user.uid)u.fbUid=user.uid;
    u.lastLogin=new Date().toISOString();ME=u;
    cloudWriteMember(user.uid,u).catch(()=>{});
    logAct("تسجيل دخول","دخول سحابي");save();
    loginErr("");startApp();
  });
}
function cloudLogin(username,password){
  function fail(m){loginErr(m);setCloudStatus("auth");}
  cloudInteractive=true;setCloudStatus("connecting");
  const appu=DB.users.find(x=>(x.username||"").toLowerCase()===String(username).toLowerCase());
  const email=appu?emailForUser(appu):synthEmail(username);
  firebase.auth().signInWithEmailAndPassword(email,password)
    .then(cred=>afterCloudAuth(cred.user,username))
    .catch(function(e){
      const code=e&&e.code;
      if(code==="auth/wrong-password"){fail("كلمة المرور غير صحيحة");return;}
      if(code==="auth/user-not-found"||code==="auth/invalid-credential"||code==="auth/invalid-login-credentials"){
        if(appu&&appu.pass===hash(password)&&Number(appu.active)){
          if(appu.role==="admin")cloudBootstrapAdmin(appu,password,fail);
          else fail("حسابك السحابي غير مُفعّل بعد — اطلب من المدير تفعيله من شاشة «الموظفون».");
        }else fail("اسم المستخدم أو كلمة المرور غير صحيحة");
        return;
      }
      fail("تعذّر تسجيل الدخول السحابي: "+((e&&e.message)||""));
    });
}
function provisionUserAccount(id){
  if(ME.role!=="admin"){alert("للمدير فقط.");return;}
  if(!cloudAccounts()){alert("المزامنة السحابية غير مفعّلة.");return;}
  const u=DB.users.find(x=>x.id===id);if(!u)return;
  const p=prompt('كلمة مرور الدخول السحابي للمستخدم "'+u.name+'" (٦ أحرف/أرقام على الأقل):');
  if(p===null)return;
  if(p.length<6){alert("كلمة المرور يجب ألا تقل عن ٦ خانات");return;}
  u.pass=hash(p);setCloudStatus("sync");
  const cb=function(err){
    if(err==="exists-diff-pass")alert("يوجد حساب سحابي بهذا الاسم بكلمة مرور مختلفة — احذفه من Firebase Authentication ثم أعد المحاولة");
    else if(err==="reauth-failed")alert("كلمة المرور الحالية غير صحيحة — لم تتغيّر");
    else if(err&&err!=="cancel")alert("تعذّر تحديث الحساب السحابي");
    else if(!err){logAct("حساب سحابي","تحديث حساب "+u.name);alert("تم تحديث الحساب السحابي لـ "+u.name);}
    save();setCloudStatus("ok");pEmployees();
  };
  if(ME&&id===ME.id)cloudChangeOwnPassword(p,cb);else cloudProvisionUser(u,p,cb);
}
function cloudInit(){
  if(!cloudEnabled()){setCloudStatus("off");return;}
  try{firebase.initializeApp(CLOUD_CONFIG);}catch(e){}
  if(cloudAccounts()){
    setCloudStatus("auth");
    firebase.auth().onAuthStateChanged(function(user){
      if(user&&!ME&&!cloudReady&&!cloudInteractive&&user.uid)afterCloudAuth(user,"");
    });
  }else{
    setCloudStatus("connecting");
    firebase.auth().signInAnonymously().catch(()=>setCloudStatus("err"));
    firebase.auth().onAuthStateChanged(function(user){if(user&&!cloudReady)cloudAttach();});
  }
}

  const res=citems().filter(i=>i.active!==false&&(i.code+i.name+(i.category||"")+(i.model||"")).toLowerCase().includes(q.toLowerCase())).slice(0,8);

function pickItem(id){

  if(mType==="outbound")$("#mPrice").value=picked.price||"";

  $("#mBalV").textContent=picked.qty+" "+(picked.unit||"");

function clearMove(all){
  ["mCode","mQty","mPrice","mCustoms"].forEach(i=>$("#"+i)&&($("#"+i).value=""));
  if(all){["mInvoice","mComm","mAddress","mNoteIn","mNoteOut"].forEach(i=>$("#"+i)&&($("#"+i).value=""));saleCart=[];renderCart();}

function currentLine(){
  if(!picked)return null;

  return {itemId:picked.id,qty,price:parseFloat($("#mPrice").value)||0};
}
function addToInvoice(){

function renderCart(){
  const box=$("#cartBox");if(!box)return;
  if(mType!=="outbound"||!saleCart.length){box.innerHTML="";return;}
  const total=saleCart.reduce((s,l)=>s+l.qty*l.price,0);
  box.innerHTML=`<div class="table-wrap"><table><thead><tr><th>الصنف/الموديل</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th><th></th></tr></thead>
    <tbody>${saleCart.map((l,idx)=>{const it=DB.items.find(x=>x.id===l.itemId)||{};
      return `<tr><td>${esc(itemModel(it))}</td><td>${l.qty}</td><td>${money(l.price)}</td><td>${money(l.qty*l.price)}</td>
        <td><button class="btn red sm" onclick="saleCart.splice(${idx},1);renderCart()">حذف</button></td></tr>`;}).join("")}
    <tr><td colspan="3"><b>إجمالي الفاتورة</b></td><td colspan="2"><b>${money(total)} ﷼</b></td></tr></tbody></table></div>`;
}
function saveMove(){
  const msg=$("#mMsg");const show=(t,c)=>msg.innerHTML=`<div class="msg ${c}">${t}</div>`;
  const date=$("#mDate").value||today();
  if(mType==="outbound"){
    const lines=saleCart.slice();const cur=currentLine();if(cur)lines.push(cur);
    if(!lines.length)return show("أضِف صنفاً واحداً على الأقل للفاتورة.","err");
    const need={};lines.forEach(l=>need[l.itemId]=(need[l.itemId]||0)+l.qty);
    for(const id in need){const it=DB.items.find(x=>x.id===+id);if(need[id]>it.qty)return show(`الرصيد غير كافٍ للصنف «${itemModel(it)}» (المتاح ${it.qty}).`,"err");}
    const gid="INV"+Date.now();const invNo=($("#mInvoice").value||"").trim()||gid;
    const comm=parseFloat($("#mComm").value)||0,addr=$("#mAddress").value||"",note=$("#mNoteOut").value||"";
    lines.forEach((l,idx)=>{const it=DB.items.find(x=>x.id===l.itemId);it.qty-=l.qty;
      DB.movements.unshift({id:nid("movement"),companyId:CO,itemId:it.id,type:"outbound",qty:l.qty,price:l.price||0,
        comm:idx===0?comm:0,model:itemModel(it),invoice:invNo,invGid:gid,address:addr,supplierId:null,customs:"",
        date,note,balAfter:it.qty,userId:ME.id,userName:ME.name,at:new Date().toISOString()});});
    logAct("منصرف","فاتورة "+invNo+" — "+lines.length+" صنف");save();
    saleCart=[];show(`✔ تم حفظ فاتورة البيع ${invNo} (${lines.length} صنف).`,"ok");
    clearMove(true);renderRecent();printInvoice(gid);
    return;
  }
  // وارد / تسوية — صنف واحد
  if(!picked)return show("اختر صنفاً أولاً.","err");
  const qty=parseFloat($("#mQty").value);if(!qty||qty<=0)return show("أدخل كمية صحيحة.","err");
  const item=DB.items.find(i=>i.id===picked.id);
  item.qty+=qty;
  DB.movements.unshift({id:nid("movement"),companyId:CO,itemId:item.id,type:mType,qty,price:parseFloat($("#mPrice").value)||0,
    comm:0,model:itemModel(item),invoice:"",invGid:"",address:"",supplierId:+($("#mSupplier")?.value)||null,
    customs:mType==="inbound"?($("#mCustoms").value||""):"",date,note:$("#mNoteIn")?.value||"",
    balAfter:item.qty,userId:ME.id,userName:ME.name,at:new Date().toISOString()});
  logAct(typeAr(mType),`${itemModel(item)} كمية ${qty}`);save();
  show(`✔ تم تسجيل ${typeAr(mType)} «${itemModel(item)}» بكمية ${qty}. الرصيد الآن: ${item.qty}`,"ok");
  clearMove(false);renderRecent();
}
function renderRecent(){
  const tb=$("#recentMoves");if(!tb)return;
  tb.innerHTML=cmoves().slice(0,25).map(m=>{const it=DB.items.find(i=>i.id===m.itemId)||{};const sup=DB.suppliers.find(x=>x.id===m.supplierId);

    ||`<tr><td colspan="9" class="empty">لا حركات.</td></tr>`;

function lookupInvoice(){

function brandHead(){const c=curCompany();return `<div class="co">${c.logo?`<img src="${c.logo}">`:`<span style="font-size:26px">${esc(c.icon||"🏢")}</span>`}<h3 style="margin:0">${esc(c.name||"شركتي")}</h3></div>`;}
function printReceipt(id){
  const m=DB.movements.find(x=>x.id===id);if(!m)return;
  if(m.invGid&&m.type==="outbound"){printInvoice(m.invGid);return;}
  const it=DB.items.find(i=>i.id===m.itemId)||{};const sup=DB.suppliers.find(x=>x.id===m.supplierId);
  showPrint(`${brandHead()}<h2>📦 سند ${typeAr(m.type)}</h2>
    <div>التاريخ: <b>${esc(m.date)}</b> · الموظف: <b>${esc(m.userName)}</b></div>
    <table><tr><th>الموديل / الصنف</th><th>الكمية</th><th>الرصيد بعدها</th>${m.type==="inbound"?"<th>المورد</th><th>رقم الفسح</th>":""}</tr>
    <tr><td>${esc(m.model||itemModel(it))}</td><td>${(isIn(m.type)?"+":"−")+m.qty}</td><td>${m.balAfter??"—"}</td>
    ${m.type==="inbound"?`<td>${esc(sup?sup.name:"—")}</td><td>${esc(m.customs||"—")}</td>`:""}</tr></table>
    ${m.note?`<div style="margin-top:8px">ملاحظات: ${esc(m.note)}</div>`:""}`);
}
function printInvoice(gid,withCancel){
  const lines=DB.movements.filter(m=>m.invGid===gid);
  if(!lines.length){toast("لا توجد بيانات للفاتورة");return;}
  const f=lines[0];const total=lines.reduce((s,m)=>s+m.qty*m.price,0);const comm=lines.reduce((s,m)=>s+(m.comm||0),0);
  const rows=lines.map(m=>{const it=DB.items.find(x=>x.id===m.itemId)||{};
    return `<tr><td>${esc(m.model||itemModel(it))}</td><td>${m.qty}</td><td>${money(m.price)}</td><td>${money(m.qty*m.price)}</td></tr>`;}).join("");
  const extra=withCancel?`<button class="btn red" onclick="cancelInvoice('${gid}')">🗑️ إلغاء الفاتورة (إرجاع الكميات)</button>`:"";
  showPrint(`${brandHead()}<h2>🧾 فاتورة بيع رقم ${esc(f.invoice)}</h2>
    <div>التاريخ: <b>${esc(f.date)}</b> · الموظف: <b>${esc(f.userName)}</b>${f.address?` · العنوان: <b>${esc(f.address)}</b>`:""}</div>
    <table><tr><th>الموديل / الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>${rows}
    <tr><td colspan="3"><b>إجمالي الفاتورة</b></td><td><b>${money(total)} ﷼</b></td></tr>
    ${comm?`<tr><td colspan="3"><b>العمولة</b></td><td><b>${money(comm)} ﷼</b></td></tr>`:""}</table>
    ${f.note?`<div style="margin-top:8px">ملاحظات: ${esc(f.note)}</div>`:""}`,extra);
}
function cancelInvoice(gid){
  const lines=DB.movements.filter(m=>m.invGid===gid);if(!lines.length)return;
  if(!confirm(`إلغاء الفاتورة «${lines[0].invoice}» وإرجاع كمياتها للمخزون؟`))return;
  lines.forEach(m=>{const it=DB.items.find(x=>x.id===m.itemId);if(it)it.qty+=m.qty;});
  DB.movements=DB.movements.filter(m=>m.invGid!==gid);
  logAct("إلغاء فاتورة",lines[0].invoice);save();
  const pm=$("#printModal");if(pm)pm.remove();
  toast("تم إلغاء الفاتورة وإرجاع الكميات");if(CURRENT_PAGE==="move")renderRecent();
}

/* ============ 3) تقرير فترة — وارد/منصرف لكل صنف خلال مدة ============ */
function pReport(){
  $("#view").innerHTML=`<div class="pagehead"><h1>📅 تقرير الوارد والمنصرف خلال فترة</h1>
    <button class="btn ghost no-print" onclick="window.print()">🖨️ طباعة</button></div>
  <div class="card no-print">
    <div class="formgrid">
      <div class="cell c3"><label>من تاريخ</label><input id="rFrom" type="date" value="${monthStart()}"></div>
      <div class="cell c3"><label>إلى تاريخ</label><input id="rTo" type="date" value="${today()}"></div>
      <div class="cell c3"><label>الفئة</label><select id="rCat"><option value="">كل الفئات</option>
        ${[...new Set(citems().map(i=>i.category).filter(Boolean))].map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>
      <div class="cell c3" style="display:flex;align-items:flex-end"><button class="btn block" onclick="renderReport()">عرض التقرير</button></div>
    </div>
  </div>
  <div id="reportOut" style="margin-top:16px"></div>`;
  renderReport();
}
function renderReport(){
  const from=$("#rFrom").value,to=$("#rTo").value,cat=$("#rCat").value;
  const inRange=d=>(!from||d>=from)&&(!to||d<=to);
  const items=citems().filter(i=>!cat||i.category===cat);
  const rows=items.map(it=>{
    const mv=DB.movements.filter(m=>m.itemId===it.id&&inRange(m.date));
    const inb=mv.filter(m=>isIn(m.type)).reduce((s,m)=>s+m.qty,0);
    const out=mv.filter(m=>m.type==="outbound").reduce((s,m)=>s+m.qty,0);
    // الرصيد أول المدة = الرصيد الحالي − صافي حركة المدة (تقريبي بافتراض عدم وجود حركات لاحقة للتاريخ)
    const after=DB.movements.filter(m=>m.itemId===it.id&&(!to||m.date>to)).reduce((s,m)=>s+(isIn(m.type)?m.qty:-m.qty),0);
    const closing=it.qty-after;const opening=closing-(inb-out);
    return {it,inb,out,opening,closing,net:inb-out};
  }).filter(r=>r.inb||r.out||r.opening||r.closing);
  const tIn=rows.reduce((s,r)=>s+r.inb,0),tOut=rows.reduce((s,r)=>s+r.out,0);
  window.__reportRows=rows.map(r=>[r.it.code,r.it.name,r.opening,r.inb,r.out,r.net,r.closing]);
  $("#reportOut").innerHTML=`
    <div class="grid-3" style="margin-bottom:14px">
      <div class="stat"><div class="lbl">إجمالي الوارد بالمدة</div><div class="val" style="color:var(--green)">${tIn}</div></div>
      <div class="stat"><div class="lbl">إجمالي المنصرف بالمدة</div><div class="val" style="color:var(--amber)">${tOut}</div></div>
      <div class="stat"><div class="lbl">صافي الحركة</div><div class="val">${tIn-tOut}</div></div>
    </div>
    <div class="card"><div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
      <span>من ${esc(from||"البداية")} إلى ${esc(to||"الآن")}</span>
      <button class="btn ghost sm no-print" onclick="exportCSV('تقرير-وارد-منصرف.csv',['الكود','الصنف','رصيد أول المدة','الوارد','المنصرف','الصافي','رصيد آخر المدة'],window.__reportRows||[])">⬇ Excel</button></div>
    <div class="table-wrap"><table><thead><tr><th>الموديل</th><th>الوصف</th><th>رصيد أول المدة</th>
      <th style="color:var(--green)">الوارد</th><th style="color:var(--amber)">المنصرف</th><th>الصافي</th><th>رصيد آخر المدة</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td style="font-family:monospace">${esc(itemModel(r.it))}</td><td>${esc(r.it.name&&r.it.name!==itemModel(r.it)?r.it.name:"")}</td>
        <td>${r.opening}</td><td style="color:var(--green);font-weight:700">${r.inb}</td>
        <td style="color:var(--amber);font-weight:700">${r.out}</td><td>${r.net}</td>
        <td style="font-weight:700">${r.closing}</td></tr>`).join("")||`<tr><td colspan="7" class="empty">لا حركات في هذه المدة.</td></tr>`}</tbody></table></div></div>`;
}

function renderLedger(){
  const id=+$("#lItem").value;const tb=$("#lTbl"),sum=$("#lSummary");
  if(!id){tb.innerHTML=`<tr><td colspan="10" class="empty">اختر صنفاً.</td></tr>`;sum.innerHTML="";return;}
  const from=$("#lFrom").value,to=$("#lTo").value,ty=$("#lType").value;
  const it=DB.items.find(i=>i.id===id);
  let rows=DB.movements.filter(m=>m.itemId===id);
  rows=rows.filter(m=>(!from||m.date>=from)&&(!to||m.date<=to)&&(!ty||m.type===ty));
  const inb=rows.filter(m=>isIn(m.type)).reduce((s,m)=>s+m.qty,0);
  const out=rows.filter(m=>m.type==="outbound").reduce((s,m)=>s+m.qty,0);
  sum.innerHTML=`<div class="grid-4" style="margin-bottom:14px">
    <div class="stat"><div class="lbl">الوارد (بالفلتر)</div><div class="val sm" style="color:var(--green)">${inb}</div></div>
    <div class="stat"><div class="lbl">المنصرف (بالفلتر)</div><div class="val sm" style="color:var(--amber)">${out}</div></div>

function saveItem(id){

  const data={code,model:code,name:name||code,category:g("f_cat"),unit:g("f_unit")||"قطعة",
    price:parseFloat(g("f_price"))||0,reorder:parseFloat(g("f_reorder"))||0};

  else{const q=parseFloat(g("f_qty"))||0;const cost=parseFloat(g("f_cost"))||0;

/* استيراد موديلات دفعة واحدة مع أرصدة افتتاحية (تقبل الصفر) */
function importModels(){
  if(!guard("canAdd"))return;
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box"><h3>📥 استيراد موديلات دفعة واحدة</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:8px">الأسهل: نزّل القالب الجاهز، املأه في Excel، ثم ارفعه. أو اكتب يدوياً كل موديل في سطر بصيغة: <b>الموديل , الرصيد الافتتاحي</b> (الرصيد اختياري ويقبل الصفر).</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <button class="btn blue sm" onclick="downloadImportTemplate()">⬇ تنزيل قالب Excel</button>
      <label class="btn amber sm" style="margin:0">⬆ رفع ملف Excel/CSV<input type="file" accept=".csv,text/csv,.xlsx" style="display:none" onchange="importFromFile(event)"></label>
    </div>
    <textarea id="imp_txt" style="width:100%;min-height:150px;padding:11px;border:1px solid var(--line);border-radius:9px;font-family:monospace" placeholder="BR-100 , 5&#10;غرفة مودرن , 0&#10;مرتبة طبية , 8"></textarea>
    <label style="margin-top:10px"><input type="checkbox" id="imp_zero" style="width:auto"> اجعل كل الأرصدة الافتتاحية = صفر</label>
    <div id="imp_msg" style="color:var(--red);font-size:13px;margin:8px 0"></div>
    <div style="display:flex;gap:8px"><button class="btn green" onclick="doImportModels()">استيراد</button>
      <button class="btn gray" onclick="this.closest('.modal').remove()">إلغاء</button></div></div>`;
  document.body.appendChild(m);
}
function downloadImportTemplate(){
  const rows=[["الموديل","الرصيد الافتتاحي"],["BR-100","5"],["BR-200","0"],["MT-10","12"]];
  const csv=rows.map(r=>r.join(",")).join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="قالب-استيراد-الموديلات.csv";a.click();
  toast("نزّل القالب، املأه في Excel واحفظه بصيغة CSV ثم ارفعه");
}
function importFromFile(e){
  const f=e.target.files[0];if(!f)return;
  if(/\.xlsx$/i.test(f.name)){alert("احفظ الملف من Excel بصيغة CSV (ملف بقيم مفصولة بفواصل) ثم ارفعه.");return;}
  const r=new FileReader();
  r.onload=()=>{let t=String(r.result||"");
    // إزالة سطر العناوين إن وُجد
    const lines=t.split(/\r?\n/).filter(l=>l.trim());
    if(lines[0]&&/الموديل|model/i.test(lines[0]))lines.shift();
    $("#imp_txt").value=lines.join("\n");
    toast("تم تحميل الملف — راجع القائمة ثم اضغط استيراد");
  };
  r.readAsText(f,"utf-8");
}
function doImportModels(){
  const txt=$("#imp_txt").value||"",zero=$("#imp_zero").checked;
  const lines=txt.split(/\n+/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length){$("#imp_msg").textContent="أدخل موديلاً واحداً على الأقل.";return;}
  let added=0,skipped=0;
  lines.forEach(line=>{
    const parts=line.split(/[,،\t]/).map(s=>s.trim());
    const code=parts[0];if(!code)return;
    let qty=zero?0:(parseFloat(parts[1])||0);
    if(citems().some(i=>itemModel(i).toLowerCase()===code.toLowerCase())){skipped++;return;}
    const it={id:nid("item"),companyId:CO,qty,cost:0,active:true,code,model:code,name:code,category:"",unit:"قطعة",price:0,reorder:0};
    DB.items.push(it);added++;
    if(qty>0)DB.movements.unshift({id:nid("movement"),companyId:CO,itemId:it.id,type:"inbound",qty,price:0,comm:0,model:code,invoice:"",invGid:"",address:"",supplierId:null,customs:"",date:today(),note:"رصيد افتتاحي (استيراد)",balAfter:qty,userId:ME.id,userName:ME.name,at:new Date().toISOString()});
  });
  logAct("استيراد موديلات",`أُضيف ${added} — تكرار ${skipped}`);save();
  document.querySelector(".modal").remove();renderItems();
  toast(`تم استيراد ${added} موديل${skipped?` (تجاهل ${skipped} مكرّر)`:""}`);
}
function delItem(id){
  if(!guard("canDelete"))return;
  const it=DB.items.find(i=>i.id===id);
  if(DB.movements.some(m=>m.itemId===id)){alert("لا يمكن حذف موديل له حركات مسجلة.");return;}
  if(!confirm(`حذف الموديل «${itemModel(it)}»؟`))return;
  DB.items=DB.items.filter(i=>i.id!==id);logAct("حذف موديل",itemModel(it));save();renderItems();
}

function saveUser(id){
  const name=$("#u_name").value.trim(),role=$("#u_role").value,
        username=$("#u_user").value.trim(),active=+$("#u_active").value,pass=$("#u_pass").value;
  if(!name){$("#u_msg").textContent="الاسم مطلوب.";return;}
  if(!username){$("#u_msg").textContent="اسم المستخدم مطلوب.";return;}
  if(DB.users.some(x=>(x.username||"").toLowerCase()===username.toLowerCase()&&x.id!==id)){$("#u_msg").textContent="اسم المستخدم مستخدم مسبقاً.";return;}
  if(!id&&(!pass||pass.length<6)){$("#u_msg").textContent="كلمة المرور مطلوبة (٦ خانات على الأقل).";return;}
  if(pass&&pass.length<6){$("#u_msg").textContent="كلمة المرور يجب ألا تقل عن ٦ خانات.";return;}
  const perms={};document.querySelectorAll("#u_perms input[data-perm]").forEach(c=>perms[c.dataset.perm]=c.checked);
  if(id){const u=DB.users.find(x=>x.id===id);u.name=name;u.role=role;u.username=username;u.active=active;u.perms=perms;
    if(pass)u.pass=hash(pass);logAct("تعديل مستخدم",name);}
  else{DB.users.push({id:nid("user"),name,username,pass:hash(pass),role,active,perms,fbUid:"",lastLogin:""});logAct("إضافة مستخدم",name);}
  save();document.querySelector(".modal").remove();pEmployees();
}
function fillPreset(){
  const role=$("#u_role").value,p=preset(role);

function delUser(id){

  DB.users=DB.users.filter(x=>x.id!==id);logAct("حذف مستخدم",u.name);save();pEmployees();
}

function pSettings(){
  if(!can("settings")){go("move");return;}
  const c=curCompany();const isAdmin=ME.role==="admin";
  $("#view").innerHTML=`<div class="pagehead"><h1>⚙️ الإعدادات</h1></div>
  <div class="grid-2">
    <div class="card"><div class="card-title">🏢 هوية الشركة الحالية</div>
      <div class="row"><div class="field"><label>اسم الشركة / النشاط</label><input id="setCompany" value="${esc(c.name||"")}"></div>
        <div class="field"><label>رمز النشاط (إيموجي)</label><input id="setIcon" value="${esc(c.icon||"🏢")}" placeholder="🛏️ 🍎 🔧" style="text-align:center;font-size:20px"></div></div>
      <div class="field" style="margin-bottom:12px"><label>الشعار (اختياري — يظهر بدل الرمز)</label>
        <input type="file" id="setLogo" accept="image/*" onchange="pickLogo(event)">
        <div style="margin-top:8px">${c.logo?`<img src="${c.logo}" class="brandlogo">`:`<span style="font-size:26px">${esc(c.icon||"🏢")}</span>`}</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn green" onclick="saveSettings()">حفظ</button>
        ${c.logo?`<button class="btn gray" onclick="curCompany().logo='';save();applyBrand();pSettings();toast('تم حذف الشعار')">حذف الشعار</button>`:""}</div>
      <p style="font-size:12px;color:var(--muted);margin-top:10px">تظهر هذه الهوية في شاشة الدخول والقائمة والسندات المطبوعة.</p>
    </div>
    <div class="card"><div class="card-title">🏬 الشركات</div>
      <div class="table-wrap"><table><thead><tr><th>الشركة</th><th>عدد الأصناف</th>${isAdmin?"<th></th>":""}</tr></thead>
        <tbody>${DB.companies.map(x=>`<tr><td>${esc((x.icon||"")+" "+x.name)}${x.id===CO?' <span class="tag inbound">الحالية</span>':""}</td>
          <td>${DB.items.filter(i=>i.companyId===x.id).length}</td>
          ${isAdmin?`<td style="white-space:nowrap">${x.id!==CO?`<button class="btn blue sm" onclick="switchCompany(${x.id})">تحديد</button>`:""}
            <button class="btn red sm" onclick="delCompany(${x.id})">حذف</button></td>`:""}</tr>`).join("")}</tbody></table></div>
      ${isAdmin?`<button class="btn amber block" style="margin-top:10px" onclick="addCompany()">➕ إضافة شركة جديدة</button>`:""}
      <div class="card-title" style="margin-top:16px">☁️ حالة النظام</div>
      <p style="font-size:13px;line-height:1.9">الوضع: <b>${cloudAccounts()?"سحابي (حساب لكل مستخدم)":"محلي"}</b> · المستخدم: <b>${esc(ME.name)}</b> — ${roleAr(ME.role)}<br>
        التعديلات تُنشر تلقائياً عبر GitHub وتظهر لك وللموظفين بعد تحديث الصفحة.</p>
      <button class="btn blue" onclick="changeMyPassword()">🔑 تغيير كلمة مروري</button>
    </div>
  </div>`;
}
let _logoData="";
function pickLogo(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{_logoData=r.result;toast("سيُحفظ الشعار عند الضغط على حفظ");};r.readAsDataURL(f);}
function saveSettings(){
  if(!guard("settings"))return;
  const c=curCompany();c.name=$("#setCompany").value.trim()||"شركتي";c.icon=$("#setIcon").value.trim()||"🏢";
  if(_logoData){c.logo=_logoData;_logoData="";}
  if(DB.companies[0]&&DB.companies[0].id===c.id)DB.settings.company=c.name;
  logAct("تعديل هوية الشركة",c.name);save();applyBrand();toast("تم حفظ الإعدادات");pSettings();
}
function delCompany(id){
  if(ME.role!=="admin"){toast("للمدير فقط");return;}
  if(DB.companies.length<=1){toast("لا يمكن حذف الشركة الوحيدة");return;}
  if(DB.items.some(i=>i.companyId===id)||DB.movements.some(m=>m.companyId===id)){alert("لا يمكن حذف شركة بها أصناف أو حركات. احذف بياناتها أولاً.");return;}
  const c=DB.companies.find(x=>x.id===id);if(!confirm(`حذف الشركة «${c.name}»؟`))return;
  DB.companies=DB.companies.filter(x=>x.id!==id);
  if(CO===id){CO=DB.companies[0].id;try{localStorage.setItem("inv_company",String(CO));}catch(e){}}
  logAct("حذف شركة",c.name);save();applyBrand();pSettings();
}
function changeMyPassword(){
  const p=prompt("كلمة المرور الجديدة (٦ خانات على الأقل):");
  if(p===null)return;if(p.length<6){toast("٦ خانات على الأقل");return;}
  const u=DB.users.find(x=>x.id===ME.id);u.pass=hash(p);u.pwTemp=0;
  if(cloudAccounts()){cloudChangeOwnPassword(p,function(err){
    if(err&&err!=="cancel")toast("تعذّر تحديث كلمة المرور سحابياً");else if(!err){save();toast("تم تغيير كلمة المرور");}
  });}else{save();toast("تم تغيير كلمة المرور");}
}

/* ---------- طلبات الانضمام (تسجيل ذاتي بموافقة المدير) ---------- */
function toggleJoin(){
  const lf=$("#loginFields"),jf=$("#joinFields"),tg=$("#joinToggle"),lead=$("#loginLead");
  const joining=jf.style.display==="none";
  jf.style.display=joining?"block":"none";lf.style.display=joining?"none":"block";
  tg.textContent=joining?"لديك حساب؟ عُد لتسجيل الدخول":"ليس لديك حساب؟ اطلب حساباً جديداً";
  loginErr("");$("#loginOk").style.display="none";
  if(lead)lead.textContent=joining?"أنشئ حساباً وانتظر موافقة المدير":"سجّل الدخول للمتابعة";
}
function submitJoinRequest(){
  if(!cloudAccounts()){loginErr("التسجيل الذاتي متاح في النسخة السحابية فقط.");return;}
  const name=($("#jn_name").value||"").trim(),u=($("#jn_user").value||"").trim(),p=$("#jn_pass").value||"";
  if(!name||!u){loginErr("أدخل الاسم واسم المستخدم");return;}
  if(p.length<6){loginErr("كلمة المرور يجب ألا تقل عن ٦ خانات");return;}
  loginErr("");cloudInteractive=true;setCloudStatus("connecting");
  const email=synthEmail(u);
  firebase.auth().createUserWithEmailAndPassword(email,p).then(function(cred){
    return firebase.database().ref("workspaces/"+cloudWid()+"/requests/"+cred.user.uid)
      .set({name:name,username:u,ts:new Date().toISOString(),uid:cred.user.uid}).then(()=>firebase.auth().signOut());
  }).then(function(){
    $("#jn_name").value="";$("#jn_user").value="";$("#jn_pass").value="";
    toggleJoin();setCloudStatus("auth");
    const ok=$("#loginOk");ok.innerHTML="تم إرسال طلبك ✅ بانتظار موافقة المدير، ثم ادخل باسم المستخدم وكلمة المرور.";ok.style.display="block";
  }).catch(function(e){
    setCloudStatus("auth");
    if(e&&e.code==="auth/email-already-in-use")loginErr("اسم المستخدم مستخدم بالفعل — اختر اسماً آخر أو سجّل الدخول.");
    else if(e&&e.code==="auth/weak-password")loginErr("كلمة المرور ضعيفة — ٦ خانات على الأقل.");
    else loginErr("تعذّر إرسال الطلب: "+((e&&e.message)||""));
  });
}
function renderJoinRequests(){
  const box=$("#joinReqBox");if(!box)return;
  if(!cloudAccounts()||ME.role!=="admin"){box.innerHTML="";return;}
  firebase.database().ref("workspaces/"+cloudWid()+"/requests").once("value").then(function(snap){
    const v=snap.val()||{},keys=Object.keys(v);window.__joinReq=v;
    if(!keys.length){box.innerHTML="";return;}
    box.innerHTML=`<div class="card" style="margin-top:16px;border-color:var(--amber)"><div class="card-title" style="color:var(--amber)">🔔 طلبات انضمام بانتظار الموافقة (${keys.length})</div>
      <div class="table-wrap"><table><thead><tr><th>الوقت</th><th>الاسم</th><th>اسم المستخدم</th><th></th></tr></thead>
      <tbody>${keys.map(k=>{const r=v[k]||{};return `<tr><td>${esc(fmt(r.ts||""))}</td><td>${esc(r.name||"")}</td><td>${esc(r.username||"")}</td>
        <td style="white-space:nowrap"><button class="btn green sm" onclick="approveJoin('${k}')">موافقة</button>
        <button class="btn red sm" onclick="rejectJoin('${k}')">رفض</button></td></tr>`;}).join("")}</tbody></table></div></div>`;
  }).catch(()=>{box.innerHTML="";});
}
function approveJoin(ruid){
  if(!guard("employees"))return;
  const r=(window.__joinReq||{})[ruid];if(!r){toast("حدّث القائمة وأعد المحاولة");return;}
  if(DB.users.some(x=>(x.username||"").toLowerCase()===String(r.username).toLowerCase())){toast("اسم المستخدم مستخدم بالفعل");return;}
  DB.users.push({id:nid("user"),name:r.name||r.username,username:r.username,pass:hash("cloud-"+ruid),
    role:"employee",active:1,perms:preset("employee"),fbUid:ruid,lastLogin:""});
  firebase.database().ref("workspaces/"+cloudWid()+"/members/"+ruid).set({username:r.username,role:"employee",active:1}).catch(()=>{});
  firebase.database().ref("workspaces/"+cloudWid()+"/requests/"+ruid).remove().catch(()=>{});
  logAct("قبول انضمام",(r.name||r.username));save();toast("تمت الموافقة — عدّل صلاحياته من الجدول");pEmployees();
}
function rejectJoin(ruid){
  if(!guard("employees"))return;
  const r=(window.__joinReq||{})[ruid];
  if(!confirm("رفض الطلب وحذفه؟"))return;
  firebase.database().ref("workspaces/"+cloudWid()+"/requests/"+ruid).remove().catch(()=>{});
  logAct("رفض انضمام",r?(r.name||r.username):"");toast("تم رفض الطلب");renderJoinRequests();
}

/* ---------- تصدير CSV (يفتح في Excel) ---------- */
function exportCSV(filename,headers,rows){
  if(!guard("canExport"))return;
  const esc2=v=>{v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const csv=[headers.map(esc2).join(",")].concat(rows.map(r=>r.map(esc2).join(","))).join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;a.click();
  toast("تم التصدير");
}

/* ---------- تثبيت التطبيق (PWA) ---------- */
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;
  document.querySelectorAll(".installBtn").forEach(b=>b.style.display="block");});
window.addEventListener("appinstalled",()=>{deferredPrompt=null;
  document.querySelectorAll(".installBtn").forEach(b=>b.style.display="none");toast("تم تثبيت التطبيق ✅");});
function isStandalone(){return window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;}
async function installApp(){
  if(deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice;}catch(e){}deferredPrompt=null;return;}
  const iOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div class="box" style="max-width:360px"><h3>📲 تثبيت التطبيق على الجوال</h3>
    ${iOS?`<p style="line-height:2;font-size:14px">على iPhone/iPad (متصفح Safari):<br>
      1) اضغط زر المشاركة <b>⬆️</b> بالأسفل.<br>
      2) اختر <b>«إضافة إلى الشاشة الرئيسية»</b>.<br>
      3) اضغط <b>«إضافة»</b> — تظهر أيقونة التطبيق.</p>`
    :`<p style="line-height:2;font-size:14px">على أندرويد (متصفح Chrome):<br>
      1) افتح قائمة المتصفح <b>⋮</b> بالأعلى.<br>
      2) اختر <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>.<br>
      3) أكّد — تظهر أيقونة التطبيق.</p>`}
    <button class="btn green block" onclick="this.closest('.modal').remove()">حسناً</button></div>`;
  document.body.appendChild(m);
}

/* ---------- نسخ احتياطي / استرجاع ---------- */
function backup(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download=`inventory-backup-${today()}.json`;a.click();
}
function restore(){$("#restoreFile").click();}
$("#restoreFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{DB=JSON.parse(r.result);save();alert("تم الاسترجاع بنجاح.");go("dashboard");}catch{alert("ملف غير صالح.");}};r.readAsText(f);};
