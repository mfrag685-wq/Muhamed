function hash(s) { let h = 5381; s = String(s) + '::mfarag'; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return 'h' + h.toString(36); }

function setPath(obj, path, value) {
  const parts = path.split('/'); let o = obj;
  for (let i = 0; i < parts.length - 1; i++) { if (o[parts[i]] === null || typeof o[parts[i]] !== 'object') { if (value === null) return; o[parts[i]] = {}; } o = o[parts[i]]; }

}

/* رقم الشحنة SH-YYYYMM-0001 بعدّاد سحابي ذري، فلا يتكرر الرقم بين جهازين */
async function nextRef(tripDate) {
  const ym = tripDate.slice(0, 4) + tripDate.slice(5, 7), prefix = `SH-${ym}-`;
  const localMax = allShips().filter((s) => String(s.ref_no || '').startsWith(prefix)).reduce((m, s) => Math.max(m, parseInt(s.ref_no.slice(prefix.length), 10) || 0), 0);
  const tx = FB.root.child('seq/' + ym).transaction((cur) => Math.max(cur || 0, localMax) + 1);
  const r = await Promise.race([tx, new Promise((_, rej) => setTimeout(() => rej(apiErr('network')), 12000))]);
  if (!r.committed) throw apiErr('server_error');
  return prefix + String(r.snapshot.val()).padStart(4, '0');
}

const DOC_DEFS = {
  drivers: [['iqama_expiry', 'doc_iqama'], ['license_expiry', 'doc_license'], ['passport_expiry', 'doc_passport']],
  trucks: [['reg_expiry', 'doc_reg'], ['insurance_expiry', 'doc_insurance'], ['op_card_expiry', 'doc_op_card'], ['inspection_expiry', 'doc_inspection']],

const BUCKET_ORDER = ['expired', 'd30', 'd60', 'd90', 'ok', 'missing'];
function daysLeft(date) { return Math.round((Date.parse(date) - Date.parse(today())) / 864e5); }
function bucketOf(days) { return days === null ? 'missing' : days < 0 ? 'expired' : days <= 30 ? 'd30' : days <= 60 ? 'd60' : days <= 90 ? 'd90' : 'ok'; }
function docStatus(table, r) {
  const defs = DOC_DEFS[table]; if (!defs) return null;
  const list = defs.map(([f, label]) => { const days = isYmd(r[f]) ? daysLeft(r[f]) : null; return { field: f, label, date: r[f] || null, days, bucket: bucketOf(days) }; });
  const worst = list.filter((x) => x.bucket !== 'missing').sort((a, b) => a.days - b.days)[0];
  return { list, worst: worst || null, missing: list.filter((x) => x.bucket === 'missing').length };
}
function expiryItems() {

/* ---------- المطابقة مع ملفات ساب ---------- */
const normCode = (v) => String(v ?? '').trim().toUpperCase().replace(/\s+/g, '').replace(/^0+(?=.)/, '');
const dayDiff = (a, b) => Math.round(Math.abs(Date.parse(a) - Date.parse(b)) / 864e5);
function parseQty(v) {
  const s = String(v ?? '').trim(); if (!s) return null;
  if (/^\d+([.,]0+)?$/.test(s)) return parseInt(s, 10);
  const n = parseFloat(s.replace(/,/g, '')); return Number.isFinite(n) ? n : null;
}
const sysView = (x) => x && ({ shipment_id: x.shipment_id, ref_no: x.ref_no, trip_date: x.trip_date, status: x.status, sap_document_no: x.sap_document_no || null,
  driver_name: x.driver_name, vendor: x.sap_vendor_code, client_name: x.client_name, customer: x.sap_customer_code, vin: x.vin, condition: x.condition, qty: x.vehicle_count });

async function reconcile(b) {
  need('admin', 'supervisor');
  const { mode, from, to, file_name } = b;
  const tol = Math.max(0, Number(b.tolerance_days ?? 2));
  const input = Array.isArray(b.rows) ? b.rows : [];
  if (!['vin', 'shipment'].includes(mode) || !isYmd(from) || !isYmd(to) || !input.length) throw apiErr('required_fields');
  const inPeriod = (d) => d >= from && d <= to;
  const ships = allShips().filter((s) => s.status !== 'cancelled').map((s) => ({ ...s, shipment_id: s.id }));
  let all;
  if (mode === 'vin') all = ships.flatMap((s) => s.vehicles.map((v) => ({ ...s, vehicle_id: s.id + '/' + v.id, vin: v.vin, condition: v.condition })));
  else all = ships;
  const periodList = all.filter((x) => inPeriod(x.trip_date));
  const lookup = new Map();
  const add = (k, x) => { if (!k) return; if (!lookup.has(k)) lookup.set(k, []); if (!lookup.get(k).includes(x)) lookup.get(k).push(x); };
  if (mode === 'vin') all.forEach((x) => add(x.vin, x));
  else all.forEach((x) => { add(normCode(x.ref_no), x); add(normCode(x.sap_document_no), x); });

  const items = [], seen = new Map(), matchedIds = new Set(), suggestions = new Map();
  let skipped = 0;
  for (const r of input) {
    const key = mode === 'vin' ? normVin(r.key) : normCode(r.key);
    if (!key) { skipped++; continue; }
    const sap = { date: isYmd(r.date) ? r.date : null, customer: r.customer || null, vendor: r.vendor || null, doc: r.doc || null, qty: parseQty(r.qty) };
    const item = { key, row: r.row, sap, sys: null, diffs: [] };
    if (seen.has(key)) { item.status = 'duplicate_in_sap'; item.first_row = seen.get(key); items.push(item); continue; }
    seen.set(key, r.row);
    const cands = lookup.get(key) || [];
    if (!cands.length) { item.status = 'missing_in_system'; items.push(item); continue; }
    const pick = [...cands].sort((a, c) => {
      if (sap.date) return dayDiff(a.trip_date, sap.date) - dayDiff(c.trip_date, sap.date);
      return (inPeriod(c.trip_date) - inPeriod(a.trip_date)) || String(c.trip_date).localeCompare(a.trip_date);
    })[0];
    item.sys = sysView(pick);
    matchedIds.add(mode === 'vin' ? pick.vehicle_id : pick.shipment_id);
    const d = item.diffs;
    if (sap.customer && normCode(sap.customer) !== normCode(pick.sap_customer_code)) d.push({ field: 'customer', sap: sap.customer, sys: pick.sap_customer_code || '' });
    if (sap.vendor && normCode(sap.vendor) !== normCode(pick.sap_vendor_code)) d.push({ field: 'vendor', sap: sap.vendor, sys: pick.sap_vendor_code || '' });
    if (sap.date && dayDiff(sap.date, pick.trip_date) > tol) d.push({ field: 'date', sap: sap.date, sys: pick.trip_date });
    if (!sap.date && !inPeriod(pick.trip_date)) d.push({ field: 'period', sap: `${from} / ${to}`, sys: pick.trip_date });
    if (mode === 'shipment' && sap.qty !== null && sap.qty !== pick.vehicle_count) d.push({ field: 'qty', sap: sap.qty, sys: pick.vehicle_count });
    if (sap.doc) {
      if (pick.sap_document_no && normCode(sap.doc) !== normCode(pick.sap_document_no)) d.push({ field: 'doc', sap: sap.doc, sys: pick.sap_document_no });
      if (!pick.sap_document_no && !suggestions.has(pick.shipment_id)) suggestions.set(pick.shipment_id, { shipment_id: pick.shipment_id, ref_no: pick.ref_no, doc: String(sap.doc).trim() });
    }
    item.status = d.length ? 'mismatch' : 'matched';
    items.push(item);
  }
  for (const x of periodList) {
    const id = mode === 'vin' ? x.vehicle_id : x.shipment_id;
    if (!matchedIds.has(id)) items.push({ status: 'missing_in_sap', key: mode === 'vin' ? x.vin : x.ref_no, row: null, sap: null, sys: sysView(x), diffs: [] });
  }
  const count = (s) => items.filter((i) => i.status === s).length;
  const summary = { sap_rows: input.length, skipped, system_rows: periodList.length, matched: count('matched'), mismatch: count('mismatch'),
    missing_in_system: count('missing_in_system'), missing_in_sap: count('missing_in_sap'), duplicate_in_sap: count('duplicate_in_sap') };
  const result = { mode, from, to, tolerance_days: tol, file_name: file_name || null, summary, items, doc_suggestions: [...suggestions.values()] };

  /* الحفظ: فهرس خفيف يُزامَن دائماً، والنتيجة الكاملة تُجلب عند فتحها فقط؛ نحتفظ بآخر 30 مطابقة */
  const id = newKey(), created_at = nowStr();
  const up = { [`reconIdx/${id}`]: { mode, period_from: from, period_to: to, file_name: file_name || null, summary, created_at, user_name: userName() },
    [`reconData/${id}`]: JSON.stringify({ ...result, created_at }) };
  Object.keys(S.reconIdx || {}).map((k) => [k, S.reconIdx[k].created_at || '']).sort((a, c) => c[1].localeCompare(a[1])).slice(29)
    .forEach(([k]) => { up[`reconIdx/${k}`] = null; up[`reconData/${k}`] = null; });
  write(up);
  return { id, ...result };
}

const API_ROUTES = [

  ['POST', /^\/drivers$/, ({ body }) => masterSave('drivers', null, body)],

  ['GET', /^\/clients$/, ({ q }) => masterList('clients', q.get('all') === '1')],
  ['POST', /^\/clients$/, ({ body }) => masterSave('clients', null, body)],
  ['PUT', /^\/clients\/([\w-]+)$/, ({ p, body }) => masterSave('clients', p[0], body)],

  ['GET', /^\/shipments$/, ({ q }) => {
    const st = q.get('status'), month = q.get('month'), drv = q.get('driver_id'), qq = String(q.get('q') || '').trim().toLowerCase(), vq = normVin(qq);
    const scope = q.get('scope'), permit = q.get('permit'), cli = q.get('client_id');
    return allShips().filter((s) => (!STATUSES.includes(st) || s.status === st) && (!drv || s.driver_id === drv)
      && (!scope || s.scope === scope) && (!cli || s.client_id === cli)
      && (!permit || (permit === 'missing' ? !s.permit_no && s.status !== 'cancelled' : !!s.permit_no))
      && (!/^\d{4}-\d{2}$/.test(month || '') || String(s.trip_date || '').slice(0, 7) === month)
      && (!qq || [s.ref_no, s.driver_name, s.client_name, s.origin, s.destination, s.origin_country, s.destination_country, s.permit_no, s.truck_plate].some((x) => String(x || '').toLowerCase().includes(qq)) || (vq && s.vehicles.some((v) => v.vin.includes(vq)))))
      .sort((a, b) => String(b.trip_date).localeCompare(a.trip_date) || String(b.created_at || '').localeCompare(a.created_at || '')).slice(0, 300);
  }],
  ['GET', /^\/shipments\/([\w-]+)$/, ({ p }) => { const s = shipView(p[0]); if (!s) throw apiErr('not_found'); return s; }],
  ['POST', /^\/shipments$/, async ({ body: b }) => {
    if (!b.driver_id || !clean(b.origin) || !clean(b.destination) || !Array.isArray(b.vehicles) || !b.vehicles.length) throw apiErr('required_fields');
    if (!S.drivers[b.driver_id]) throw apiErr('required_fields');
    const vehicles = b.vehicles.map((v) => ({ vin: normVin(v.vin), model: clean(v.model), color: clean(v.color) }));
    const invalid = vehicles.filter((v) => !VIN_RE.test(v.vin)).map((v) => v.vin);
    if (invalid.length) throw apiErr('vin_invalid', { vins: invalid });
    const seen = new Set(), dups = [];
    vehicles.forEach((v) => (seen.has(v.vin) ? dups.push(v.vin) : seen.add(v.vin)));
    if (dups.length) throw apiErr('vin_duplicate', { vins: dups });
    const conflicts = activeConflicts([...seen]);

const API = {
  async req(method, url, body) {
    if (!FB.root) throw apiErr('unauthorized');
    const [path, qs] = url.split('?');
    for (const [m, re, fn] of API_ROUTES) {
      if (m !== method) continue;
      const mm = path.match(re);
      if (mm) return fn({ p: mm.slice(1), q: new URLSearchParams(qs || ''), body: body || {} });
    }
    throw apiErr('not_found');
  },
  get(u) { return this.req('GET', u); },
  post(u, b) { return this.req('POST', u, b || {}); },
  put(u, b) { return this.req('PUT', u, b || {}); },
  patch(u, b) { return this.req('PATCH', u, b || {}); },
  del(u) { return this.req('DELETE', u); },
};

/* ---------- الدخول بحسابات نظام التوريد ---------- */
async function resolveMe(fu) {
  let mem;
  try { mem = (await memberRef(fu.uid).once('value')).val(); }
  catch (e) { throw apiErr(/network|disconnect/i.test(String(e && (e.code || e.message))) ? 'network' : 'not_member'); }
  if (!mem) throw apiErr('not_member');
  if (mem.active === 0) throw apiErr('inactive');
  await fleetAttach();
  const u = S.users[fu.uid] || {};
  const role = mem.role === 'admin' ? 'admin' : u.active === 0 ? '' : u.role || '';
  if (!role) throw apiErr('not_fleet');
  window.ME = { id: fu.uid, username: mem.username || u.username || '', full_name: u.full_name || mem.name || mem.username || '', role, ws_admin: mem.role === 'admin' };
  /* اسم المستخدم يُحفظ ليعرضه المدير في «المستخدمون» */
  if (mem.role !== 'admin' && u.username !== window.ME.username) write({ [`users/${fu.uid}/username`]: window.ME.username });
}
async function fleetLogin(username, password) {
  let cred;
  try { cred = await firebase.auth().signInWithEmailAndPassword(synthEmail(username), password); }
  catch (e) { throw apiErr(/network/i.test(String(e && e.code)) ? 'network' : 'invalid_credentials'); }
  try { await resolveMe(cred.user); }
  catch (e) { try { await firebase.auth().signOut(); } catch {} throw e; }
}
function fleetLogout() {
  try { firebase.auth().signOut(); } catch {}
  cacheClear(); window.ME = null; location.hash = '#/dashboard'; location.reload();
}
/* تغيّر صلاحيتي من جهاز المدير يُطبَّق فوراً */
function refreshMyRole() {
  if (!window.ME || window.ME.ws_admin) return;
  const u = S.users[window.ME.id] || {}, role = u.active === 0 ? '' : u.role || '';
  if (!role) { toast(t('err_not_fleet'), 'err'); setTimeout(fleetLogout, 2500); return; }
  if (role !== window.ME.role || (u.full_name && u.full_name !== window.ME.full_name)) { window.ME.role = role; window.ME.full_name = u.full_name || window.ME.full_name; return true; }
}

/* إعادة رسم الصفحة الحالية عند وصول تعديل من جهاز آخر — دون مقاطعة كتابة أو نافذة مفتوحة */
let rrTimer;

/* فحص وجود إصدار جديد (تطبيق صفحة واحدة لا يُعاد تحميله تلقائياً) */
(function () {
  let busy = false, shown = false;
  function check(auto) {
    if (busy || !window.fetch) return; busy = true;
    fetch(location.pathname + '?_v=' + Date.now(), { cache: 'no-store' }).then((r) => (r.ok ? r.text() : '')).then((txt) => {
      busy = false; const m = /APP_BUILD = '([^']+)'/.exec(txt || ''); if (!m || m[1] === APP_BUILD) return;
      if (auto && !document.querySelector('#modal-root > *')) { location.reload(); return; }
      if (shown) return; shown = true;
      const b = document.createElement('div');
      b.className = 'no-print fixed z-[70] inset-x-3 bottom-24 md:bottom-6 md:inset-x-auto md:end-6 rounded-xl bg-ink text-white px-4 py-3 flex items-center gap-3 shadow-xl';
      b.innerHTML = `<span class="text-sm">🔄 ${LANG === 'ar' ? 'يتوفر تحديث جديد للنظام' : 'A new version is available'}</span><button class="btn btn-signal py-1.5" onclick="location.reload()">${LANG === 'ar' ? 'تحديث الآن' : 'Update'}</button>`;
      document.body.appendChild(b);
    }).catch(() => { busy = false; });
  }
  setInterval(() => check(false), 180000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(true); });
  setTimeout(() => check(false), 15000);
})();

function splitCsvLine(line, d) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) { if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true; else if (c === d) { out.push(cur); cur = ''; } else cur += c;
  }
  out.push(cur); return out;
}

function parseDelimited(text) {
  const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter((l) => l.trim() && !/^[\s\-=|+_]+$/.test(l));
  const sample = lines.slice(0, 30).join('\n');
  const delim = ['\t', ';', '|', ','].map((d) => [d, sample.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  return lines.map((l) => (delim === '|' ? l.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|') : splitCsvLine(l, delim)).map((c) => c.trim()));
}

async function readSapFile(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  if (['xlsx', 'xls', 'xlsm', 'xlsb'].includes(ext)) {
    await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    const sheets = {};
    wb.SheetNames.forEach((n) => (sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' })));
    return sheets;
  }
  const buf = await file.arrayBuffer();
  let text = new TextDecoder('utf-8').decode(buf);
  if (text.includes('\uFFFD')) text = new TextDecoder('windows-1256').decode(buf); // ملفات ويندوز العربية القديمة
  return { [file.name]: parseDelimited(text) };
}

function toISODate(v) {
  if (v === null || v === undefined || v === '') return null;
  const ymd = (y, m, d) => { const s = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`; return +m >= 1 && +m <= 12 && +d >= 1 && +d <= 31 ? s : null; };
  if (v instanceof Date && !isNaN(v)) { const d = new Date(v.getTime() + 60000); return ymd(d.getFullYear(), d.getMonth() + 1, d.getDate()); }
  if (typeof v === 'number' && v > 20000 && v < 80000) { const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 864e5); return ymd(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate()); }
  const s = String(v).trim(); let m;
  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return ymd(m[1], m[2], m[3]);
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/))) return ymd(m[3], m[2], m[1]); // يوم/شهر/سنة كما في ساب السعودية
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))) return ymd(m[1], m[2], m[3]);
  return null;
}

const cellText = (v) => (v instanceof Date ? toISODate(v) : String(v ?? '').trim());

function detectHeaderRow(rows) {
  const counts = rows.slice(0, 30).map((r) => r.filter((c) => cellText(c)).length);
  const max = Math.max(0, ...counts);
  const i = counts.findIndex((c) => c >= Math.max(2, max * 0.6));
  return i < 0 ? 1 : i + 1;
}

function rcHeaders() {
  const rows = RC.sheets?.[RC.sheetName] || [];
  const h = rows[RC.headerRow - 1] || [];
  const width = Math.max(h.length, ...rows.slice(RC.headerRow, RC.headerRow + 50).map((r) => r.length));
  return Array.from({ length: width }, (_, i) => cellText(h[i]) || `${t('rc_column')} ${i + 1}`);
}

function rcGuessMapping(mode, headers) {
  let saved = {}; try { saved = JSON.parse(localStorage.getItem('fleet_rc_map_' + mode) || '{}'); } catch {}
  const map = {}, used = new Set();
  for (const [f] of RC_FIELDS[mode]) {
    if (saved[f] && headers.includes(saved[f])) { map[f] = headers.indexOf(saved[f]); used.add(map[f]); continue; }
    const syn = RC_GUESS[f === 'key' ? 'key_' + mode : f] || [];
    const idx = headers.findIndex((h, i) => !used.has(i) && syn.some((s) => h.toLowerCase().includes(s)));
    map[f] = idx; if (idx >= 0) used.add(idx);
  }
  return map;
}

async function rcRun(mode, headers, dataRows) {
  const map = {};
  $$('.rc-col').forEach((s) => (map[s.dataset.f] = +s.value));
  if (map.key < 0) return toast(t('rc_need_key'), 'err');
  const saved = {}; Object.entries(map).forEach(([f, i]) => i >= 0 && (saved[f] = headers[i]));
  try { localStorage.setItem('fleet_rc_map_' + mode, JSON.stringify(saved)); } catch {}
  const firstData = RC.headerRow + 1;
  const allRows = RC.sheets[RC.sheetName].slice(RC.headerRow);
  const rows = [];
  allRows.forEach((r, i) => {
    if (!r.some((c) => cellText(c))) return;
    const get = (f) => (map[f] >= 0 ? r[map[f]] : '');
    rows.push({ row: firstData + i, key: cellText(get('key')), date: toISODate(get('date')), customer: cellText(get('customer')), vendor: cellText(get('vendor')), doc: cellText(get('doc')), qty: cellText(get('qty')) });
  });
  const btn = $('#rc-run'); btn.disabled = true;
  $('#rc-result').innerHTML = loading();
  try {
    const r = await API.post('/reconcile', { mode, rows, from: $('#rc-from').value, to: $('#rc-to').value, tolerance_days: +$('#rc-tol').value, file_name: RC.fileName });
    RC.result = r; RC.filter = 'issues';
    rcRenderResult(); rcLoadHistory();
    $('#rc-result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) { $('#rc-result').innerHTML = errorBox(e.message); }
  btn.disabled = false;
}

function rcExport() {
  const R = RC.result;
  const head = ['Result', R.mode === 'vin' ? 'VIN' : 'Key', 'FileRow', 'SAP_Date', 'SAP_Customer', 'SAP_Vendor', 'SAP_Qty', 'SAP_Doc',
    'Sys_RefNo', 'Sys_TripDate', 'Sys_Driver', 'Sys_VendorCode', 'Sys_Client', 'Sys_CustomerCode', 'Sys_Qty', 'Sys_SAPDoc', 'Differences'];
  const e = (v) => { const s = v === null || v === undefined ? '' : String(v); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = R.items.map((i) => [t('rc_s_' + i.status), i.key, i.row, i.sap?.date, i.sap?.customer, i.sap?.vendor, i.sap?.qty, i.sap?.doc,

    i.diffs.map((d) => `${t('rc_f_' + d.field)}: SAP=${d.sap} / SYS=${d.sys}`).join(' | ')].map(e).join(','));
  const blob = new Blob(['\uFEFF' + [head.join(','), ...lines].join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `Reconciliation_${R.mode}_${R.from}_${R.to}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = `pointer-events-auto mx-4 rounded-lg px-4 py-3 text-sm shadow-lg ${type === 'err' ? 'bg-rose-700 text-white' : 'bg-ink text-white'}`;
  el.textContent = msg;
  $('#toast').replaceChildren(el);
  setTimeout(() => el.remove(), 3500);
}

function setTitle(text) { const h = $('#page-title'); if (h) h.textContent = text; document.title = text + ' · ' + t('app_name'); }

function fieldHtml(f, value) {
  const v = value ?? f.default ?? '';
  const req = f.required ? 'required' : '';
  const label = `<label class="label" for="f-${f.name}">${esc(t(f.label || f.name))}${f.required ? ' <span class="text-rose-500">*</span>' : ''}</label>`;
  const wrap = (inner) => `<div class="${f.full ? 'sm:col-span-2' : ''}">${label}${inner}</div>`;
  if (f.type === 'select')
    return wrap(`<select id="f-${f.name}" name="${f.name}" class="input" ${req}>${f.options.map((o) => `<option value="${esc(o.value)}" ${String(o.value) === String(v) ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`);
  if (f.type === 'textarea') return wrap(`<textarea id="f-${f.name}" name="${f.name}" rows="3" class="input" ${req}>${esc(v)}</textarea>`);
  return wrap(`<input id="f-${f.name}" name="${f.name}" type="${f.type || 'text'}" class="input" value="${esc(v)}" ${req} ${f.attrs || ''}>`);
}

function openModal(title, bodyHtml, onSubmit, submitLabel) {
  const root = $('#modal-root');
  root.innerHTML = `
  <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-ink/50 sm:p-4" data-backdrop>
    <div class="bg-white w-full sm:max-w-2xl rounded-t-2xl sm:rounded-2xl shadow-2xl max-h-[92vh] flex flex-col" role="dialog" aria-modal="true">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-200">
        <h3 class="font-semibold text-lg">${esc(title)}</h3>
        <button type="button" class="p-1 text-slate-400 hover:text-ink" data-close aria-label="${t('close')}">${icon('x')}</button>
      </div>
      <form id="modal-form" class="p-5 overflow-y-auto" novalidate>
        <div class="grid sm:grid-cols-2 gap-4">${bodyHtml}</div>
        <div class="flex gap-2 pt-6 pb-[env(safe-area-inset-bottom)]">
          <button class="btn btn-primary flex-1 sm:flex-none" type="submit">${esc(submitLabel || t('save'))}</button>
          <button type="button" class="btn btn-ghost" data-close>${t('cancel')}</button>
        </div>
      </form>
    </div>
  </div>`;
  const close = () => (root.innerHTML = '');
  $$('[data-close]', root).forEach((b) => (b.onclick = close));
  $('[data-backdrop]', root).onclick = (e) => { if (e.target.dataset.backdrop !== undefined) close(); };
  const form = $('#modal-form');
  form.onsubmit = async (e) => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    const btn = form.querySelector('[type=submit]'); btn.disabled = true;
    try { await onSubmit(Object.fromEntries(new FormData(form)), form); close(); }
    catch (err) { toast(err.message, 'err'); btn.disabled = false; }
  };
  setTimeout(() => form.querySelector('input,select,textarea')?.focus(), 50);
}

async function pageDashboard(view, m, qs) {
  setTitle(t('nav_dashboard'));
  const month = qs.get('month') || thisMonth();
  const d = await API.get('/dashboard?month=' + month);
  const k = d.kpis, R = d.rules;
  const rate = k.inspected ? (k.damaged / k.inspected) * 100 : null;
  const kpi = (label, value, sub, accent = '') => `
    <div class="card p-4 md:p-5 ${accent}">
      <div class="text-sm text-slate-500 mb-2">${label}</div>
      <div class="text-2xl md:text-3xl font-semibold tabular-nums">${value}</div>
      ${sub ? `<div class="text-xs text-slate-500 mt-1">${sub}</div>` : ''}
    </div>`;
  const incBadge = (r) => ({
    eligible: `<span class="badge bg-road-500 text-white">${t('inc_eligible')} · ${num(r.incentive_amount)} ${t('sar')}</span>`,
    not_eligible: `<span class="badge bg-rose-50 text-rose-700 ring-1 ring-rose-200">${t('inc_not_eligible')}</span>`,
    incomplete: `<span class="badge bg-amber-50 text-amber-800 ring-1 ring-amber-200">${t('inc_incomplete')} (${r.month_pending})</span>`,
    insufficient: `<span class="badge bg-slate-100 text-slate-600">${t('inc_insufficient')}</span>`,
  }[r.incentive]);
  const rateBar = (r) => {
    if (r.damage_rate === null) return '<span class="text-slate-400">—</span>';
    const good = r.damage_rate <= R.max_rate;
    const w = Math.min(100, (r.damage_rate / Math.max(R.max_rate * 2, 1)) * 100);
    return `<div class="flex items-center gap-2 min-w-[120px]"><span class="tabular-nums font-medium w-12 ${good ? 'text-road-700' : 'text-rose-700'}">${r.damage_rate}%</span>
      <div class="relative h-1.5 flex-1 rounded-full bg-slate-100"><div class="absolute inset-y-0 start-0 rounded-full ${good ? 'bg-road-500' : 'bg-rose-500'}" style="width:${w}%"></div><div class="absolute -top-1 -bottom-1 w-px bg-ink/40" style="inset-inline-start:50%"></div></div></div>`;
  };

  view.innerHTML = `
  <div class="flex flex-wrap items-end gap-3 mb-5">
    <div><label class="label" for="month">${t('month')}</label><input type="month" id="month" class="input w-44" value="${month}"></div>
    ${can('admin', 'supervisor') ? `<button type="button" class="btn btn-ghost" onclick="exportCsv('incentives','${month}')">${icon('download', 'w-4 h-4')} ${t('export_incentives')}</button>` : ''}
  </div>
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-6">
    ${kpi(t('kpi_trips'), num(k.trips))}
    ${kpi(t('kpi_vehicles'), num(k.vehicles), `${t('kpi_inspected')}: ${num(k.inspected)}`)}
    ${kpi(t('kpi_damage_rate'), rate === null ? '—' : rate.toFixed(1) + '%', `${num(k.damaged)} ${t('kpi_damaged_cars')}`, rate !== null && rate > R.max_rate ? 'border-rose-300' : '')}
    ${kpi(t('kpi_active'), num(k.in_transit), `${t('status_pending')}: ${num(k.pending)}`, 'bg-signal/10 border-signal/40')}
  </div>
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-6">
    <a href="#/shipments?permit=missing" class="block">${kpi(t('kpi_no_permit'), num(k.no_permit), t('permit_hint_short'), k.no_permit ? 'border-rose-300 bg-rose-50/40' : '')}</a>
    <a href="#/expiry" class="block">${kpi(t('kpi_expiry'), num(k.expiry_alerts), t('kpi_expiry_sub'), k.expiry_alerts ? 'border-rose-300 bg-rose-50/40' : '')}</a>
    ${can('admin', 'supervisor') ? `<a href="#/billing" class="block">${kpi(t('kpi_revenue'), money(k.revenue), `${t('total_cost')}: ${money(k.costs)}`)}</a>
    ${kpi(t('margin'), money(k.margin), `${t('kpi_international')}: ${num(k.international)}`, k.margin < 0 ? 'border-rose-300' : '')}` : ''}
  </div>

  <section class="card mb-6 overflow-hidden">
    <div class="p-4 md:p-5 border-b border-slate-200 flex flex-wrap gap-2 items-baseline justify-between">
      <h2 class="font-semibold">${t('drivers_report')}</h2>
      <p class="text-xs text-slate-500">${t('incentive_rule').replace('{rate}', R.max_rate).replace('{min}', R.min_vehicles).replace('{amount}', num(R.amount))}</p>
    </div>
    ${d.drivers.length ? `<div class="overflow-x-auto"><table class="w-full">
      <thead><tr>
        <th class="th">${t('driver')}</th><th class="th">${t('total_trips')}</th><th class="th">${t('total_vehicles')}</th>
        <th class="th">${t('month_trips')}</th><th class="th">${t('month_vehicles')}</th><th class="th">${t('damaged')}</th>
        <th class="th">${t('damage_rate_month')}</th><th class="th">${t('incentive')}</th>
      </tr></thead>
      <tbody>${d.drivers.map((r) => `<tr class="hover:bg-slate-50">
        <td class="td"><div class="font-medium">${esc(r.name)}</div><div class="text-xs text-slate-500">${val(r.truck_plate)}</div></td>
        <td class="td tabular-nums">${num(r.total_trips)}</td><td class="td tabular-nums">${num(r.total_vehicles)}</td>
        <td class="td tabular-nums">${num(r.month_trips)}</td><td class="td tabular-nums">${num(r.month_vehicles)}</td>
        <td class="td tabular-nums ${r.month_damaged ? 'text-rose-700 font-medium' : ''}">${num(r.month_damaged)}</td>
        <td class="td">${rateBar(r)}</td><td class="td">${incBadge(r)}</td></tr>`).join('')}</tbody>
    </table></div>` : `<div class="p-8 text-center text-slate-500">${t('no_drivers')} <a class="text-road-600 underline" href="#/drivers">${t('add_driver')}</a></div>`}
  </section>

  <section class="card overflow-hidden">
    <div class="p-4 md:p-5 border-b border-slate-200"><h2 class="font-semibold">${t('recent_damage')}</h2></div>
    ${d.recentDamage.length ? `<ul class="divide-y divide-slate-100">${d.recentDamage.map((v) => `
      <li class="p-4 md:px-5 flex flex-wrap items-center gap-x-4 gap-y-1">
        <a href="#/search?vin=${esc(v.vin)}" class="vin text-sm font-semibold text-road-700 hover:underline" dir="ltr">${esc(v.vin)}</a>
        ${condBadge(v.condition)}
        <span class="text-sm text-slate-600">${esc(v.driver_name)}</span>
        <a href="#/shipments/${v.shipment_id}" class="text-sm text-slate-500 hover:underline">${esc(v.ref_no)}</a>
        ${v.condition_notes ? `<span class="text-sm text-slate-500 basis-full">${esc(v.condition_notes)}</span>` : ''}
      </li>`).join('')}</ul>` : `<div class="p-8 text-center text-slate-500">${t('no_damage')}</div>`}
  </section>`;
  $('#month').onchange = (e) => (location.hash = '#/dashboard?month=' + e.target.value);
}

async function pageSearch(view, m, qs) {
  setTitle(t('nav_search'));
  const initial = qs.get('vin') || '';
  view.innerHTML = `
  <div class="max-w-3xl mx-auto">
    <div class="mb-6">
      <label class="block text-sm font-medium text-slate-600 mb-2" for="vin-q">${t('search_vin_label')}</label>
      <div class="vin-plate flex items-center gap-3 px-4 py-3 md:py-4">
        <span class="text-slate-400">${icon('search', 'w-6 h-6')}</span>
        <input id="vin-q" class="vin w-full bg-transparent text-xl md:text-2xl font-semibold uppercase outline-none placeholder:text-slate-300 placeholder:font-normal" dir="ltr"
          placeholder="${t('search_vin_ph')}" value="${esc(initial)}" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="20">
        <span id="vin-len" class="vin text-xs text-slate-400 tabular-nums" dir="ltr">0/17</span>
      </div>
      <p class="text-xs text-slate-500 mt-2">${t('search_hint')}</p>
    </div>
    <div id="results"></div>
  </div>`;
  const inp = $('#vin-q'); let timer, seq = 0;
  const run = async () => {
    const q = normVin(inp.value), box = $('#results'), my = ++seq;
    $('#vin-len').textContent = `${q.length}/17`;
    if (q.length < 4) { box.innerHTML = ''; return; }
    box.innerHTML = loading();
    try {
      const r = await API.get('/vehicles/search?q=' + encodeURIComponent(q));
      if (my === seq) box.innerHTML = renderSearchResults(r.results, q);
    } catch (e) { if (my === seq) box.innerHTML = errorBox(e.message); }
  };
  inp.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 250); });
  inp.focus();
  if (initial) run();
}

function renderSearchResults(list, q) {
  if (!list.length) return emptyBox(t('no_results'));
  const groups = new Map();
  list.forEach((r) => { if (!groups.has(r.vin)) groups.set(r.vin, []); groups.get(r.vin).push(r); });
  const dl = (label, value) => `<div><dt class="text-xs text-slate-500">${label}</dt><dd class="text-sm font-medium mt-0.5">${value}</dd></div>`;
  return [...groups].map(([vin, recs]) => {
    const latest = recs[0];
    const hl = esc(vin).replace(q, `<mark class="bg-signal/40 text-ink rounded-sm">${q}</mark>`);
    return `
    <article class="card mb-5 overflow-hidden">
      <header class="p-4 md:p-5 border-b border-slate-200 flex flex-wrap items-center gap-3">
        <div class="vin text-lg md:text-xl font-semibold" dir="ltr">${hl}</div>
        ${condBadge(latest.condition)}
        <span class="text-sm text-slate-500 ms-auto">${t('trips_for_vin').replace('{n}', recs.length)}</span>
      </header>
      <ol class="relative">
        ${recs.map((r, i) => `
        <li class="p-4 md:p-5 ${i ? 'border-t border-slate-100' : ''}">
          <div class="flex flex-wrap items-center gap-2 mb-3">
            <a href="#/shipments/${r.shipment_id}" class="font-semibold text-road-700 hover:underline">${esc(r.ref_no)}</a>
            ${statusBadge(r.status)}
            <span class="text-sm text-slate-500">${esc(r.trip_date)}</span>
          </div>
          <div class="text-base mb-4">${routeS(r)} ${permitBadge(r)}</div>
          <dl class="grid grid-cols-2 sm:grid-cols-3 gap-x-4 gap-y-3 mb-4">
            ${dl(t('driver'), esc(r.driver_name) + (r.driver_phone ? `<div class="text-xs text-slate-500 font-normal" dir="ltr">${esc(r.driver_phone)}</div>` : ''))}
            ${dl(t('truck_plate'), val(r.truck_plate))}
            ${dl(t('client'), val(r.client_name))}
            ${dl(t('model'), val(r.model || r.vehicle_type))}
            ${dl(t('departure_at'), dt(r.departure_at))}
            ${dl(t('arrival_at'), dt(r.arrival_at))}
          </dl>
          <div class="rounded-lg bg-slate-50 p-3">
            <div class="flex flex-wrap items-center gap-2"><span class="text-sm text-slate-600">${t('condition')}:</span>${condBadge(r.condition)}
              ${r.inspected_at ? `<span class="text-xs text-slate-500">${dt(r.inspected_at)} · ${val(r.inspected_by_name)}</span>` : ''}</div>
            ${r.condition_notes ? `<p class="text-sm mt-2">${esc(r.condition_notes)}</p>` : ''}
            ${r.log.length > 1 ? `<details class="mt-2"><summary class="text-xs text-road-700 cursor-pointer">${t('condition_history')} (${r.log.length})</summary>
              <ul class="mt-2 space-y-1 text-xs text-slate-600">${r.log.map((l) => `<li>${dt(l.created_at)} · ${val(l.user_name)}: ${t('cond_' + l.old_condition)} <span class="inline-block rtl:rotate-180">→</span> ${t('cond_' + l.new_condition)}${l.notes ? ' — ' + esc(l.notes) : ''}</li>`).join('')}</ul></details>` : ''}
          </div>
        </li>`).join('')}
      </ol>
    </article>`;
  }).join('');
}

      </div>
      <div class="grid md:grid-cols-2 gap-4 mb-5 p-4 rounded-lg bg-slate-50">
        <div>
          <label class="label" for="bulk">${t('paste_vins')}</label>
          <textarea id="bulk" rows="3" class="input vin text-sm" dir="ltr" placeholder="JTDKB20U793456789&#10;KMHCT41DAEU123456"></textarea>
          <button type="button" id="bulk-add" class="btn btn-ghost mt-2">${t('add_from_list')}</button>
        </div>
        <div>
          <label class="label" for="n-rows">${t('add_rows')}</label>
          <div class="flex gap-2"><input id="n-rows" type="number" min="1" max="60" value="1" class="input w-24"><button type="button" id="rows-add" class="btn btn-ghost">${t('add')}</button></div>
          <p class="text-xs text-slate-500 mt-3 leading-relaxed">${t('vin_rule')}</p>
        </div>
      </div>
      <div id="v-rows" class="space-y-2"></div>
    </section>

    <div class="flex gap-2 sticky bottom-20 md:bottom-4 z-20">
      <button class="btn btn-primary btn-lg shadow-lg" type="submit">${icon('check')} ${t('save_shipment')}</button>
      <a href="#/shipments" class="btn btn-ghost btn-lg">${t('cancel')}</a>
    </div>
  </form>`;

  const fillCities = (sel, dl) => ($('#' + dl).innerHTML = citiesOf($('#' + sel).value).map((c) => `<option value="${esc(c)}">`).join(''));
  $('#oc').onchange = () => fillCities('oc', 'cities-o'); $('#dc').onchange = () => fillCities('dc', 'cities-d');
  fillCities('oc', 'cities-o'); fillCities('dc', 'cities-d');
  /* اختيار السائق يقترح شاحنته المسجلة */
  $('select[name=driver_id]').addEventListener('change', (e) => { const d = drivers.find((x) => x.id === e.target.value), tr = d && trucks.find((x) => x.plate === d.truck_plate);
    if (tr && !$('#truck-sel').value) $('#truck-sel').value = tr.id; });
  const rowsBox = $('#v-rows');
  const addRow = (vin = '') => {
    const div = document.createElement('div');
    div.className = 'v-row grid grid-cols-12 gap-2 items-center';
    div.innerHTML = `
      <span class="v-idx col-span-1 text-xs text-slate-400 text-center tabular-nums"></span>
      <input class="input v-vin vin col-span-11 sm:col-span-5 uppercase" dir="ltr" maxlength="20" placeholder="${t('vin_17')}" value="${esc(vin)}" autocapitalize="characters" spellcheck="false">
      <input class="input v-model col-span-6 sm:col-span-3" placeholder="${t('model_optional')}">
      <input class="input v-color col-span-5 sm:col-span-2" placeholder="${t('color')}">
      <button type="button" class="v-del col-span-1 flex justify-center text-slate-400 hover:text-rose-600" aria-label="${t('delete')}">${icon('x')}</button>`;
    div.querySelector('.v-del').onclick = () => { div.remove(); update(); };
    div.querySelector('.v-vin').oninput = update;
    rowsBox.appendChild(div);
  };
  const update = () => {
    const rows = $$('.v-row', rowsBox); const counts = {};
    rows.forEach((r) => { const v = normVin($('.v-vin', r).value); if (v) counts[v] = (counts[v] || 0) + 1; });
    let filled = 0, valid = 0;
    rows.forEach((r, i) => {
      $('.v-idx', r).textContent = i + 1;
      const inp = $('.v-vin', r), v = normVin(inp.value);
      inp.classList.remove('border-road-500', 'border-rose-400', 'bg-rose-50');
      if (!v) return;
      filled++;
      if (VIN_RE.test(v) && counts[v] === 1) { valid++; inp.classList.add('border-road-500'); }
      else inp.classList.add('border-rose-400', 'bg-rose-50');
    });
    $('#v-count').textContent = filled; $('#v-valid').textContent = valid;
  };
  $('#rows-add').onclick = () => { const n = Math.min(60, Math.max(1, +$('#n-rows').value || 1)); for (let i = 0; i < n; i++) addRow(); update(); };
  $('#bulk-add').onclick = () => {
    const vins = $('#bulk').value.split(/[\s,;]+/).map(normVin).filter(Boolean);
    if (!vins.length) return;
    $$('.v-row', rowsBox).forEach((r) => { if (!normVin($('.v-vin', r).value)) r.remove(); });
    vins.forEach((v) => addRow(v)); $('#bulk').value = ''; update();
  };
  addRow(); update();

  const form = $('#ship-form');
  form.onsubmit = async (e) => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    const vehicles = $$('.v-row', rowsBox).map((r) => ({ vin: normVin($('.v-vin', r).value), model: $('.v-model', r).value.trim(), color: $('.v-color', r).value.trim() })).filter((v) => v.vin);
    if (!vehicles.length) return toast(t('err_no_vehicles'), 'err');
    const bad = vehicles.filter((v) => !VIN_RE.test(v.vin));
    if (bad.length) return toast(t('err_vin_invalid') + ': ' + bad.map((v) => v.vin).join(', '), 'err');
    const payload = { ...Object.fromEntries(new FormData(form)), vehicles };
    const btn = form.querySelector('[type=submit]'); btn.disabled = true;
    try {
      let r;
      try { r = await API.post('/shipments', payload); }
      catch (err) {
        if (err.code !== 'vin_active') throw err;
        const list = err.data.conflicts.map((c) => `${c.vin} (${c.ref_no})`).join('\n');
        if (!confirm(t('confirm_active_vins') + '\n\n' + list)) { btn.disabled = false; return; }
        r = await API.post('/shipments', { ...payload, force: true });
      }
      toast(t('shipment_saved')); location.hash = '#/shipments/' + r.id;
    } catch (err) {
      const extra = err.data?.vins ? ': ' + err.data.vins.join(', ') : '';
      toast(err.message + extra, 'err'); btn.disabled = false;
    }
  };
}

      ${can('admin', 'supervisor') ? `<div><dt class="text-xs text-slate-500">${t('total_cost')}</dt><dd class="font-semibold mt-0.5 tabular-nums">${money(s.total_cost)}</dd></div>
      <div><dt class="text-xs text-slate-500">${t('margin')}</dt><dd class="font-semibold mt-0.5 tabular-nums ${s.margin < 0 ? 'text-rose-700' : ''}">${money(s.margin)}</dd></div>` : ''}

          <span class="text-xs text-slate-400 tabular-nums w-5">${i + 1}</span>
          <a href="#/search?vin=${esc(v.vin)}" class="vin font-semibold text-road-700 hover:underline" dir="ltr">${esc(v.vin)}</a>

      <input id="add-vin" class="input vin uppercase flex-1 min-w-[220px]" dir="ltr" maxlength="20" placeholder="${t('vin_17')}">

  const reload = async () => { const y = scrollY; await pageShipment(view, m); scrollTo(0, y); };
  const act = async (fn, msg) => { try { await fn(); if (msg) toast(msg); await reload(); } catch (e) { toast(e.message, 'err'); } };

  $$('[data-status]').forEach((b) => (b.onclick = () => {
    if (b.dataset.status === 'cancelled' && !confirm(t('confirm_cancel'))) return;
    if (b.dataset.status === 'delivered' && counts.pending && !confirm(t('confirm_deliver_pending').replace('{n}', counts.pending))) return;
    act(() => API.put('/shipments/' + id, { status: b.dataset.status }), t('saved'));
  }));
  $('#sap-save').onclick = () => act(() => API.put('/shipments/' + id, { sap_document_no: $('#sap-no').value }), t('saved'));
  $('#permit-save') && ($('#permit-save').onclick = () => {
    const no = $('#permit-no').value.trim();
    if (!no && !s.permit_no) return toast(t('permit_need_ref'), 'err');
    act(() => API.put('/shipments/' + id, { permit_no: no, permit_date: $('#permit-date').value }), t('saved'));
  });
  $('#cost-add').onclick = () => {
    const amount = +$('#cost-amount').value;
    if (!(amount > 0)) return toast(t('err_required_fields'), 'err');

  $$('[data-cid]').forEach((tr) => {

  });
  $('#freight-save') && ($('#freight-save').onclick = () => act(() => API.put('/shipments/' + id, { freight: $('#freight').value }), t('saved')));
  $('#del-ship') && ($('#del-ship').onclick = async () => {
    if (!confirm(t('confirm_delete_shipment'))) return;
    try { await API.del('/shipments/' + id); toast(t('deleted')); location.hash = '#/shipments'; } catch (e) { toast(e.message, 'err'); }
  });
  $('#mark-ok') && ($('#mark-ok').onclick = () => act(() => API.post(`/shipments/${id}/mark-ok`), t('saved')));

  $$('[data-vid]').forEach((li) => {
    const vid = li.dataset.vid;
    const v = s.vehicles.find((x) => String(x.id) === vid);
    $$('[data-cond]', li).forEach((b) => (b.onclick = () =>
      act(() => API.patch(`/shipments/${id}/vehicles/${vid}/condition`, { condition: b.dataset.cond, notes: $('.v-notes', li).value }))));
    /* حفظ الملاحظة دون إعادة رسم الصفحة، كي لا يضيع نقر زر الحالة الذي يلي الكتابة مباشرة */
    $('.v-notes', li).onchange = (e) => API.patch(`/shipments/${id}/vehicles/${vid}/condition`, { condition: cond(S.shipments[id].vehicles[vid]), notes: e.target.value })
      .then(() => toast(t('saved'))).catch((err) => toast(err.message, 'err'));
    const rm = $('.v-remove', li);
    if (rm) rm.onclick = () => confirm(t('confirm_remove_vehicle')) && act(() => API.del(`/shipments/${id}/vehicles/${vid}`), t('deleted'));
  });

  const addBtn = $('#add-vin-btn');
  if (addBtn) {
    const add = async () => {
      const vin = normVin($('#add-vin').value);
      if (!VIN_RE.test(vin)) return toast(t('err_vin_invalid'), 'err');
      try { await API.post(`/shipments/${id}/vehicles`, { vin }); }
      catch (e) {
        if (e.code !== 'vin_active') return toast(e.message + (e.data?.vins ? ': ' + e.data.vins.join(', ') : ''), 'err');
        if (!confirm(t('confirm_active_vins') + '\n\n' + e.data.conflicts.map((c) => `${c.vin} (${c.ref_no})`).join('\n'))) return;
        try { await API.post(`/shipments/${id}/vehicles`, { vin, force: true }); } catch (e2) { return toast(e2.message, 'err'); }
      }
      toast(t('saved')); reload();
    };
    addBtn.onclick = add;
    $('#add-vin').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); add(); } };
  }
}

/* ---------- صفحات البيانات الأساسية (سائقون / عملاء / مستخدمون) ---------- */
function crudPage(cfg) {
  return async (view) => {
    setTitle(t(cfg.title));
    const rows = await API.get(cfg.endpoint + '?all=1');

    view.innerHTML = `
    <div class="flex flex-wrap gap-3 items-center mb-5">
      <input id="c-q" class="input max-w-xs" placeholder="${t('search')}">
      <div class="flex-1"></div>

    </div>
    <div class="card overflow-x-auto"><table class="w-full">
      <thead><tr>${cfg.columns.map((c) => `<th class="th">${t(c.label || c.name)}</th>`).join('')}<th class="th">${t('status')}</th>${writable ? '<th class="th"></th>' : ''}</tr></thead>
      <tbody id="c-body"></tbody></table></div>`;

      const q = $('#c-q').value.trim().toLowerCase();

        ${cfg.columns.map((c) => `<td class="td ${c.cls || ''}" ${c.ltr ? 'dir="ltr"' : ''}>${c.render ? c.render(r) : val(r[c.name])}</td>`).join('')}
        <td class="td">${r.active ? `<span class="badge bg-road-50 text-road-700">${t('active')}</span>` : `<span class="badge bg-slate-100 text-slate-500">${t('inactive')}</span>`}</td>
        ${writable ? `<td class="td text-end"><button class="text-road-700 hover:underline text-sm" data-edit="${r.id}">${t('edit')}</button></td>` : ''}</tr>`).join('')
        : `<tr><td class="td text-center text-slate-500 py-10" colspan="${cfg.columns.length + 2}">${t('no_records')}</td></tr>`;
      $$('[data-edit]').forEach((b) => (b.onclick = () => form(rows.find((r) => String(r.id) === b.dataset.edit))));
    };
    const form = (row) => {
      const fields = [...cfg.fields(row)];
      if (row) fields.push({ name: 'active', label: 'status', type: 'select', options: [{ value: 1, label: t('active') }, { value: 0, label: t('inactive') }] });
      openModal(t(row ? 'edit' : cfg.addLabel), fields.map((f) => fieldHtml(f, row ? row[f.name] : undefined)).join(''), async (data) => {
        if (row && 'password' in data && !data.password) delete data.password;
        row ? await API.put(`${cfg.endpoint}/${row.id}`, data) : await API.post(cfg.endpoint, data);
        toast(t('saved')); router();
      });
    };
    $('#c-q').oninput = draw;
    if (writable) $('#c-add').onclick = () => form(null);
    draw();
  };
}

  if (!w) return;
  const submit = (id, kind) => ($('#' + id).onsubmit = async (e) => { e.preventDefault();
    try { await API.post('/places/' + kind, Object.fromEntries(new FormData(e.target))); toast(t('saved')); router(true); } catch (err) { toast(err.message, 'err'); } });
  submit('add-country', 'countries'); submit('add-city', 'cities');
  $$('[data-del]').forEach((b) => (b.onclick = async () => { if (!confirm(t('confirm_delete_place'))) return;
    try { await API.del('/places/' + b.dataset.del); toast(t('deleted')); router(true); } catch (err) { toast(err.message, 'err'); } }));
}

/* ---------- الموجّه ---------- */
const ROUTES = [
  [/^#\/dashboard$/, pageDashboard],
  [/^#\/search$/, pageSearch],
  [/^#\/shipments$/, pageShipments],
  [/^#\/shipments\/new$/, pageNewShipment],
  [/^#\/shipments\/([\w-]+)$/, pageShipment],
  [/^#\/reconcile$/, pageReconcile, ['admin', 'supervisor']],
  [/^#\/drivers$/, pageDrivers],
  [/^#\/trucks$/, pageTrucks],
  [/^#\/expiry$/, pageExpiry],
  [/^#\/billing$/, pageBilling, ['admin', 'supervisor']],
  [/^#\/places$/, pagePlaces],
  [/^#\/clients$/, pageClients],
  [/^#\/users$/, pageUsers, ['admin']],
  [/^#\/settings$/, pageSettings],
];

async function router(keepScroll) {
  setLang(LANG);
  if (!keepScroll) $('#modal-root').innerHTML = '';
  const hash = location.hash || '#/dashboard';
  if (!window.ME) return renderLogin();
  if (hash === '#/login') { location.hash = '#/dashboard'; return; }
  window.SETTINGS = settings();
  const [path, qs] = hash.split('?');
  const y = scrollY;
  for (const [re, fn, roles] of ROUTES) {
    const m = path.match(re);
    if (!m) continue;
    if (roles && !can(...roles)) { location.hash = '#/dashboard'; return; }
    renderShell(path);
    const view = $('#view');
    view.innerHTML = loading();
    try { await fn(view, m, new URLSearchParams(qs || '')); }
    catch (e) { view.innerHTML = errorBox(e.message); }
    window.scrollTo(0, keepScroll ? y : 0);
    return;
  }
  location.hash = '#/dashboard';
}

window.addEventListener('hashchange', () => router());
/* الإقلاع: جلسة Firebase المحفوظة (مشتركة مع نظام التوريد على نفس الرابط) تُدخِل مباشرة */
$('#app').innerHTML = loading();
const offBoot = firebase.auth().onAuthStateChanged(async (fu) => {
  offBoot();
  if (!fu) { cacheClear(); return renderLogin(); }
  try { await resolveMe(fu); router(); }
  catch (e) { renderLogin(); if (e.code !== 'not_member') toast(e.message, 'err'); }
});
</script>
