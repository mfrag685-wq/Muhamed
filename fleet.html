/* إثبات التسليم: اسم المستلم، الوقت، حرارة الاستلام، النواقص/التلف، وتوقيع على الشاشة */
function openPod(s, st, done) {
  openModal(t('record_pod') + ' — ' + st.city,
    fieldHtml({ name: 'status', label: 'pod_result', type: 'select', options: [{ value: 'delivered', label: t('stop_delivered') }, { value: 'failed', label: t('stop_failed') }] }, 'delivered')
    + fieldHtml({ name: 'name', label: 'pod_receiver' }, st.receiver || '')
    + fieldHtml({ name: 'at', label: 'reading_time', type: 'datetime-local' }, nowLocal())
    + (isTempControlled(s) ? fieldHtml({ name: 'temp', label: 'pod_temp', type: 'number', attrs: 'step="0.1" dir="ltr"' }) : '')
    + fieldHtml({ name: 'short', label: 'pod_short', full: true })
    + fieldHtml({ name: 'notes', full: true })
    + `<div class="sm:col-span-2"><div class="flex items-center justify-between mb-1.5"><label class="label mb-0">${t('signature')}</label><button type="button" id="sig-clear" class="text-sm text-road-700 hover:underline">${t('clear')}</button></div>
      <canvas id="sig" width="600" height="180" class="w-full h-36 rounded-lg border border-slate-300 bg-white touch-none"></canvas></div>`,
    async (data) => {
      await API.post(`/shipments/${s.id}/stops/${st.id}/pod`, { ...data, sig: drawn ? $('#sig').toDataURL('image/png') : null });
      toast(t('saved')); await done();
    }, t('save'));
  const c = $('#sig'), ctx = c.getContext('2d'); let drawing = false, drawn = false;
  ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#15201B';
  const pos = (e) => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * (c.width / r.width), (e.clientY - r.top) * (c.height / r.height)]; };
  c.onpointerdown = (e) => { drawing = true; drawn = true; c.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); };
  c.onpointermove = (e) => { if (!drawing) return; const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); };
  c.onpointerup = () => (drawing = false);
  $('#sig-clear').onclick = () => { ctx.clearRect(0, 0, c.width, c.height); drawn = false; };
}

/* استيراد قراءات جهاز تسجيل الحرارة (Data Logger) من ملف Excel/CSV */
function toISODateTime(v, timeCell) {
  const pad = (n) => String(n).padStart(2, '0');
  let d = null, h = 0, mi = 0;
  if (v instanceof Date && !isNaN(v)) { const x = new Date(v.getTime() + 30000); return `${x.getFullYear()}-${pad(x.getMonth() + 1)}-${pad(x.getDate())} ${pad(x.getHours())}:${pad(x.getMinutes())}`; }
  if (typeof v === 'number' && v > 20000 && v < 80000) { const x = new Date(Date.UTC(1899, 11, 30) + Math.round(v * 864e5)); return `${x.getUTCFullYear()}-${pad(x.getUTCMonth() + 1)}-${pad(x.getUTCDate())} ${pad(x.getUTCHours())}:${pad(x.getUTCMinutes())}`; }
  const str = String(v ?? '').trim(); let m;
  if ((m = str.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) d = `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  else if ((m = str.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/))) d = `${m[3]}-${pad(m[2])}-${pad(m[1])}`;
  if (!d) return null;
  const tm = (timeCell !== undefined && timeCell !== '' ? String(timeCell instanceof Date ? `${timeCell.getHours()}:${timeCell.getMinutes()}` : typeof timeCell === 'number' && timeCell < 1 ? `${Math.floor(timeCell * 24)}:${Math.round((timeCell * 1440) % 60)}` : timeCell) : str).match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM|ص|م)?/i);
  if (tm) { h = +tm[1]; mi = +tm[2]; if (/PM|م/i.test(tm[3] || '') && h < 12) h += 12; if (/AM|ص/i.test(tm[3] || '') && h === 12) h = 0; }
  return `${d} ${pad(h)}:${pad(mi)}`;
}
function openLoggerImport(id, done) {
  let sheets = null, rows = [], headers = [];
  openModal(t('import_logger'), `<div class="sm:col-span-2"><label class="label">${t('logger_file')}</label><input id="lg-file" type="file" accept=".xlsx,.xls,.csv,.txt,.tsv" class="block w-full text-sm">
    <p class="text-xs text-slate-500 mt-1">${t('logger_hint')}</p></div><div id="lg-map" class="sm:col-span-2"></div>`, async (data) => {
    if (!rows.length) throw new Error(t('rc_empty_file'));
    const ci = +$('#lg-dt').value, ti = +$('#lg-tm').value, vi = +$('#lg-val').value;
    const out = rows.map((r) => ({ at: toISODateTime(r[ci], ti >= 0 ? r[ti] : undefined), value: String(r[vi] ?? '').replace(',', '.').replace(/[^\d.\-]/g, '') })).filter((x) => x.at && x.value !== '');
    const res = await API.post(`/shipments/${id}/temps/import`, { rows: out, place: $('#lg-place').value });
    toast(t('logger_imported').replace('{n}', res.added)); await done();
  }, t('import'));
  $('#lg-file').onchange = async (e) => {
    const file = e.target.files[0]; if (!file) return;
    $('#lg-map').innerHTML = loading();
    try {
      sheets = await readSapFile(file); const name = Object.keys(sheets).find((n) => sheets[n].length); if (!name) throw new Error(t('rc_empty_file'));
      const all = sheets[name], hr = detectHeaderRow(all);
      headers = (all[hr - 1] || []).map((h, i) => cellText(h) || `${t('rc_column')} ${i + 1}`); rows = all.slice(hr).filter((r) => r.some((c) => cellText(c)));
      const guess = (keys) => headers.findIndex((h) => keys.some((k) => h.toLowerCase().includes(k)));
      const gv = guess(['temp', '°c', 'حرار', 'value', 'ch1']), gd = guess(['date', 'time', 'تاريخ', 'وقت', 'timestamp']);
      const opts = (sel, none) => (none ? `<option value="-1">${t('rc_not_in_file')}</option>` : '') + headers.map((h, i) => `<option value="${i}" ${i === sel ? 'selected' : ''}>${esc(h)}</option>`).join('');
      const gt = headers.findIndex((h, i) => i !== gd && /^(time|الوقت|وقت)$/i.test(h.trim()));
      $('#lg-map').innerHTML = `<div class="grid sm:grid-cols-2 gap-3"><div><label class="label">${t('logger_dt_col')}</label><select id="lg-dt" class="input">${opts(gd)}</select></div>
        <div><label class="label">${t('logger_time_col')}</label><select id="lg-tm" class="input">${opts(gt, true)}</select></div>
        <div><label class="label">${t('logger_val_col')}</label><select id="lg-val" class="input">${opts(gv)}</select></div>
        <div><label class="label">${t('place')}</label><input id="lg-place" class="input" value="${esc(t('logger'))}"></div></div>
        <p class="text-sm text-slate-600 mt-3">${t('rc_rows_found').replace('{n}', num(rows.length))}</p>`;
    } catch (err) { $('#lg-map').innerHTML = errorBox(err.message); }
  };
}

/* ---------- مراقبة سلسلة التبريد: كل الأوامر النشطة المبردة وآخر قراءة لكل منها ---------- */
async function pageColdChain(view) {
  setTitle(t('nav_coldchain'));
  const list = (await API.get('/shipments')).filter((s) => ['loading', 'in_transit'].includes(s.status));
  const hrs = Number(settings().temp_interval_hours || 2);
  view.innerHTML = `<p class="text-sm text-slate-600 mb-4 max-w-3xl">${t('coldchain_intro').replace('{n}', hrs)}</p>
  ${list.length ? `<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${list.map((s) => { const l = s.tsum.last, tc = isTempControlled(s), stale = tc && (!l || ageHours(l.at) > hrs), bad = l && outOfRange(Number(l.value), s.temp_min, s.temp_max);
    return `<article class="card p-4 ${bad || s.tsum.excursions ? 'border-rose-300' : stale ? 'border-amber-300' : ''}">
      <div class="flex items-center gap-2 mb-2"><a href="#/shipments/${s.id}" class="font-semibold text-road-700 hover:underline">${esc(s.ref_no)}</a>${statusBadge(s.status)}<div class="flex-1"></div>${tcBadge(s)}</div>
      <div class="text-sm mb-3">${routeS(s)} · ${val(s.client_name)}</div>
      <div class="flex items-end gap-4 mb-3"><div class="text-4xl font-semibold tabular-nums ${bad ? 'text-rose-700' : 'text-road-700'}" dir="ltr">${l ? l.value + '°' : '—'}</div>
        <div class="text-xs text-slate-500 pb-1">${l ? ageText(l.at) : t('no_readings')}${stale ? ` <span class="badge bg-amber-50 text-amber-800">⏱ ${t('stale')}</span>` : ''}</div></div>
      <div class="flex flex-wrap gap-2 text-xs text-slate-600"><span>${t('truck')}: ${val(s.truck_plate)}</span><span>${t('readings')}: ${num(s.tsum.n)}</span>${s.tsum.n ? `<span dir="ltr">${s.tsum.min}…${s.tsum.max}°C · MKT ${s.tsum.mkt}°</span>` : ''}
        ${s.tsum.excursions ? `<span class="badge bg-rose-600 text-white">⚠ ${s.tsum.excursions}</span>` : ''}<span>${t('stops')}: ${s.stops_done}/${s.stops.length}</span></div>
      ${perm('temps') && tc ? `<div class="mt-3 flex gap-2 no-print"><input type="number" step="0.1" class="input py-1.5 cc-val" dir="ltr" placeholder="°C"><button class="btn btn-primary py-1.5 cc-add" data-id="${s.id}">${t('add_reading')}</button></div>` : ''}
    </article>`; }).join('')}</div>` : emptyBox(t('no_active_cold'))}`;
  $$('.cc-add').forEach((b) => (b.onclick = async () => { const v = $('.cc-val', b.parentElement).value; if (v === '') return toast(t('err_temp_value'), 'err');
    try { await API.post(`/shipments/${b.dataset.id}/temps`, { value: v }); toast(t('saved')); router(true); } catch (e) { toast(e.message, 'err'); } }));
}

/* ---------- سجل حركة الموظفين ---------- */
const ACT_CLS = { login: 'bg-road-50 text-road-700', logout: 'bg-slate-100 text-slate-600', switch: 'bg-sky-50 text-sky-800', add: 'bg-emerald-50 text-emerald-800', edit: 'bg-amber-50 text-amber-800',
  delete: 'bg-rose-50 text-rose-700 ring-1 ring-rose-200', status: 'bg-indigo-50 text-indigo-800', pricing: 'bg-signal/20 text-ink', export: 'bg-slate-100 text-slate-700', print: 'bg-slate-100 text-slate-700' };
async function pageLog(view, m, qs) {
  setTitle(t('nav_log'));
  const multi = window.ME.systems.length > 1;
  const f = { sys: qs.get('sys') || '', from: qs.get('from') || new Date(Date.now() - 6 * 864e5).toISOString().slice(0, 10), to: qs.get('to') || today(), user: qs.get('user') || '', mod: qs.get('mod') || '', act: qs.get('act') || '', q: qs.get('q') || '' };
  let rows = await API.get('/log' + (f.sys === 'all' ? '?sys=all' : ''));
  const sel = (id, label, opts, cls = 'w-40') => `<div><label class="label" for="l-${id}">${label}</label><select id="l-${id}" class="input ${cls}"><option value="">${t('all')}</option>${opts.map(([v, l]) => `<option value="${esc(v)}" ${f[id] === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;
  const users = () => [...new Map(rows.map((r) => [r.uid, r.n || r.un])).entries()].sort((a, b) => String(a[1]).localeCompare(String(b[1]), 'ar'));
  view.innerHTML = `
  <p class="text-sm text-slate-600 mb-4 max-w-3xl">${t('log_intro')}</p>
  <div class="flex flex-wrap gap-3 items-end mb-4 no-print">
    ${multi ? `<div><label class="label" for="l-sys">${t('log_system')}</label><select id="l-sys" class="input w-44"><option value="">${tsys('sys_short', SYS)}</option><option value="all" ${f.sys === 'all' ? 'selected' : ''}>${t('log_all_systems')}</option></select></div>` : ''}
    <div><label class="label" for="l-from">${t('rc_from')}</label><input id="l-from" type="date" class="input" value="${f.from}"></div>
    <div><label class="label" for="l-to">${t('rc_to')}</label><input id="l-to" type="date" class="input" value="${f.to}"></div>
    <div id="l-user-wrap"></div>
    ${sel('mod', t('log_module'), LOG_MODS.map((x) => [x, t('lm_' + x)]))}
    ${sel('act', t('log_action'), LOG_ACTS.map((x) => [x, t('la_' + x)]))}
    <div class="flex-1 min-w-[180px]"><label class="label" for="l-q">${t('search')}</label><input id="l-q" class="input" value="${esc(f.q)}" placeholder="${t('log_search_ph')}"></div>
    <button id="l-export" class="btn btn-ghost">${icon('download', 'w-4 h-4')} ${t('export_csv')}</button>
  </div>
  <div id="l-summary" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3 mb-4"></div>
  <div id="l-out"></div>
  <div class="mt-4 text-center no-print"><button id="l-more" class="btn btn-ghost">${t('log_more')}</button></div>`;
  const filtered = () => rows.filter((r) => { const d = String(r.at || '').slice(0, 10);
    return d >= f.from && d <= f.to && (!f.user || r.uid === f.user) && (!f.mod || r.mod === f.mod) && (!f.act || r.act === f.act)
      && (!f.q || [r.msg, r.ref, r.n, r.un, r.dev].some((x) => String(x || '').toLowerCase().includes(f.q.toLowerCase()))); });
  const draw = () => {
    $('#l-user-wrap').innerHTML = sel('user', t('log_employee'), users(), 'w-48');
    $('#l-user').onchange = (e) => { f.user = e.target.value; sync(); };
    const list = filtered();
    /* ملخص لكل موظف: عدد العمليات، آخر نشاط، آخر جهاز */
    const per = new Map(); list.forEach((r) => { const x = per.get(r.uid) || { n: r.n || r.un, c: 0, last: r, adds: 0, dels: 0 }; x.c++; if (r.act === 'add') x.adds++; if (r.act === 'delete') x.dels++; per.set(r.uid, x); });
    $('#l-summary').innerHTML = [...per.entries()].sort((a, b) => b[1].c - a[1].c).slice(0, 8).map(([uid, x]) => `<button data-u="${esc(uid)}" class="card p-3 text-start hover:border-road-500 ${f.user === uid ? 'ring-2 ring-road-500' : ''}">
      <div class="font-semibold truncate">${esc(x.n)}</div><div class="text-xs text-slate-500 mt-0.5">${t('log_count').replace('{n}', num(x.c))} · ${t('la_add')}: ${num(x.adds)} · ${t('la_delete')}: ${num(x.dels)}</div>
      <div class="text-xs text-slate-500 mt-1 truncate">${t('log_last')}: ${esc(x.last.at)} · ${esc(x.last.dev || '')}</div></button>`).join('');
    $$('[data-u]').forEach((b) => (b.onclick = () => { f.user = f.user === b.dataset.u ? '' : b.dataset.u; sync(); }));
    $('#l-out').innerHTML = list.length ? `<div class="card overflow-x-auto"><table class="w-full"><thead><tr><th class="th">${t('log_time')}</th><th class="th">${t('log_employee')}</th>${f.sys === 'all' ? `<th class="th">${t('log_system')}</th>` : ''}
      <th class="th">${t('log_module')}</th><th class="th">${t('log_action')}</th><th class="th">${t('log_details')}</th><th class="th">${t('log_device')}</th></tr></thead>
      <tbody>${list.slice(0, 1000).map((r) => `<tr class="hover:bg-slate-50 align-top"><td class="td whitespace-nowrap tabular-nums text-sm" dir="ltr">${esc(r.at)}</td>
        <td class="td"><div class="font-medium">${esc(r.n || r.un)}</div><div class="text-xs text-slate-500" dir="ltr">${esc(r.un || '')}</div></td>
        ${f.sys === 'all' ? `<td class="td text-sm">${tsys('sys_short', r.sys)}</td>` : ''}
        <td class="td text-sm">${t('lm_' + r.mod)}</td><td class="td"><span class="badge ${ACT_CLS[r.act] || 'bg-slate-100 text-slate-700'}">${t('la_' + r.act)}</span></td>
        <td class="td text-sm">${r.sid && r.sys === SYS && S.shipments[r.sid] ? `<a href="#/shipments/${esc(r.sid)}" class="font-medium text-road-700 hover:underline">${esc(r.ref || '')}</a> ` : ''}${esc(r.msg)}</td>
        <td class="td text-xs text-slate-500 whitespace-nowrap">${esc(r.dev || '')}</td></tr>`).join('')}</tbody></table></div>
      ${list.length > 1000 ? `<p class="text-xs text-slate-500 mt-2">${t('rc_truncated').replace('{n}', num(1000)).replace('{total}', num(list.length))}</p>` : ''}`
      : emptyBox(t('log_empty'));
    $('#l-more').classList.toggle('hidden', !rows.length || rows.length % 1500 !== 0);
  };
  const sync = () => { const p = new URLSearchParams(); Object.keys(f).forEach((k) => f[k] && p.set(k, f[k])); history.replaceState(null, '', '#/log?' + p); draw(); };
  ['from', 'to', 'mod', 'act'].forEach((k) => ($('#l-' + k).onchange = (e) => { f[k] = e.target.value; sync(); }));
  let tm; $('#l-q').oninput = (e) => { clearTimeout(tm); tm = setTimeout(() => { f.q = e.target.value.trim(); sync(); }, 250); };
  if ($('#l-sys')) $('#l-sys').onchange = (e) => { f.sys = e.target.value; const p = new URLSearchParams(); Object.keys(f).forEach((k) => f[k] && p.set(k, f[k])); location.hash = '#/log?' + p; };
  $('#l-more').onclick = async () => { const older = await API.get('/log?before=' + encodeURIComponent(rows[rows.length - 1].id) + (f.sys === 'all' ? '&sys=all' : '')); rows = rows.concat(older); draw(); };
  $('#l-export').onclick = () => downloadCsv(`Activity_Log_${f.from}_${f.to}.csv`, ['Time', 'Employee', 'Username', 'System', 'Module', 'Action', 'Reference', 'Details', 'Device'],
    filtered().map((r) => [r.at, r.n, r.un, tsys('sys_short', r.sys), t('lm_' + r.mod), t('la_' + r.act), r.ref, r.msg, r.dev]));
  draw();
}

/* ---------- الموجّه ---------- */
const ROUTES = [
  [/^#\/dashboard$/, pageDashboard],
  [/^#\/search$/, pageSearch, null, 'sap'],
  [/^#\/coldchain$/, pageColdChain, null, 'odoo'],
  [/^#\/shipments$/, pageShipments],
  [/^#\/shipments\/new$/, pageNewShipment, 'ship_add'],
  [/^#\/shipments\/([\w-]+)$/, pageShipment],
  [/^#\/reconcile$/, pageReconcile, 'reconcile'],
  [/^#\/drivers$/, pageDrivers],
  [/^#\/trucks$/, pageTrucks],
  [/^#\/expiry$/, pageExpiry],
  [/^#\/billing$/, pageBilling, 'pricing'],
  [/^#\/places$/, pagePlaces],
  [/^#\/clients$/, pageClients],
  [/^#\/users$/, pageUsers, 'admin'],
  [/^#\/log$/, pageLog, 'admin'],
  [/^#\/settings$/, pageSettings],
];

async function router(keepScroll) {
  setLang(LANG);
  if (!keepScroll) $('#modal-root').innerHTML = '';
  const hash = location.hash || '#/dashboard';
  if (!window.ME) return renderLogin();
  if (hash === '#/login') { location.hash = '#/dashboard'; return; }
  window.SETTINGS = settings();
  const [path, qs] = hash.split('?');
  const y = scrollY;
  for (const [re, fn, roles, sys] of ROUTES) {
    const m = path.match(re);
    if (!m) continue;
    if (!allowed(roles) || (sys && sys !== SYS)) { location.hash = '#/dashboard'; return; }
    renderShell(path);
    const view = $('#view');
    view.innerHTML = loading();
    try { await fn(view, m, new URLSearchParams(qs || '')); }
    catch (e) { view.innerHTML = errorBox(e.message); }
    window.scrollTo(0, keepScroll ? y : 0);
    return;
  }
  location.hash = '#/dashboard';
}

window.addEventListener('hashchange', () => router());
window.addEventListener('beforeprint', () => { if (window.ME) logAct('print', 'print', document.title); });
/* الإقلاع: جلسة Firebase المحفوظة (مشتركة مع نظام التوريد على نفس الرابط) تُدخِل مباشرة */
$('#app').innerHTML = loading();
const offBoot = firebase.auth().onAuthStateChanged(async (fu) => {
  offBoot();
  if (!fu) { cacheClear(); return renderLogin(); }
  try { const r = await resolveMe(fu); if (r && r.pick) return renderSystemPicker(r.pick); router(); }
  catch (e) { renderLogin(); if (e.code !== 'not_member') toast(e.message, 'err'); }
});
