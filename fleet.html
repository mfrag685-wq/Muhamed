  <style type="text/tailwindcss">
    @layer components {
      .card { @apply bg-white rounded-xl border border-slate-200/80; }
      .input { @apply w-full rounded-lg border border-slate-300 bg-white px-3 py-2.5 text-[15px] text-ink placeholder:text-slate-400 focus:border-road-500 focus:outline-none focus:ring-2 focus:ring-road-500/20; }
      .label { @apply block text-sm font-medium text-slate-600 mb-1.5; }
      .btn { @apply inline-flex items-center justify-center gap-2 rounded-lg px-4 py-2.5 text-sm font-medium transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-road-500 focus-visible:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed whitespace-nowrap; }
      .btn-primary { @apply bg-road-500 text-white hover:bg-road-600; }
      .btn-ghost { @apply bg-white text-slate-700 border border-slate-300 hover:bg-slate-50; }
      .btn-danger { @apply bg-white text-rose-700 border border-rose-200 hover:bg-rose-50; }
      .btn-signal { @apply bg-signal text-ink hover:brightness-95; }
      .btn-lg { @apply px-6 py-3 text-base; }
      .badge { @apply inline-flex items-center rounded-md px-2 py-0.5 text-xs font-medium whitespace-nowrap; }
      .th { @apply px-4 py-3 text-start text-xs font-semibold text-slate-500 bg-slate-50 border-b border-slate-200 whitespace-nowrap; }
      .td { @apply px-4 py-3 border-b border-slate-100 text-sm align-middle; }
      .section-title { @apply text-base font-semibold text-ink mb-4; }
      .vin { @apply font-mono tracking-[0.12em]; }
      .nav-link { @apply flex items-center gap-3 rounded-lg px-3 py-2.5 text-[15px] text-road-100/80 hover:bg-white/10 hover:text-white; }
      .nav-link.active { @apply bg-white/15 text-white; }
      .cond-btn { @apply flex-1 rounded-lg border px-2 py-2 text-xs sm:text-sm font-medium transition-colors border-slate-300 bg-white text-slate-600 hover:bg-slate-50; }
    }
    html, body { -webkit-tap-highlight-color: transparent; }
    /* لوحة الشاسيه في البحث: العنصر المميز في الواجهة */
    .vin-plate { background: #fff; border: 2px solid #15201B; border-radius: 8px; box-shadow: inset 0 0 0 3px #fff, inset 0 0 0 4px #15201B; }
    /* مؤشر الاتصال بالسحابة */
    .cloud-dot { width: 10px; height: 10px; border-radius: 999px; background: #0B6B4A; box-shadow: 0 0 0 3px #D3E9DF; flex-shrink: 0; }
    .cloud-dot[data-state="offline"] { background: #E8A317; box-shadow: 0 0 0 3px #fdecc8; }
    .cloud-dot[data-state="err"] { background: #be123c; box-shadow: 0 0 0 3px #fecdd3; }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff !important; }
      main { padding: 0 !important; max-width: none !important; }
      .card { border-color: #ccc !important; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

function setPath(obj, path, value) {
  const parts = path.split('/'); let o = obj;
  for (let i = 0; i < parts.length - 1; i++) { if (o[parts[i]] === null || typeof o[parts[i]] !== 'object') { if (value === null) return; o[parts[i]] = {}; } o = o[parts[i]]; }
  if (value === null) delete o[parts[parts.length - 1]]; else o[parts[parts.length - 1]] = value;
}

  odoo: { entry: ['ship_add', 'temps', 'pod', 'permit'], operator: ['ship_add', 'ship_edit', 'temps', 'pod', 'permit', 'costs'], costs: ['costs'], pricing: ['pricing', 'export'] },

}

/* رقم الشحنة SH-YYYYMM-0001 بعدّاد سحابي ذري، فلا يتكرر الرقم بين جهازين */
async function nextRef(tripDate) {
  const ym = tripDate.slice(0, 4) + tripDate.slice(5, 7), prefix = `${SYSTEMS[SYS].prefix}-${ym}-`;
  const localMax = allShips().filter((s) => String(s.ref_no || '').startsWith(prefix)).reduce((m, s) => Math.max(m, parseInt(s.ref_no.slice(prefix.length), 10) || 0), 0);
  const tx = FB.root.child('seq/' + ym).transaction((cur) => Math.max(cur || 0, localMax) + 1);
  const r = await Promise.race([tx, new Promise((_, rej) => setTimeout(() => rej(apiErr('network')), 12000))]);
  if (!r.committed) throw apiErr('server_error');
  return prefix + String(r.snapshot.val()).padStart(4, '0');

/* ---------- المطابقة مع ملفات ساب ---------- */
const normCode = (v) => String(v ?? '').trim().toUpperCase().replace(/\s+/g, '').replace(/^0+(?=.)/, '');
const dayDiff = (a, b) => Math.round(Math.abs(Date.parse(a) - Date.parse(b)) / 864e5);
function parseQty(v) {
  const s = String(v ?? '').trim(); if (!s) return null;
  if (/^\d+([.,]0+)?$/.test(s)) return parseInt(s, 10);
  const n = parseFloat(s.replace(/,/g, '')); return Number.isFinite(n) ? n : null;
}
const sysView = (x) => x && ({ shipment_id: x.shipment_id, ref_no: x.ref_no, trip_date: x.trip_date, status: x.status, sap_document_no: x.sap_document_no || null,
  driver_name: x.driver_name, vendor: x.sap_vendor_code, client_name: x.client_name, customer: x.sap_customer_code, vin: x.vin, condition: x.condition, qty: x.vehicle_count });

async function reconcile(b) {
  needPerm('reconcile');
  if (SYS === 'odoo') return reconcileOdoo(b);
  const { mode, from, to, file_name } = b;
  const tol = Math.max(0, Number(b.tolerance_days ?? 2));
  const input = Array.isArray(b.rows) ? b.rows : [];
  if (!['vin', 'shipment'].includes(mode) || !isYmd(from) || !isYmd(to) || !input.length) throw apiErr('required_fields');
  const inPeriod = (d) => d >= from && d <= to;
  const ships = allShips().filter((s) => s.status !== 'cancelled').map((s) => ({ ...s, shipment_id: s.id }));
  let all;
  if (mode === 'vin') all = ships.flatMap((s) => s.vehicles.map((v) => ({ ...s, vehicle_id: s.id + '/' + v.id, vin: v.vin, condition: v.condition })));
  else all = ships;
  const periodList = all.filter((x) => inPeriod(x.trip_date));
  const lookup = new Map();
  const add = (k, x) => { if (!k) return; if (!lookup.has(k)) lookup.set(k, []); if (!lookup.get(k).includes(x)) lookup.get(k).push(x); };
  if (mode === 'vin') all.forEach((x) => add(x.vin, x));
  else all.forEach((x) => { add(normCode(x.ref_no), x); add(normCode(x.sap_document_no), x); });

  const items = [], seen = new Map(), matchedIds = new Set(), suggestions = new Map();
  let skipped = 0;
  for (const r of input) {
    const key = mode === 'vin' ? normVin(r.key) : normCode(r.key);
    if (!key) { skipped++; continue; }
    const sap = { date: isYmd(r.date) ? r.date : null, customer: r.customer || null, vendor: r.vendor || null, doc: r.doc || null, qty: parseQty(r.qty) };
    const item = { key, row: r.row, sap, sys: null, diffs: [] };
    if (seen.has(key)) { item.status = 'duplicate_in_sap'; item.first_row = seen.get(key); items.push(item); continue; }
    seen.set(key, r.row);
    const cands = lookup.get(key) || [];
    if (!cands.length) { item.status = 'missing_in_system'; items.push(item); continue; }
    const pick = [...cands].sort((a, c) => {
      if (sap.date) return dayDiff(a.trip_date, sap.date) - dayDiff(c.trip_date, sap.date);
      return (inPeriod(c.trip_date) - inPeriod(a.trip_date)) || String(c.trip_date).localeCompare(a.trip_date);
    })[0];
    item.sys = sysView(pick);
    matchedIds.add(mode === 'vin' ? pick.vehicle_id : pick.shipment_id);
    const d = item.diffs;
    if (sap.customer && normCode(sap.customer) !== normCode(pick.sap_customer_code)) d.push({ field: 'customer', sap: sap.customer, sys: pick.sap_customer_code || '' });
    if (sap.vendor && normCode(sap.vendor) !== normCode(pick.sap_vendor_code)) d.push({ field: 'vendor', sap: sap.vendor, sys: pick.sap_vendor_code || '' });
    if (sap.date && dayDiff(sap.date, pick.trip_date) > tol) d.push({ field: 'date', sap: sap.date, sys: pick.trip_date });
    if (!sap.date && !inPeriod(pick.trip_date)) d.push({ field: 'period', sap: `${from} / ${to}`, sys: pick.trip_date });
    if (mode === 'shipment' && sap.qty !== null && sap.qty !== pick.vehicle_count) d.push({ field: 'qty', sap: sap.qty, sys: pick.vehicle_count });
    if (sap.doc) {
      if (pick.sap_document_no && normCode(sap.doc) !== normCode(pick.sap_document_no)) d.push({ field: 'doc', sap: sap.doc, sys: pick.sap_document_no });
      if (!pick.sap_document_no && !suggestions.has(pick.shipment_id)) suggestions.set(pick.shipment_id, { shipment_id: pick.shipment_id, ref_no: pick.ref_no, doc: String(sap.doc).trim() });
    }
    item.status = d.length ? 'mismatch' : 'matched';
    items.push(item);
  }
  for (const x of periodList) {
    const id = mode === 'vin' ? x.vehicle_id : x.shipment_id;
    if (!matchedIds.has(id)) items.push({ status: 'missing_in_sap', key: mode === 'vin' ? x.vin : x.ref_no, row: null, sap: null, sys: sysView(x), diffs: [] });
  }
  const count = (s) => items.filter((i) => i.status === s).length;
  const summary = { sap_rows: input.length, skipped, system_rows: periodList.length, matched: count('matched'), mismatch: count('mismatch'),
    missing_in_system: count('missing_in_system'), missing_in_sap: count('missing_in_sap'), duplicate_in_sap: count('duplicate_in_sap') };
  const result = { mode, from, to, tolerance_days: tol, file_name: file_name || null, summary, items, doc_suggestions: [...suggestions.values()] };

  /* الحفظ: فهرس خفيف يُزامَن دائماً، والنتيجة الكاملة تُجلب عند فتحها فقط؛ نحتفظ بآخر 30 مطابقة */
  const id = newKey(), created_at = nowStr();
  const up = { [`reconIdx/${id}`]: { mode, period_from: from, period_to: to, file_name: file_name || null, summary, created_at, user_name: userName() },
    [`reconData/${id}`]: JSON.stringify({ ...result, created_at }) };
  Object.keys(S.reconIdx || {}).map((k) => [k, S.reconIdx[k].created_at || '']).sort((a, c) => c[1].localeCompare(a[1])).slice(29)
    .forEach(([k]) => { up[`reconIdx/${k}`] = null; up[`reconData/${k}`] = null; });
  write(up);
  return { id, ...result };
}

  if ((m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/))) return ymd(m[1], m[2], m[3]);
  if ((m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/))) return ymd(m[3], m[2], m[1]); // يوم/شهر/سنة كما في ساب السعودية
  if ((m = s.match(/^(\d{4})(\d{2})(\d{2})$/))) return ymd(m[1], m[2], m[3]);
  return null;
}

const cellText = (v) => (v instanceof Date ? toISODate(v) : String(v ?? '').trim());

function detectHeaderRow(rows) {
  const counts = rows.slice(0, 30).map((r) => r.filter((c) => cellText(c)).length);
  const max = Math.max(0, ...counts);
  const i = counts.findIndex((c) => c >= Math.max(2, max * 0.6));
  return i < 0 ? 1 : i + 1;
}

function rcHeaders() {
  const rows = RC.sheets?.[RC.sheetName] || [];
  const h = rows[RC.headerRow - 1] || [];
  const width = Math.max(h.length, ...rows.slice(RC.headerRow, RC.headerRow + 50).map((r) => r.length));
  return Array.from({ length: width }, (_, i) => cellText(h[i]) || `${t('rc_column')} ${i + 1}`);
}

function rcGuessMapping(mode, headers) {
  let saved = {}; try { saved = JSON.parse(localStorage.getItem('fleet_rc_map_' + mode) || '{}'); } catch {}
  const map = {}, used = new Set();
  for (const [f] of RC_FIELDS[mode]) {
    if (saved[f] && headers.includes(saved[f])) { map[f] = headers.indexOf(saved[f]); used.add(map[f]); continue; }
    const syn = RC_GUESS[f === 'key' ? 'key_' + mode : f] || [];
    const idx = headers.findIndex((h, i) => !used.has(i) && syn.some((s) => h.toLowerCase().includes(s)));
    map[f] = idx; if (idx >= 0) used.add(idx);
  }
  return map;
}

function rcRenderMapping(mode) {
  const rows = RC.sheets[RC.sheetName];

  $('#rc-hrow').onchange = (e) => { RC.headerRow = Math.max(1, +e.target.value || 1); rcRenderMapping(mode); };
  $('#rc-run').onclick = () => rcRun(mode, headers, dataRows);
}

async function rcRun(mode, headers, dataRows) {
  const map = {};
  $$('.rc-col').forEach((s) => (map[s.dataset.f] = +s.value));
  if (map.key < 0) return toast(t('rc_need_key'), 'err');
  const saved = {}; Object.entries(map).forEach(([f, i]) => i >= 0 && (saved[f] = headers[i]));
  try { localStorage.setItem('fleet_rc_map_' + mode, JSON.stringify(saved)); } catch {}
  const firstData = RC.headerRow + 1;
  const allRows = RC.sheets[RC.sheetName].slice(RC.headerRow);
  const rows = [];
  allRows.forEach((r, i) => {
    if (!r.some((c) => cellText(c))) return;
    const get = (f) => (map[f] >= 0 ? r[map[f]] : '');
    rows.push({ row: firstData + i, key: cellText(get('key')), date: toISODate(get('date')), customer: cellText(get('customer')), vendor: cellText(get('vendor')), doc: cellText(get('doc')), qty: cellText(get('qty')), amount: cellText(get('amount')) });
  });
  const btn = $('#rc-run'); btn.disabled = true;
  $('#rc-result').innerHTML = loading();
  try {
    const r = await API.post('/reconcile', { mode, rows, from: $('#rc-from').value, to: $('#rc-to').value, tolerance_days: +$('#rc-tol').value, file_name: RC.fileName, vat_included: !!($('#rc-vat') && $('#rc-vat').checked) });
    RC.result = r; RC.filter = 'issues';
    rcRenderResult(); rcLoadHistory();
    $('#rc-result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) { $('#rc-result').innerHTML = errorBox(e.message); }
  btn.disabled = false;
}

async function rcOpen(id) {
  $('#rc-result').innerHTML = loading();

  catch (e) { $('#rc-result').innerHTML = errorBox(e.message); }

const RC_STATUS = {
  matched: 'bg-road-50 text-road-700 ring-1 ring-road-200', mismatch: 'bg-amber-50 text-amber-800 ring-1 ring-amber-200',
  missing_in_system: 'bg-rose-50 text-rose-700 ring-1 ring-rose-200', missing_in_sap: 'bg-sky-50 text-sky-800 ring-1 ring-sky-200',
  duplicate_in_sap: 'bg-slate-100 text-slate-700 ring-1 ring-slate-300',
};

function rcRenderResult() {
  const R = RC.result, S = R.summary;

  const list = RC.filter === 'all' ? R.items : RC.filter === 'issues' ? issues : R.items.filter((i) => i.status === RC.filter);

  const diffText = (d) => `<div><span class="text-slate-500">${t('rc_f_' + d.field)}:</span> <span class="font-medium">${t('rc_in_sap')} ${esc(d.sap)}</span> · <span class="font-medium">${t('rc_in_system')} ${esc(d.sys || '—')}</span></div>`;
  const keyCell = (i) => R.mode === 'vin' ? `<a class="vin font-semibold text-road-700 hover:underline" dir="ltr" href="#/search?vin=${esc(i.key)}">${esc(i.key)}</a>` : `<span class="font-semibold" dir="ltr">${esc(i.key)}</span>`;
  const note = (i) => ({
    missing_in_system: t('rc_note_missing_in_system'),
    missing_in_sap: t('rc_note_missing_in_sap'),
    duplicate_in_sap: t('rc_note_duplicate').replace('{row}', i.first_row),
  }[i.status] || '');

  $('#rc-result').innerHTML = `
  <section class="card p-4 md:p-6">
    <div class="flex flex-wrap items-baseline justify-between gap-2 mb-4">
      <h2 class="section-title mb-0">${t('rc_step3')}</h2>
      <span class="text-sm text-slate-500" dir="auto">${esc(R.file_name || '')} · ${esc(R.from)} / ${esc(R.to)} · ${t('rc_mode_' + R.mode)}</span>
    </div>
    <p class="text-sm text-slate-600 mb-4">${t('rc_totals').replace('{sap}', num(S.sap_rows - S.skipped)).replace('{sys}', num(S.system_rows))}</p>
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2 mb-5">
      ${chip('matched', S.matched, t('rc_s_matched'), 'text-road-700')}

      ${chip('missing_in_system', S.missing_in_system, t('rc_s_missing_in_system'), 'text-rose-700')}
      ${chip('missing_in_sap', S.missing_in_sap, t('rc_s_missing_in_sap'), 'text-sky-700')}
      ${chip('duplicate_in_sap', S.duplicate_in_sap, t('rc_s_duplicate_in_sap'), 'text-slate-700')}
    </div>
    <div class="flex flex-wrap gap-2 mb-4">
      <button data-filter="issues" class="btn ${RC.filter === 'issues' ? 'btn-primary' : 'btn-ghost'}">${t('rc_show_issues')} (${num(issues.length)})</button>

      ${R.doc_suggestions.length ? `<button id="rc-apply" class="btn btn-signal">${t('rc_apply_docs').replace('{n}', R.doc_suggestions.length)}</button>` : ''}

    </div>
    ${shown.length ? `<div class="overflow-x-auto rounded-lg border border-slate-200"><table class="w-full">

        <td class="td"><span class="badge ${RC_STATUS[i.status]}">${t('rc_s_' + i.status)}</span></td>

        <td class="td text-xs leading-relaxed">${i.sys ? `<a href="#/shipments/${i.sys.shipment_id}" class="font-medium text-road-700 hover:underline">${esc(i.sys.ref_no)}</a> · ${esc(i.sys.trip_date)}<br>${esc(i.sys.driver_name || '')}${i.sys.vendor ? ' (' + esc(i.sys.vendor) + ')' : ''}<br>${esc(i.sys.client_name || '')}${i.sys.customer ? ' (' + esc(i.sys.customer) + ')' : ''}${R.mode === 'shipment' ? '<br>' + t('rc_f_qty') + ': ' + num(i.sys.qty) : ''}${R.mode === 'odoo' ? '<br>' + t('client_total') + ': ' + money(i.sys.total) + (i.sys.doc ? '<br>' + t('rc_f_doc') + ': ' + esc(i.sys.doc) : '') : ''}` : '—'}</td>

      ${list.length > shown.length ? `<p class="text-xs text-slate-500 mt-2">${t('rc_truncated').replace('{n}', num(shown.length)).replace('{total}', num(list.length))}</p>` : ''}`

  </section>`;

  $$('#rc-result [data-filter]').forEach((b) => (b.onclick = () => { RC.filter = b.dataset.filter; rcRenderResult(); }));
  $('#rc-export').onclick = rcExport;
  if ($('#rc-apply')) $('#rc-apply').onclick = async () => {
    if (!confirm(t('rc_apply_confirm').replace('{n}', R.doc_suggestions.length))) return;
    try { const r = await API.post('/reconcile/apply-docs', { items: R.doc_suggestions }); toast(t('rc_applied').replace('{n}', r.updated)); R.doc_suggestions = []; rcRenderResult(); }
    catch (e) { toast(e.message, 'err'); }
  };
}

function rcExport() {
  logAct('export', 'export', `${t('rc_export')} · ${RC.result.file_name || ''}`);
  const R = RC.result;
  const head = ['Result', R.mode === 'vin' ? 'VIN' : 'Key', 'FileRow', 'SAP_Date', 'SAP_Customer', 'SAP_Vendor', 'SAP_Qty', 'SAP_Doc',
    'Sys_RefNo', 'Sys_TripDate', 'Sys_Driver', 'Sys_VendorCode', 'Sys_Client', 'Sys_CustomerCode', 'Sys_Qty', 'Sys_SAPDoc', 'Differences'];
  const e = (v) => { const s = v === null || v === undefined ? '' : String(v); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = R.items.map((i) => [t('rc_s_' + i.status), i.key, i.row, i.sap?.date, i.sap?.customer, i.sap?.vendor, i.sap?.qty, i.sap?.doc,
    i.sys?.ref_no, i.sys?.trip_date, i.sys?.driver_name, i.sys?.vendor, i.sys?.client_name, i.sys?.customer, R.mode === 'shipment' ? i.sys?.qty : '', i.sys?.sap_document_no,
    i.diffs.map((d) => `${t('rc_f_' + d.field)}: SAP=${d.sap} / SYS=${d.sys}`).join(' | ')].map(e).join(','));
  const blob = new Blob(['\uFEFF' + [head.join(','), ...lines].join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `Reconciliation_${R.mode}_${R.from}_${R.to}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const statusBadge = (s) => `<span class="badge ${STATUS_CLS[s] || ''}">${t('status_' + s)}</span>`;
const route = (a, b) => `<span>${esc(a)}</span> <span class="inline-block text-slate-400 rtl:rotate-180">→</span> <span>${esc(b)}</span>`;
/* المسار مع الدولة إن كانت خارج المملكة + شارة «دولي» */
const routeS = (s) => {
  const h = homeCountry(), pl = (c, k) => esc(c) + (k && k !== h ? ` <span class="text-xs text-slate-500">(${esc(k)})</span>` : '');
  return `<span>${pl(s.origin, s.origin_country)}</span> <span class="inline-block text-slate-400 rtl:rotate-180">→</span> <span>${pl(s.destination, s.destination_country)}</span>`
    + (s.scope === 'international' ? ` <span class="badge bg-sky-50 text-sky-800 ring-1 ring-sky-200">${t('scope_international')}</span>` : '');
};
const permitBadge = (s) => s.permit_no ? `<span class="badge bg-road-50 text-road-700 ring-1 ring-road-200">✓ <span dir="ltr">${esc(s.permit_no)}</span></span>`
  : ['delivered', 'cancelled'].includes(s.status) ? `<span class="badge bg-slate-100 text-slate-500">${t('permit_none')}</span>`
  : `<span class="badge bg-rose-50 text-rose-700 ring-1 ring-rose-200">${t('permit_missing')}</span>`;
const money = (n) => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const BUCKET_CLS = { expired: 'bg-rose-600 text-white', d30: 'bg-rose-50 text-rose-700 ring-1 ring-rose-200', d60: 'bg-amber-50 text-amber-800 ring-1 ring-amber-200',
  d90: 'bg-yellow-50 text-yellow-800 ring-1 ring-yellow-200', ok: 'bg-road-50 text-road-700 ring-1 ring-road-200', missing: 'bg-slate-100 text-slate-500' };
const expText = (x) => x.bucket === 'missing' ? t('b_missing') : x.days < 0 ? t('exp_since').replace('{n}', num(-x.days)) : x.days === 0 ? t('exp_today') : t('exp_in').replace('{n}', num(x.days));
const expBadge = (x, withLabel) => `<span class="badge ${BUCKET_CLS[x.bucket]}">${withLabel ? t(x.label) + ': ' : ''}${expText(x)}</span>`;
const docsBadge = (r) => { const d = r.docs; if (!d) return '';
  if (!d.worst) return `<span class="badge bg-slate-100 text-slate-500">${t('b_missing')}</span>`;
  return expBadge(d.worst, true) + (d.missing ? ` <span class="text-xs text-slate-400">+${d.missing} ${t('docs_missing_short')}</span>` : ''); };

const loading = () => `<div class="py-16 flex justify-center"><div class="h-8 w-8 rounded-full border-[3px] border-road-100 border-t-road-500 animate-spin"></div></div>`;
const errorBox = (m) => `<div class="card p-5 text-rose-700 bg-rose-50 border-rose-200 flex gap-3 items-start">${icon('alert')}<div>${esc(m)}</div></div>`;
const emptyBox = (m, action = '') => `<div class="card p-10 text-center text-slate-500"><p class="mb-4">${esc(m)}</p>${action}</div>`;

function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = `pointer-events-auto mx-4 rounded-lg px-4 py-3 text-sm shadow-lg ${type === 'err' ? 'bg-rose-700 text-white' : 'bg-ink text-white'}`;
  el.textContent = msg;
  $('#toast').replaceChildren(el);
  setTimeout(() => el.remove(), 3500);
}

function setTitle(text) { const h = $('#page-title'); if (h) h.textContent = text; document.title = text + ' · ' + t('app_name'); }

function fieldHtml(f, value) {
  const v = value ?? f.default ?? '';
  const req = f.required ? 'required' : '';
  const label = `<label class="label" for="f-${f.name}">${esc(t(f.label || f.name))}${f.required ? ' <span class="text-rose-500">*</span>' : ''}</label>`;
  const wrap = (inner) => `<div class="${f.full ? 'sm:col-span-2' : ''}">${label}${inner}</div>`;
  if (f.type === 'select')
    return wrap(`<select id="f-${f.name}" name="${f.name}" class="input" ${req}>${f.options.map((o) => `<option value="${esc(o.value)}" ${String(o.value) === String(v) ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`);
  if (f.type === 'textarea') return wrap(`<textarea id="f-${f.name}" name="${f.name}" rows="3" class="input" ${req}>${esc(v)}</textarea>`);
  return wrap(`<input id="f-${f.name}" name="${f.name}" type="${f.type || 'text'}" class="input" value="${esc(v)}" ${req} ${f.attrs || ''}>`);
}

function openModal(title, bodyHtml, onSubmit, submitLabel) {
  const root = $('#modal-root');
  root.innerHTML = `
  <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-ink/50 sm:p-4" data-backdrop>
    <div class="bg-white w-full sm:max-w-2xl rounded-t-2xl sm:rounded-2xl shadow-2xl max-h-[92vh] flex flex-col" role="dialog" aria-modal="true">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-200">
        <h3 class="font-semibold text-lg">${esc(title)}</h3>
        <button type="button" class="p-1 text-slate-400 hover:text-ink" data-close aria-label="${t('close')}">${icon('x')}</button>
      </div>
      <form id="modal-form" class="p-5 overflow-y-auto" novalidate>
        <div class="grid sm:grid-cols-2 gap-4">${bodyHtml}</div>
        <div class="flex gap-2 pt-6 pb-[env(safe-area-inset-bottom)]">
          <button class="btn btn-primary flex-1 sm:flex-none" type="submit">${esc(submitLabel || t('save'))}</button>
          <button type="button" class="btn btn-ghost" data-close>${t('cancel')}</button>
        </div>
      </form>
    </div>
  </div>`;
  const close = () => (root.innerHTML = '');
  $$('[data-close]', root).forEach((b) => (b.onclick = close));
  $('[data-backdrop]', root).onclick = (e) => { if (e.target.dataset.backdrop !== undefined) close(); };
  const form = $('#modal-form');
  form.onsubmit = async (e) => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    const btn = form.querySelector('[type=submit]'); btn.disabled = true;
    try { await onSubmit(Object.fromEntries(new FormData(form)), form); close(); }
    catch (err) { toast(err.message, 'err'); btn.disabled = false; }
  };
  setTimeout(() => form.querySelector('input,select,textarea')?.focus(), 50);
}

async function pageDashboard(view, m, qs) {

  const month = qs.get('month') || thisMonth();
  const d = await API.get('/dashboard?month=' + month);
  const k = d.kpis, R = d.rules;
  const rate = k.inspected ? (k.damaged / k.inspected) * 100 : null;
  const kpi = (label, value, sub, accent = '') => `
    <div class="card p-4 md:p-5 ${accent}">
      <div class="text-sm text-slate-500 mb-2">${label}</div>
      <div class="text-2xl md:text-3xl font-semibold tabular-nums">${value}</div>
      ${sub ? `<div class="text-xs text-slate-500 mt-1">${sub}</div>` : ''}
    </div>`;
  const incBadge = (r) => ({
    eligible: `<span class="badge bg-road-500 text-white">${t('inc_eligible')} · ${num(r.incentive_amount)} ${t('sar')}</span>`,
    not_eligible: `<span class="badge bg-rose-50 text-rose-700 ring-1 ring-rose-200">${t('inc_not_eligible')}</span>`,
    incomplete: `<span class="badge bg-amber-50 text-amber-800 ring-1 ring-amber-200">${t('inc_incomplete')} (${r.month_pending})</span>`,
    insufficient: `<span class="badge bg-slate-100 text-slate-600">${t('inc_insufficient')}</span>`,
  }[r.incentive]);

    if (r.damage_rate === null) return '<span class="text-slate-400">—</span>';
    const good = r.damage_rate <= R.max_rate;

    return `<div class="flex items-center gap-2 min-w-[120px]"><span class="tabular-nums font-medium w-12 ${good ? 'text-road-700' : 'text-rose-700'}">${r.damage_rate}%</span>

    ${kpi(t('kpi_damage_rate'), rate === null ? '—' : rate.toFixed(1) + '%', `${num(k.damaged)} ${t('kpi_damaged_cars')}`, rate !== null && rate > R.max_rate ? 'border-rose-300' : '')}
    ${kpi(t('kpi_active'), num(k.in_transit), `${t('status_pending')}: ${num(k.pending)}`, 'bg-signal/10 border-signal/40')}
  </div>
  <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4 mb-6">
    <a href="#/shipments?permit=missing" class="block">${kpi(t('kpi_no_permit'), num(k.no_permit), t('permit_hint_short'), k.no_permit ? 'border-rose-300 bg-rose-50/40' : '')}</a>
    <a href="#/expiry" class="block">${kpi(t('kpi_expiry'), num(k.expiry_alerts), t('kpi_expiry_sub'), k.expiry_alerts ? 'border-rose-300 bg-rose-50/40' : '')}</a>
    ${perm('pricing') ? `<a href="#/billing" class="block">${kpi(t('kpi_revenue'), money(k.revenue), `${t('total_cost')}: ${money(k.costs)}`)}</a>

  </div>

  <section class="card mb-6 overflow-hidden">
    <div class="p-4 md:p-5 border-b border-slate-200 flex flex-wrap gap-2 items-baseline justify-between">
      <h2 class="font-semibold">${t('drivers_report')}</h2>
      <p class="text-xs text-slate-500">${t('incentive_rule').replace('{rate}', R.max_rate).replace('{min}', R.min_vehicles).replace('{amount}', num(R.amount))}</p>
    </div>
    ${d.drivers.length ? `<div class="overflow-x-auto"><table class="w-full">

      </tr></thead>
      <tbody>${d.drivers.map((r) => `<tr class="hover:bg-slate-50">
        <td class="td"><div class="font-medium">${esc(r.name)}</div><div class="text-xs text-slate-500">${val(r.truck_plate)}</div></td>
        <td class="td tabular-nums">${num(r.total_trips)}</td><td class="td tabular-nums">${num(r.total_vehicles)}</td>
        <td class="td tabular-nums">${num(r.month_trips)}</td><td class="td tabular-nums">${num(r.month_vehicles)}</td>
        <td class="td tabular-nums ${r.month_damaged ? 'text-rose-700 font-medium' : ''}">${num(r.month_damaged)}</td>
        <td class="td">${rateBar(r)}</td><td class="td">${incBadge(r)}</td></tr>`).join('')}</tbody>

      <li class="p-4 md:px-5 flex flex-wrap items-center gap-x-4 gap-y-1">

  $('#month').onchange = (e) => (location.hash = '#/dashboard?month=' + e.target.value);

async function pageSearch(view, m, qs) {

  <div class="max-w-3xl mx-auto">
    <div class="mb-6">
      <label class="block text-sm font-medium text-slate-600 mb-2" for="vin-q">${t('search_vin_label')}</label>
      <div class="vin-plate flex items-center gap-3 px-4 py-3 md:py-4">
        <span class="text-slate-400">${icon('search', 'w-6 h-6')}</span>
        <input id="vin-q" class="vin w-full bg-transparent text-xl md:text-2xl font-semibold uppercase outline-none placeholder:text-slate-300 placeholder:font-normal" dir="ltr"
          placeholder="${t('search_vin_ph')}" value="${esc(initial)}" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="20">
        <span id="vin-len" class="vin text-xs text-slate-400 tabular-nums" dir="ltr">0/17</span>
      </div>
      <p class="text-xs text-slate-500 mt-2">${t('search_hint')}</p>
    </div>
    <div id="results"></div>
  </div>`;
  const inp = $('#vin-q'); let timer, seq = 0;
  const run = async () => {
    const q = normVin(inp.value), box = $('#results'), my = ++seq;
    $('#vin-len').textContent = `${q.length}/17`;
    if (q.length < 4) { box.innerHTML = ''; return; }
    box.innerHTML = loading();
    try {
      const r = await API.get('/vehicles/search?q=' + encodeURIComponent(q));
      if (my === seq) box.innerHTML = renderSearchResults(r.results, q);
    } catch (e) { if (my === seq) box.innerHTML = errorBox(e.message); }
  };
  inp.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 250); });
  inp.focus();
  if (initial) run();
}

function renderSearchResults(list, q) {
  if (!list.length) return emptyBox(t('no_results'));
  const groups = new Map();
  list.forEach((r) => { if (!groups.has(r.vin)) groups.set(r.vin, []); groups.get(r.vin).push(r); });
  const dl = (label, value) => `<div><dt class="text-xs text-slate-500">${label}</dt><dd class="text-sm font-medium mt-0.5">${value}</dd></div>`;
  return [...groups].map(([vin, recs]) => {
    const latest = recs[0];
    const hl = esc(vin).replace(q, `<mark class="bg-signal/40 text-ink rounded-sm">${q}</mark>`);
    return `
    <article class="card mb-5 overflow-hidden">
      <header class="p-4 md:p-5 border-b border-slate-200 flex flex-wrap items-center gap-3">
        <div class="vin text-lg md:text-xl font-semibold" dir="ltr">${hl}</div>
        ${condBadge(latest.condition)}
        <span class="text-sm text-slate-500 ms-auto">${t('trips_for_vin').replace('{n}', recs.length)}</span>
      </header>
      <ol class="relative">
        ${recs.map((r, i) => `
        <li class="p-4 md:p-5 ${i ? 'border-t border-slate-100' : ''}">
          <div class="flex flex-wrap items-center gap-2 mb-3">
            <a href="#/shipments/${r.shipment_id}" class="font-semibold text-road-700 hover:underline">${esc(r.ref_no)}</a>
            ${statusBadge(r.status)}
            <span class="text-sm text-slate-500">${esc(r.trip_date)}</span>
          </div>
          <div class="text-base mb-4">${routeS(r)} ${permitBadge(r)}</div>
          <dl class="grid grid-cols-2 sm:grid-cols-3 gap-x-4 gap-y-3 mb-4">
            ${dl(t('driver'), esc(r.driver_name) + (r.driver_phone ? `<div class="text-xs text-slate-500 font-normal" dir="ltr">${esc(r.driver_phone)}</div>` : ''))}
            ${dl(t('truck_plate'), val(r.truck_plate))}
            ${dl(t('client'), val(r.client_name))}
            ${dl(t('model'), val(r.model || r.vehicle_type))}
            ${dl(t('departure_at'), dt(r.departure_at))}
            ${dl(t('arrival_at'), dt(r.arrival_at))}
          </dl>
          <div class="rounded-lg bg-slate-50 p-3">
            <div class="flex flex-wrap items-center gap-2"><span class="text-sm text-slate-600">${t('condition')}:</span>${condBadge(r.condition)}
              ${r.inspected_at ? `<span class="text-xs text-slate-500">${dt(r.inspected_at)} · ${val(r.inspected_by_name)}</span>` : ''}</div>
            ${r.condition_notes ? `<p class="text-sm mt-2">${esc(r.condition_notes)}</p>` : ''}
            ${r.log.length > 1 ? `<details class="mt-2"><summary class="text-xs text-road-700 cursor-pointer">${t('condition_history')} (${r.log.length})</summary>
              <ul class="mt-2 space-y-1 text-xs text-slate-600">${r.log.map((l) => `<li>${dt(l.created_at)} · ${val(l.user_name)}: ${t('cond_' + l.old_condition)} <span class="inline-block rtl:rotate-180">→</span> ${t('cond_' + l.new_condition)}${l.notes ? ' — ' + esc(l.notes) : ''}</li>`).join('')}</ul></details>` : ''}
          </div>
        </li>`).join('')}
      </ol>
    </article>`;
  }).join('');
}

    <section class="card p-4 md:p-6">
      <h2 class="section-title">${t('shipment_info')}</h2>
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div><label class="label">${t('driver')} <span class="text-rose-500">*</span></label><select name="driver_id" class="input" required>${opt(drivers, t('choose_driver'))}</select></div>
        <div><label class="label">${t('client')}</label><select name="client_id" class="input">${opt(clients, t('choose_client'))}</select></div>
        <div><label class="label">${t('trip_date')} <span class="text-rose-500">*</span></label><input type="date" name="trip_date" class="input" value="${today()}" required></div>
        <div><label class="label">${t('truck')}</label><select name="truck_id" id="truck-sel" class="input"><option value="">${t('choose_truck')}</option>${trucks.map((x) => `<option value="${x.id}">${esc(x.plate)}${x.truck_type ? ' — ' + esc(x.truck_type) : ''}</option>`).join('')}</select></div>
        <div><label class="label">${t('origin_country')}</label><select name="origin_country" id="oc" class="input">${countryOpts(homeCountry())}</select></div>
        <div><label class="label">${t('origin')} <span class="text-rose-500">*</span></label><input name="origin" list="cities-o" class="input" required></div>
        <div class="hidden lg:block"></div>
        <div><label class="label">${t('destination_country')}</label><select name="destination_country" id="dc" class="input">${countryOpts(homeCountry())}</select></div>
        <div><label class="label">${t('destination')} <span class="text-rose-500">*</span></label><input name="destination" list="cities-d" class="input" required></div>
        ${perm('pricing') ? `<div><label class="label">${t('freight')} (${t('sar')})</label><input name="freight" type="number" min="0" step="0.01" class="input" placeholder="0.00"></div>` : ''}
        ${perm('permit') ? `<div><label class="label">${t('permit_ref')}</label><input name="permit_no" class="input" dir="ltr" placeholder="${t('permit_ph')}"></div>
        <div><label class="label">${t('permit_date')}</label><input name="permit_date" type="date" class="input" value="${today()}"></div>` : ''}
        <div><label class="label">${t('vehicle_type')}</label><input name="vehicle_type" id="vtype" list="vtypes" class="input"></div>
        <div><label class="label">${t('status')}</label><select name="status" class="input"><option value="pending">${t('status_pending')}</option><option value="in_transit">${t('status_in_transit')}</option></select></div>
        <div class="sm:col-span-2"><label class="label">${t('notes')}</label><input name="notes" class="input"></div>
      </div>
    </section>

    <section class="card p-4 md:p-6">
      <div class="flex flex-wrap items-baseline justify-between gap-2 mb-4">
        <h2 class="section-title mb-0">${t('vehicles_vins')}</h2>
        <div class="text-sm text-slate-600">${t('vehicle_count')}: <b id="v-count" class="tabular-nums text-ink">0</b> · ${t('valid')}: <b id="v-valid" class="tabular-nums text-road-600">0</b></div>
      </div>
      <div class="grid md:grid-cols-2 gap-4 mb-5 p-4 rounded-lg bg-slate-50">
        <div>
          <label class="label" for="bulk">${t('paste_vins')}</label>
          <textarea id="bulk" rows="3" class="input vin text-sm" dir="ltr" placeholder="JTDKB20U793456789&#10;KMHCT41DAEU123456"></textarea>
          <button type="button" id="bulk-add" class="btn btn-ghost mt-2">${t('add_from_list')}</button>
        </div>
        <div>
          <label class="label" for="n-rows">${t('add_rows')}</label>
          <div class="flex gap-2"><input id="n-rows" type="number" min="1" max="60" value="1" class="input w-24"><button type="button" id="rows-add" class="btn btn-ghost">${t('add')}</button></div>
          <p class="text-xs text-slate-500 mt-3 leading-relaxed">${t('vin_rule')}</p>
        </div>
      </div>
      <div id="v-rows" class="space-y-2"></div>
    </section>

    <div class="flex gap-2 sticky bottom-20 md:bottom-4 z-20">
      <button class="btn btn-primary btn-lg shadow-lg" type="submit">${icon('check')} ${t('save_shipment')}</button>
      <a href="#/shipments" class="btn btn-ghost btn-lg">${t('cancel')}</a>
    </div>
  </form>`;

  const fillCities = (sel, dl) => ($('#' + dl).innerHTML = citiesOf($('#' + sel).value).map((c) => `<option value="${esc(c)}">`).join(''));
  $('#oc').onchange = () => fillCities('oc', 'cities-o'); $('#dc').onchange = () => fillCities('dc', 'cities-d');
  fillCities('oc', 'cities-o'); fillCities('dc', 'cities-d');
  /* اختيار السائق يقترح شاحنته المسجلة */
  $('select[name=driver_id]').addEventListener('change', (e) => { const d = drivers.find((x) => x.id === e.target.value), tr = d && trucks.find((x) => x.plate === d.truck_plate);
    if (tr && !$('#truck-sel').value) $('#truck-sel').value = tr.id; });
  const rowsBox = $('#v-rows');
  const addRow = (vin = '') => {
    const div = document.createElement('div');
    div.className = 'v-row grid grid-cols-12 gap-2 items-center';
    div.innerHTML = `
      <span class="v-idx col-span-1 text-xs text-slate-400 text-center tabular-nums"></span>
      <input class="input v-vin vin col-span-11 sm:col-span-5 uppercase" dir="ltr" maxlength="20" placeholder="${t('vin_17')}" value="${esc(vin)}" autocapitalize="characters" spellcheck="false">
      <input class="input v-model col-span-6 sm:col-span-3" placeholder="${t('model_optional')}">
      <input class="input v-color col-span-5 sm:col-span-2" placeholder="${t('color')}">
      <button type="button" class="v-del col-span-1 flex justify-center text-slate-400 hover:text-rose-600" aria-label="${t('delete')}">${icon('x')}</button>`;
    div.querySelector('.v-del').onclick = () => { div.remove(); update(); };
    div.querySelector('.v-vin').oninput = update;
    rowsBox.appendChild(div);
  };
  const update = () => {
    const rows = $$('.v-row', rowsBox); const counts = {};
    rows.forEach((r) => { const v = normVin($('.v-vin', r).value); if (v) counts[v] = (counts[v] || 0) + 1; });
    let filled = 0, valid = 0;
    rows.forEach((r, i) => {
      $('.v-idx', r).textContent = i + 1;
      const inp = $('.v-vin', r), v = normVin(inp.value);
      inp.classList.remove('border-road-500', 'border-rose-400', 'bg-rose-50');
      if (!v) return;
      filled++;
      if (VIN_RE.test(v) && counts[v] === 1) { valid++; inp.classList.add('border-road-500'); }
      else inp.classList.add('border-rose-400', 'bg-rose-50');
    });
    $('#v-count').textContent = filled; $('#v-valid').textContent = valid;
  };
  $('#rows-add').onclick = () => { const n = Math.min(60, Math.max(1, +$('#n-rows').value || 1)); for (let i = 0; i < n; i++) addRow(); update(); };
  $('#bulk-add').onclick = () => {
    const vins = $('#bulk').value.split(/[\s,;]+/).map(normVin).filter(Boolean);
    if (!vins.length) return;
    $$('.v-row', rowsBox).forEach((r) => { if (!normVin($('.v-vin', r).value)) r.remove(); });
    vins.forEach((v) => addRow(v)); $('#bulk').value = ''; update();
  };
  addRow(); update();

  const form = $('#ship-form');
  form.onsubmit = async (e) => {
    e.preventDefault();
    if (!form.reportValidity()) return;
    const vehicles = $$('.v-row', rowsBox).map((r) => ({ vin: normVin($('.v-vin', r).value), model: $('.v-model', r).value.trim(), color: $('.v-color', r).value.trim() })).filter((v) => v.vin);
    if (!vehicles.length) return toast(t('err_no_vehicles'), 'err');
    const bad = vehicles.filter((v) => !VIN_RE.test(v.vin));
    if (bad.length) return toast(t('err_vin_invalid') + ': ' + bad.map((v) => v.vin).join(', '), 'err');
    const payload = { ...Object.fromEntries(new FormData(form)), vehicles };
    const btn = form.querySelector('[type=submit]'); btn.disabled = true;
    try {
      let r;
      try { r = await API.post('/shipments', payload); }
      catch (err) {
        if (err.code !== 'vin_active') throw err;
        const list = err.data.conflicts.map((c) => `${c.vin} (${c.ref_no})`).join('\n');
        if (!confirm(t('confirm_active_vins') + '\n\n' + list)) { btn.disabled = false; return; }
        r = await API.post('/shipments', { ...payload, force: true });
      }
      toast(t('shipment_saved')); location.hash = '#/shipments/' + r.id;
    } catch (err) {
      const extra = err.data?.vins ? ': ' + err.data.vins.join(', ') : '';
      toast(err.message + extra, 'err'); btn.disabled = false;
    }
  };
}

/* أقسام مشتركة بين النظامين: تصريح هيئة الطرق، والتكاليف والتسعير */
function permitSection(s, open) {

    <div class="flex flex-wrap items-center gap-3 mb-2"><h2 class="font-semibold">${t('permit_title')}</h2>${permitBadge(s)}</div>
    ${s.permit_no ? `<p class="text-sm text-slate-600">${t('permit_ref')}: <b dir="ltr">${esc(s.permit_no)}</b> · ${t('permit_date')}: ${val(s.permit_date)} · ${t('permit_confirmed_by')}: ${val(s.permit_by)} (${dt(s.permit_at)})</p>`
      : `<p class="text-sm ${open ? 'text-rose-700' : 'text-slate-500'}">${t('permit_hint')}</p>`}
    ${s.status !== 'cancelled' && perm('permit') && (!s.permit_no || can('admin', 'supervisor')) ? `<div class="mt-3 flex flex-wrap items-end gap-2 no-print">
      <div class="w-60"><label class="label" for="permit-no">${t('permit_ref')}</label><input id="permit-no" class="input" dir="ltr" value="${esc(s.permit_no || '')}" placeholder="${t('permit_ph')}"></div>
      <div class="w-44"><label class="label" for="permit-date">${t('permit_date')}</label><input id="permit-date" type="date" class="input" value="${esc(s.permit_date || today())}"></div>
      <button id="permit-save" class="btn btn-primary">${icon('check', 'w-4 h-4')} ${t('permit_confirm')}</button></div>` : ''}

      <div class="lg:col-span-2"><label class="label" for="cost-desc">${t('cost_desc')}</label><input id="cost-desc" class="input"></div>

      ${perm('pricing') ? `<div><dt class="text-xs text-slate-500">${t('freight')}</dt><dd class="font-semibold mt-0.5 tabular-nums">${perm('pricing') ? `<span class="flex gap-1 no-print"><input id="freight" type="number" min="0" step="0.01" class="input py-1.5 w-28" value="${s.freight || ''}"><button id="freight-save" class="btn btn-ghost py-1.5">${t('save')}</button></span><span class="hidden print:inline">${money(s.freight)}</span>` : money(s.freight)}</dd></div>

      ${perm('pricing') ? `<div><dt class="text-xs text-slate-500">${t('margin')}</dt><dd class="font-semibold mt-0.5 tabular-nums ${s.margin < 0 ? 'text-rose-700' : ''}">${money(s.margin)}</dd></div>` : ''}

}
function bindPermitCosts(s, id, act) {
  $('#permit-save') && ($('#permit-save').onclick = () => {
    const no = $('#permit-no').value.trim();
    if (!no && !s.permit_no) return toast(t('permit_need_ref'), 'err');
    act(() => API.put('/shipments/' + id, { permit_no: no, permit_date: $('#permit-date').value }), t('saved'));
  });
  $('#cost-add') && ($('#cost-add').onclick = () => {
    const amount = +$('#cost-amount').value;
    if (!(amount > 0)) return toast(t('err_required_fields'), 'err');
    act(() => API.post(`/shipments/${id}/costs`, { type: $('#cost-type').value, desc: $('#cost-desc').value, amount, billable: $('#cost-bill').checked }), t('saved'));
  });
  $$('[data-cid]').forEach((tr) => {
    $('.cost-bill', tr).onchange = (e) => act(() => API.put(`/shipments/${id}/costs/${tr.dataset.cid}`, { billable: e.target.checked }), t('saved'));
    if ($('.cost-del', tr)) $('.cost-del', tr).onclick = () => confirm(t('confirm_delete_cost')) && act(() => API.del(`/shipments/${id}/costs/${tr.dataset.cid}`), t('deleted'));
  });
  $('#freight-save') && ($('#freight-save').onclick = () => act(() => API.put('/shipments/' + id, { freight: $('#freight').value }), t('saved')));
}

/* ---------- تفاصيل الشحنة وتسجيل حالة السيارات ---------- */
async function pageShipment(view, m) {
  if (SYS === 'odoo') return pageOrder(view, m);
  const id = m[1];
  const s = await API.get('/shipments/' + id);
  setTitle(s.ref_no);
  const open = !['delivered', 'cancelled'].includes(s.status);
  const counts = { ok: 0, damaged: 0, pending: 0 };
  s.vehicles.forEach((v) => (v.condition === 'pending' ? counts.pending++ : v.condition === 'ok' ? counts.ok++ : counts.damaged++));
  const info = (label, value) => `<div><dt class="text-xs text-slate-500">${label}</dt><dd class="font-medium mt-0.5">${value}</dd></div>`;
  const nextActions = {
    pending: [['in_transit', 'act_start', 'btn-signal'], ['cancelled', 'act_cancel', 'btn-danger']],
    in_transit: [['delivered', 'act_deliver', 'btn-primary']],
  }[s.status] || [];

  view.innerHTML = `
  <div class="flex flex-wrap items-center gap-3 mb-5">
    <a href="#/shipments" class="text-sm text-slate-500 hover:text-ink no-print">${t('back_to_list')}</a>
    <div class="flex-1"></div>
    ${(perm('ship_edit') ? nextActions : []).map(([st, key, cls]) => `<button class="btn ${cls} no-print" data-status="${st}">${t(key)}</button>`).join('')}
    <button class="btn btn-ghost no-print" onclick="window.print()">${icon('print', 'w-4 h-4')} ${t('print')}</button>
    ${perm('delete') ? `<button id="del-ship" class="btn btn-danger no-print" aria-label="${t('delete')}">${icon('trash', 'w-4 h-4')}</button>` : ''}
  </div>

  <section class="card p-4 md:p-6 mb-5">
    <div class="flex flex-wrap items-center gap-3 mb-4">
      <h2 class="text-xl font-semibold">${esc(s.ref_no)}</h2>${statusBadge(s.status)}
    </div>
    <div class="text-lg mb-5">${routeS(s)}</div>
    <dl class="grid grid-cols-2 md:grid-cols-4 gap-x-4 gap-y-4 text-sm">
      ${info(t('driver'), esc(s.driver_name) + (s.driver_phone ? ` <span class="text-slate-500 font-normal" dir="ltr">${esc(s.driver_phone)}</span>` : ''))}
      ${info(t('truck_plate'), val(s.truck_plate))}
      ${info(t('client'), val(s.client_name))}
      ${info(t('vehicle_type'), val(s.vehicle_type))}
      ${info(t('trip_date'), esc(s.trip_date))}
      ${info(t('departure_at'), dt(s.departure_at))}
      ${info(t('arrival_at'), dt(s.arrival_at))}
      ${info(t('created_by'), val(s.created_by_name))}
      ${s.notes ? `<div class="col-span-2 md:col-span-4">${info(t('notes'), esc(s.notes)).replace(/^<div>|<\/div>$/g, '')}</div>` : ''}
    </dl>
    <div class="mt-5 pt-5 border-t border-slate-100 flex flex-wrap items-end gap-2 no-print ${perm('ship_edit') ? '' : 'hidden'}">
      <div class="w-56"><label class="label" for="sap-no">${t('sap_document_no')}</label><input id="sap-no" class="input" value="${esc(s.sap_document_no || '')}" dir="ltr"></div>
      <button id="sap-save" class="btn btn-ghost">${t('save')}</button>
    </div>
  </section>

  ${permitSection(s, open)}
  ${costsSection(s)}

  <section class="card overflow-hidden">
    <div class="p-4 md:p-5 border-b border-slate-200 flex flex-wrap items-center gap-3">
      <h2 class="font-semibold">${t('vehicles')} <span class="text-slate-500 font-normal tabular-nums">(${s.vehicles.length})</span></h2>
      <span class="badge ${COND_CLS.ok}">${t('cond_ok')}: ${counts.ok}</span>
      <span class="badge ${COND_CLS.dent}">${t('damaged')}: ${counts.damaged}</span>
      <span class="badge ${COND_CLS.pending}">${t('not_inspected')}: ${counts.pending}</span>
      <div class="flex-1"></div>
      ${counts.pending && perm('inspect') ? `<button id="mark-ok" class="btn btn-ghost no-print">${icon('check', 'w-4 h-4')} ${t('mark_rest_ok')}</button>` : ''}
    </div>
    <ul class="divide-y divide-slate-100">
      ${s.vehicles.map((v, i) => `
      <li class="p-4 md:p-5" data-vid="${v.id}">
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mb-3">
          <span class="text-xs text-slate-400 tabular-nums w-5">${i + 1}</span>
          <a href="#/search?vin=${esc(v.vin)}" class="vin font-semibold text-road-700 hover:underline" dir="ltr">${esc(v.vin)}</a>
          <span class="text-sm text-slate-500">${[v.model, v.color].filter(Boolean).map(esc).join(' / ')}</span>
          <span class="print:inline hidden">${condBadge(v.condition)}</span>
          <div class="flex-1"></div>
          ${v.inspected_at ? `<span class="text-xs text-slate-500">${dt(v.inspected_at)} · ${val(v.inspected_by_name)}</span>` : ''}
          ${open && perm('delete') ? `<button class="v-remove no-print text-slate-400 hover:text-rose-600 p-1" aria-label="${t('delete')}">${icon('trash', 'w-4 h-4')}</button>` : ''}
        </div>
        <div class="no-print grid gap-2 md:grid-cols-[minmax(0,1.2fr)_minmax(0,1fr)] ${perm('inspect') ? '' : 'hidden'}">
          <div class="flex gap-1.5" role="group" aria-label="${t('condition')}">
            ${['ok', 'dent', 'scratch', 'dent_scratch'].map((c) => `<button type="button" class="cond-btn ${v.condition === c ? COND_ACTIVE[c] : ''}" data-cond="${c}" aria-pressed="${v.condition === c}">${t('cond_' + c)}</button>`).join('')}
          </div>
          <input class="input v-notes" placeholder="${t('condition_notes_ph')}" value="${esc(v.condition_notes || '')}">
        </div>
        ${v.condition_notes ? `<p class="hidden print:block text-sm mt-1">${esc(v.condition_notes)}</p>` : ''}
      </li>`).join('')}
    </ul>
    ${open && perm('ship_add') ? `<div class="p-4 md:p-5 border-t border-slate-200 bg-slate-50 flex flex-wrap gap-2 no-print">
      <input id="add-vin" class="input vin uppercase flex-1 min-w-[220px]" dir="ltr" maxlength="20" placeholder="${t('vin_17')}">
      <button id="add-vin-btn" class="btn btn-ghost">${icon('plus', 'w-4 h-4')} ${t('add_vehicle')}</button>
    </div>` : ''}
  </section>`;

  const reload = async () => { const y = scrollY; await pageShipment(view, m); scrollTo(0, y); };
  const act = async (fn, msg) => { try { await fn(); if (msg) toast(msg); await reload(); } catch (e) { toast(e.message, 'err'); } };

  $$('[data-status]').forEach((b) => (b.onclick = () => {
    if (b.dataset.status === 'cancelled' && !confirm(t('confirm_cancel'))) return;
    if (b.dataset.status === 'delivered' && counts.pending && !confirm(t('confirm_deliver_pending').replace('{n}', counts.pending))) return;
    act(() => API.put('/shipments/' + id, { status: b.dataset.status }), t('saved'));
  }));
  $('#sap-save').onclick = () => act(() => API.put('/shipments/' + id, { sap_document_no: $('#sap-no').value }), t('saved'));
  bindPermitCosts(s, id, act);
  $('#del-ship') && ($('#del-ship').onclick = async () => {
    if (!confirm(t('confirm_delete_shipment'))) return;
    try { await API.del('/shipments/' + id); toast(t('deleted')); location.hash = '#/shipments'; } catch (e) { toast(e.message, 'err'); }
  });
  $('#mark-ok') && ($('#mark-ok').onclick = () => act(() => API.post(`/shipments/${id}/mark-ok`), t('saved')));

  $$('[data-vid]').forEach((li) => {
    const vid = li.dataset.vid;
    const v = s.vehicles.find((x) => String(x.id) === vid);
    $$('[data-cond]', li).forEach((b) => (b.onclick = () =>
      act(() => API.patch(`/shipments/${id}/vehicles/${vid}/condition`, { condition: b.dataset.cond, notes: $('.v-notes', li).value }))));
    /* حفظ الملاحظة دون إعادة رسم الصفحة، كي لا يضيع نقر زر الحالة الذي يلي الكتابة مباشرة */
    $('.v-notes', li).onchange = (e) => API.patch(`/shipments/${id}/vehicles/${vid}/condition`, { condition: cond(S.shipments[id].vehicles[vid]), notes: e.target.value })
      .then(() => toast(t('saved'))).catch((err) => toast(err.message, 'err'));
    const rm = $('.v-remove', li);
    if (rm) rm.onclick = () => confirm(t('confirm_remove_vehicle')) && act(() => API.del(`/shipments/${id}/vehicles/${vid}`), t('deleted'));
  });

  const addBtn = $('#add-vin-btn');
  if (addBtn) {
    const add = async () => {
      const vin = normVin($('#add-vin').value);
      if (!VIN_RE.test(vin)) return toast(t('err_vin_invalid'), 'err');
      try { await API.post(`/shipments/${id}/vehicles`, { vin }); }
      catch (e) {
        if (e.code !== 'vin_active') return toast(e.message + (e.data?.vins ? ': ' + e.data.vins.join(', ') : ''), 'err');
        if (!confirm(t('confirm_active_vins') + '\n\n' + e.data.conflicts.map((c) => `${c.vin} (${c.ref_no})`).join('\n'))) return;
        try { await API.post(`/shipments/${id}/vehicles`, { vin, force: true }); } catch (e2) { return toast(e2.message, 'err'); }
      }
      toast(t('saved')); reload();
    };
    addBtn.onclick = add;
    $('#add-vin').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); add(); } };
  }
}

/* ---------- صفحات البيانات الأساسية (سائقون / عملاء / مستخدمون) ---------- */
function crudPage(cfg) {
  return async (view) => {
    setTitle(t(cfg.title));
    const rows = await API.get(cfg.endpoint + '?all=1');
    const writable = perm('master');
    view.innerHTML = `
    <div class="flex flex-wrap gap-3 items-center mb-5">
      <input id="c-q" class="input max-w-xs" placeholder="${t('search')}">
      <div class="flex-1"></div>
      ${writable ? `<button id="c-add" class="btn btn-primary">${icon('plus', 'w-4 h-4')} ${t(cfg.addLabel)}</button>` : ''}
    </div>
    <div class="card overflow-x-auto"><table class="w-full">
      <thead><tr>${cfg.columns.map((c) => `<th class="th">${t(c.label || c.name)}</th>`).join('')}<th class="th">${t('status')}</th>${writable ? '<th class="th"></th>' : ''}</tr></thead>
      <tbody id="c-body"></tbody></table></div>`;
    const draw = () => {
      const q = $('#c-q').value.trim().toLowerCase();
      const list = rows.filter((r) => !q || cfg.columns.some((c) => String(r[c.name] ?? '').toLowerCase().includes(q)));
      $('#c-body').innerHTML = list.length ? list.map((r) => `<tr class="${r.active ? '' : 'opacity-50'}">
        ${cfg.columns.map((c) => `<td class="td ${c.cls || ''}" ${c.ltr ? 'dir="ltr"' : ''}>${c.render ? c.render(r) : val(r[c.name])}</td>`).join('')}
        <td class="td">${r.active ? `<span class="badge bg-road-50 text-road-700">${t('active')}</span>` : `<span class="badge bg-slate-100 text-slate-500">${t('inactive')}</span>`}</td>
        ${writable ? `<td class="td text-end"><button class="text-road-700 hover:underline text-sm" data-edit="${r.id}">${t('edit')}</button></td>` : ''}</tr>`).join('')
        : `<tr><td class="td text-center text-slate-500 py-10" colspan="${cfg.columns.length + 2}">${t('no_records')}</td></tr>`;
      $$('[data-edit]').forEach((b) => (b.onclick = () => form(rows.find((r) => String(r.id) === b.dataset.edit))));
    };
    const form = (row) => {
      const fields = [...cfg.fields(row)];
      if (row) fields.push({ name: 'active', label: 'status', type: 'select', options: [{ value: 1, label: t('active') }, { value: 0, label: t('inactive') }] });
      openModal(t(row ? 'edit' : cfg.addLabel), fields.map((f) => fieldHtml(f, row ? row[f.name] : undefined)).join(''), async (data) => {
        if (row && 'password' in data && !data.password) delete data.password;
        row ? await API.put(`${cfg.endpoint}/${row.id}`, data) : await API.post(cfg.endpoint, data);
        toast(t('saved')); router();
      });
    };
    $('#c-q').oninput = draw;
    if (writable) $('#c-add').onclick = () => form(null);
    draw();
  };
}

/* المستخدمون والصلاحيات: أدوار جاهزة (إدخالات فقط، تكاليف، تسعير...) أو صلاحيات مخصصة لكل موظف */
const roleLabel = (r) => (r ? t('role_' + r) : t('role_none'));
const permChips = (perms, sys = SYS) => permKeys(sys).filter((k) => perms[k]).map((k) => `<span class="badge bg-slate-100 text-slate-700">${tsys('perm_' + k, sys)}</span>`).join(' ') || `<span class="text-xs text-slate-400">—</span>`;
function permBoxes(role, custom, sys) {
  const eff = role === 'custom' ? custom || {} : permsFor(role, null, sys);
  return `<div class="sm:col-span-2"><div class="grid sm:grid-cols-2 gap-2 rounded-lg border border-slate-200 p-3">
    ${permKeys(sys).map((k) => `<label class="flex items-start gap-2 text-sm"><input type="checkbox" name="p_${sys}_${k}" class="mt-0.5 accent-road-500 w-4 h-4" ${eff[k] ? 'checked' : ''} ${role === 'custom' ? '' : 'disabled'}><span>${tsys('perm_' + k, sys)}<span class="block text-xs text-slate-500">${tsys('permd_' + k, sys)}</span></span></label>`).join('')}
  </div></div>`;
}
function bindPermBoxes(sys, custom) {
  const sel = $('#f-role_' + sys); if (!sel) return;
  sel.onchange = () => { const r = sel.value, eff = r === 'custom' ? custom || {} : permsFor(r, null, sys);
    permKeys(sys).forEach((k) => { const b = $(`[name=p_${sys}_${k}]`); b.checked = !!eff[k]; b.disabled = r !== 'custom'; }); };
}
const formPerms = (data, sys) => { const o = {}; permKeys(sys).forEach((k) => { if (data[`p_${sys}_${k}`]) o[k] = true; }); return o; };
const roleOptions = () => [{ value: '', label: t('role_none') }, ...FLEET_ROLES.map((r) => ({ value: r, label: t('role_' + r) }))];
const sysBlocks = (sysRoles, defaults) => SYS_LIST.map((x) => { const r = (sysRoles || {})[x] || { role: (defaults || {})[x] || '' };
  return `<div class="sm:col-span-2 border-t border-slate-200 pt-3 mt-1 flex items-center gap-2 font-semibold">${icon(SYSTEMS[x].icon, 'w-4 h-4')} ${tsys('sys_title', x)}</div>`
    + fieldHtml({ name: 'role_' + x, label: 'fleet_role', type: 'select', options: roleOptions() }, r.role) + `<div class="hidden sm:block"></div>` + permBoxes(r.role || 'entry', r.custom, x); }).join('');
const collectSystems = (data) => { const o = {}; SYS_LIST.forEach((x) => (o[x] = { role: data['role_' + x] || '', perms: formPerms(data, x) })); return o; };

      + `<p class="sm:col-span-2 text-xs text-slate-500">${t('username_hint')}</p>` + sysBlocks(null, { [SYS]: 'entry' }), async (data) => {
      await API.post('/users', { full_name: data.full_name, username: data.username, password: data.password, systems: collectSystems(data) });
      toast(t('employee_created')); router(true);
    }, t('add_employee'));
    SYS_LIST.forEach((x) => bindPermBoxes(x, {}));
  };
  draw();
}

/* =====================================================================
   واجهة نظام أودو: النقل المبرد والجاف (أغذية / أدوية / عام)
   ===================================================================== */
const TC_CLS = { frozen: 'bg-indigo-100 text-indigo-800', chilled: 'bg-sky-100 text-sky-800', cool: 'bg-cyan-50 text-cyan-800', ambient: 'bg-amber-50 text-amber-800', dry: 'bg-slate-100 text-slate-700' };
const rangeText = (s) => (s.temp_min !== null && s.temp_min !== undefined ? `${s.temp_min}…${s.temp_max}°C` : '—');
const tcBadge = (s) => `<span class="badge ${TC_CLS[s.temp_class || 'dry']}">${(s.temp_class || 'dry') === 'dry' ? '' : '❄ '}${t('tc_' + (s.temp_class || 'dry'))}${isTempControlled(s) ? ` <bdi dir="ltr" class="ms-1">${rangeText(s)}</bdi>` : ''}</span>`;
const catBadges = (cats) => (cats || []).map((c) => `<span class="badge ${c === 'medical' ? 'bg-rose-50 text-rose-700 ring-1 ring-rose-200' : c === 'food' ? 'bg-emerald-50 text-emerald-800 ring-1 ring-emerald-200' : 'bg-slate-100 text-slate-600'}">${t('cat_' + c)}</span>`).join(' ');
const issueText = (x) => t(x.k).replace('{p}', x.p ? t(x.p) : '').replace('{n}', x.n ?? '');
const issuesBadge = (list) => { const b = list.filter((x) => x.lv === 'block').length, w = list.length - b;
  return b ? `<span class="badge bg-rose-600 text-white">⛔ ${b}</span>${w ? ` <span class="badge bg-amber-50 text-amber-800">⚠ ${w}</span>` : ''}` : w ? `<span class="badge bg-amber-50 text-amber-800">⚠ ${w}</span>` : `<span class="badge bg-road-50 text-road-700">✓ ${t('compliant')}</span>`; };
const tempVal = (s) => { const l = s.tsum && s.tsum.last; if (!l) return '<span class="text-slate-400">—</span>';
  const bad = outOfRange(Number(l.value), s.temp_min, s.temp_max);
  return `<span class="tabular-nums font-semibold ${bad ? 'text-rose-700' : 'text-road-700'}" dir="ltr">${l.value}°C</span> <span class="text-xs text-slate-500">${esc(String(l.at).slice(5))}</span>`; };
const nowLocal = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };
const ageHours = (at) => (Date.now() - Date.parse(String(at).replace(' ', 'T'))) / 36e5;
const ageText = (at) => { const h = ageHours(at); return h < 1 ? t('ago_min').replace('{n}', Math.max(0, Math.round(h * 60))) : h < 48 ? t('ago_h').replace('{n}', Math.round(h)) : t('ago_d').replace('{n}', Math.round(h / 24)); };

/* مخطط الحرارة: النطاق المسموح شريط أخضر، والقراءات المنحرفة نقاط حمراء */
function tempChart(s) {
  const pts = s.temps.filter((x) => Number.isFinite(Number(x.value)));
  if (pts.length < 2) return '';
  const W = 640, H = 170, P = 26, vals = pts.map((x) => Number(x.value));
  let lo = Math.min(...vals, s.temp_min ?? Infinity), hi = Math.max(...vals, s.temp_max ?? -Infinity);
  lo = Math.floor(lo - 1); hi = Math.ceil(hi + 1);
  const x = (i) => P + (i * (W - 2 * P)) / (pts.length - 1), y = (v) => H - P - ((v - lo) * (H - 2 * P)) / (hi - lo || 1);
  const band = s.temp_min !== null && s.temp_min !== undefined ? `<rect x="${P}" y="${y(s.temp_max)}" width="${W - 2 * P}" height="${Math.max(1, y(s.temp_min) - y(s.temp_max))}" fill="#0B6B4A" opacity="0.10"/>
    <line x1="${P}" x2="${W - P}" y1="${y(s.temp_max)}" y2="${y(s.temp_max)}" stroke="#0B6B4A" stroke-dasharray="4 4" opacity="0.6"/><line x1="${P}" x2="${W - P}" y1="${y(s.temp_min)}" y2="${y(s.temp_min)}" stroke="#0B6B4A" stroke-dasharray="4 4" opacity="0.6"/>
    <text x="${W - P + 3}" y="${y(s.temp_max) + 4}" font-size="10" fill="#0B6B4A">${s.temp_max}°</text><text x="${W - P + 3}" y="${y(s.temp_min) + 4}" font-size="10" fill="#0B6B4A">${s.temp_min}°</text>` : '';
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(Number(p.value)).toFixed(1)}`).join(' ');
  const dots = pts.map((p, i) => (outOfRange(Number(p.value), s.temp_min, s.temp_max) ? `<circle cx="${x(i).toFixed(1)}" cy="${y(Number(p.value)).toFixed(1)}" r="3.5" fill="#be123c"><title>${esc(p.at)} · ${p.value}°C</title></circle>` : '')).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="w-full h-auto" role="img" aria-label="${t('temp_chart')}" dir="ltr">${band}
    <polyline points="${line}" fill="none" stroke="#15201B" stroke-width="1.6"/>${dots}
    <text x="${P}" y="${H - 6}" font-size="10" fill="#64748b">${esc(String(pts[0].at).slice(5))}</text><text x="${W - P}" y="${H - 6}" font-size="10" fill="#64748b" text-anchor="end">${esc(String(pts[pts.length - 1].at).slice(5))}</text></svg>`;
}
